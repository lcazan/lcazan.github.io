<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Snoozing Builder | v5.5.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="editor.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
        /* --- ADDED SETTINGS MODAL STYLES --- */
        #settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        .settings-modal {
            background: #1e1e1e;
            width: 400px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }
        .settings-close {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
        }
        .settings-close:hover { color: #fff; }
        .settings-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .settings-field label {
            font-size: 12px;
            font-weight: 500;
            color: #aaa;
        }
        .settings-field input, .settings-field textarea {
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        .settings-field input:focus, .settings-field textarea:focus {
            outline: none;
            border-color: #007aff;
        }
        .settings-footer {
            padding: 12px 20px;
            background: #161616;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .settings-btn {
            background: #333;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .settings-btn.primary {
            background: #007aff;
        }
        .settings-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
    <div id="builder-container">
        <div id="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Snoozing Builder
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Add Content</div>
                <button class="insert-btn" onclick="triggerImageAdd()"><i class="fa-solid fa-image"></i> Insert Image</button>
                <button class="insert-btn" onclick="triggerContainerAdd()"><i class="fa-solid fa-square"></i> Insert Container</button>
                <button class="insert-btn" onclick="openLayersPanel()"><i class="fa-solid fa-layer-group"></i> Manage Layers</button>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Project</div>
                <button class="insert-btn" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Page Settings</button>
                <button class="insert-btn" onclick="masterSave()"><i class="fa-solid fa-download"></i> Export HTML/ZIP</button>
            </div>
        </div>

        <div id="workspace">
            <div id="sticky-toolbar">
                <div id="toolbar-content">Select an element to edit</div>
            </div>
            <div id="preview-container">
                <iframe id="preview-frame" src="template.html"></iframe>
            </div>
        </div>
    </div>

    <div id="settings-overlay">
        <div class="settings-modal">
            <div class="settings-header">
                <h3>Page Settings</h3>
                <button class="settings-close" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-field">
                    <label for="set-page-name">Page Name (URL Slug e.g., snoo-rental)</label>
                    <input type="text" id="set-page-name" placeholder="snoo-rental">
                </div>
                <div class="settings-field">
                    <label for="set-page-title">Page Title (Browser Tab)</label>
                    <input type="text" id="set-page-title" placeholder="Snoo Rental & Reviews">
                </div>
                <div class="settings-field">
                    <label for="set-page-desc">Meta Description</label>
                    <textarea id="set-page-desc" rows="3" placeholder="Page meta description..."></textarea>
                </div>
            </div>
            <div class="settings-footer">
                <button class="settings-btn" onclick="closeSettingsModal()">Cancel</button>
                <button class="settings-btn primary" onclick="saveSettingsModal()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="layers-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; justify-content:center; align-items:center;">
        <div style="background:#1e1e1e; width:450px; border-radius:12px; border:1px solid #333; padding:20px; color:#fff;">
            <h3>Manage Layers</h3>
            <div id="layers-list" style="margin:15px 0; max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="settings-btn" onclick="closeLayersPanel()">Cancel</button>
                <button class="settings-btn primary" onclick="saveLayersOrder()">Apply Order</button>
            </div>
        </div>
    </div>

    <script>
        let project = {
            title: "Snoo Rental Page",
            pageName: "snoo-rental",
            metaDesc: "",
            body: { blocks: [] }
        };

        let layersWorkingOrder = [];
        const frame = document.getElementById('preview-frame');

        frame.addEventListener('load', () => {
            initEditor();
        });

        function initEditor() {
            const iframeDoc = frame.contentDocument;
            if (!iframeDoc) return;

            let root = iframeDoc.getElementById('editor-root');
            if (!root) {
                root = iframeDoc.createElement('div');
                root.id = 'editor-root';
                iframeDoc.body.appendChild(root);
            }

            iframeDoc.addEventListener('click', (e) => {
                const editable = e.target.closest('.editable');
                if (editable) {
                    selectElement(editable);
                } else {
                    deselectElement();
                }
            });
        }

        function selectElement(el) {
            const iframeDoc = frame.contentDocument;
            iframeDoc.querySelectorAll('.editable').forEach(node => node.classList.remove('selected'));
            el.classList.add('selected');
            renderToolbar(el);
        }

        function deselectElement() {
            const iframeDoc = frame.contentDocument;
            if (iframeDoc) iframeDoc.querySelectorAll('.editable').forEach(node => node.classList.remove('selected'));
            document.getElementById('toolbar-content').innerHTML = 'Select an element to edit';
        }

        function renderToolbar(el) {
            const toolbar = document.getElementById('toolbar-content');
            if (el.classList.contains('block_image')) {
                toolbar.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span>Image</span>
                        <input type="text" id="tool-alt" placeholder="Alt text" value="${el.querySelector('img')?.getAttribute('alt') || ''}" oninput="updateImageAlt(this.value)">
                        <input type="text" id="tool-link" placeholder="Link URL" value="${el.getAttribute('data-link') || ''}" oninput="updateImageLink(this.value)">
                        <button onclick="fitWidth(true)">Fit to Width</button>
                        <button onclick="fitWidth(false)">Reset Width</button>
                    </div>
                `;
            } else if (el.classList.contains('block_container')) {
                toolbar.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span>Container</span>
                        <input type="color" value="${el.style.backgroundColor || '#ffffff'}" onchange="updateContainerBg(this.value)">
                        <button onclick="addNestedImage()">Add Image inside Container</button>
                    </div>
                `;
            } else {
                toolbar.innerHTML = '<span>Selected element</span>';
            }
        }

        function updateImageAlt(val) {
            const iframeDoc = frame.contentDocument;
            const sel = iframeDoc.querySelector('.editable.selected');
            if (sel) {
                const img = sel.querySelector('img');
                if (img) img.setAttribute('alt', val);
                saveBlockState(sel);
            }
        }

        function updateImageLink(val) {
            const iframeDoc = frame.contentDocument;
            const sel = iframeDoc.querySelector('.editable.selected');
            if (sel) {
                sel.setAttribute('data-link', val);
                saveBlockState(sel);
            }
        }

        function fitWidth(isFull) {
            const iframeDoc = frame.contentDocument;
            const sel = iframeDoc.querySelector('.editable.selected');
            if (sel) {
                sel.style.width = isFull ? '100%' : '200px';
                saveBlockState(sel);
            }
        }

        function updateContainerBg(color) {
            const iframeDoc = frame.contentDocument;
            const sel = iframeDoc.querySelector('.editable.selected');
            if (sel) {
                sel.style.backgroundColor = color;
                saveBlockState(sel);
            }
        }

        function addNestedImage() {
            const iframeDoc = frame.contentDocument;
            const sel = iframeDoc.querySelector('.editable.selected');
            if (sel && sel.classList.contains('block_container')) {
                const url = prompt("Enter Image URL:", "https://via.placeholder.com/400");
                if (url) {
                    const imgWrapper = iframeDoc.createElement('div');
                    imgWrapper.className = 'editable block_image';
                    imgWrapper.contentEditable = "false";
                    imgWrapper.style.width = '200px';
                    imgWrapper.innerHTML = `<img src="${url}">`;
                    sel.appendChild(imgWrapper);
                    saveBlockState(sel);
                }
            }
        }

        function triggerImageAdd() {
            const url = prompt("Enter Image URL:", "https://via.placeholder.com/400");
            if (!url) return;
            const iframeDoc = frame.contentDocument;
            const root = iframeDoc.getElementById('editor-root');
            if (!root) return;

            const el = iframeDoc.createElement('div');
            el.className = 'editable block_image';
            el.contentEditable = "false";
            el.style.width = '200px';
            el.innerHTML = `<img src="${url}">`;
            root.appendChild(el);
            saveImageBlock(el);
        }

        function triggerContainerAdd() {
            const iframeDoc = frame.contentDocument;
            const root = iframeDoc.getElementById('editor-root');
            if (!root) return;

            const el = iframeDoc.createElement('div');
            el.className = 'editable block_container';
            el.contentEditable = "false";
            el.style.padding = '20px';
            el.style.background = '#f9f9f9';
            root.appendChild(el);
            saveContainerBlock(el);
        }

        function saveBlockState(el) {
            if (el.classList.contains('block_image')) {
                saveImageBlock(el);
            } else if (el.classList.contains('block_container')) {
                saveContainerBlock(el);
            }
        }

        function saveImageBlock(el) {
            let blockId = el.getAttribute('data-block-id');
            if (!blockId) {
                blockId = 'blk_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                el.setAttribute('data-block-id', blockId);
            }

            const img = el.querySelector('img');
            const blockData = {
                id: blockId,
                type: 'image',
                src: img ? img.getAttribute('src') : '',
                width: el.style.width || '200px',
                scaleFactor: el.getAttribute('data-scale-factor') || '1.0',
                align: el.style.textAlign || '',
                link: el.getAttribute('data-link') || '',
                alt: img ? (img.getAttribute('alt') || '') : ''
            };

            const existingIndex = project.body.blocks.findIndex(b => b.id === blockId);
            if (existingIndex !== -1) {
                project.body.blocks[existingIndex] = blockData;
            } else {
                project.body.blocks.push(blockData);
            }
        }

        function saveContainerBlock(el) {
            let blockId = el.getAttribute('data-block-id');
            if (!blockId) {
                blockId = 'blk_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                el.setAttribute('data-block-id', blockId);
            }

            const imgWrapper = el.querySelector('.block_image');
            let imgData = null;
            if (imgWrapper) {
                const img = imgWrapper.querySelector('img');
                imgData = {
                    src: img ? img.getAttribute('src') : '',
                    alt: img ? (img.getAttribute('alt') || '') : '',
                    link: imgWrapper.getAttribute('data-link') || '',
                    scaleFactor: imgWrapper.getAttribute('data-scale-factor') || '1.0'
                };
            }

            const blockData = {
                id: blockId,
                type: 'container',
                bgColor: el.style.backgroundColor || '',
                image: imgData
            };

            const existingIndex = project.body.blocks.findIndex(b => b.id === blockId);
            if (existingIndex !== -1) {
                project.body.blocks[existingIndex] = blockData;
            } else {
                project.body.blocks.push(blockData);
            }
        }

        function renderPage() {
            const iframeDoc = frame.contentDocument;
            if (!iframeDoc) return;
            let root = iframeDoc.getElementById('editor-root');
            if (!root) {
                root = iframeDoc.createElement('div');
                root.id = 'editor-root';
                iframeDoc.body.appendChild(root);
            }
            root.innerHTML = '';

            project.body.blocks.forEach(block => {
                if (block.type === 'image') {
                    const el = iframeDoc.createElement('div');
                    el.className = 'editable block_image';
                    el.contentEditable = "false";
                    el.setAttribute('data-block-id', block.id);
                    el.setAttribute('data-scale-factor', block.scaleFactor || '1.0');
                    
                    let w = block.width || '200px';
                    if (typeof w === 'number') w = w + 'px';
                    el.style.width = w;

                    el.innerHTML = `<img src="${block.src}">`;
                    const img = el.querySelector('img');
                    if (block.alt && img) img.setAttribute('alt', block.alt);
                    if (block.link) el.setAttribute('data-link', block.link);
                    if (block.align) {
                        el.style.textAlign = block.align;
                    }
                    root.appendChild(el);
                } else if (block.type === 'container') {
                    const el = iframeDoc.createElement('div');
                    el.className = 'editable block_container';
                    el.contentEditable = "false";
                    el.setAttribute('data-block-id', block.id);
                    if (block.bgColor) el.style.backgroundColor = block.bgColor;

                    if (block.image) {
                        const imgWrapper = iframeDoc.createElement('div');
                        // FIX: Added 'editable' so nested image can be re-selected after clicking away
                        imgWrapper.className = 'editable block_image';
                        imgWrapper.contentEditable = "false";
                        imgWrapper.setAttribute('data-scale-factor', block.image.scaleFactor || '1.0');
                        imgWrapper.style.width = '200px';
                        imgWrapper.innerHTML = `<img src="${block.image.src}">`;
                        
                        const innerImg = imgWrapper.querySelector('img');
                        if (block.image.alt && innerImg) innerImg.setAttribute('alt', block.image.alt);
                        if (block.image.link) imgWrapper.setAttribute('data-link', block.image.link);
                        el.appendChild(imgWrapper);
                    }
                    root.appendChild(el);
                }
            });
        }

        function openSettingsModal() {
            document.getElementById('set-page-name').value = project.pageName || '';
            document.getElementById('set-page-title').value = project.title || '';
            document.getElementById('set-page-desc').value = project.metaDesc || '';
            document.getElementById('settings-overlay').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settings-overlay').style.display = 'none';
        }

        function saveSettingsModal() {
            project.pageName = document.getElementById('set-page-name').value;
            project.title = document.getElementById('set-page-title').value;
            project.metaDesc = document.getElementById('set-page-desc').value;
            closeSettingsModal();
        }

        function openLayersPanel() {
            const list = document.getElementById('layers-list');
            list.innerHTML = '';
            layersWorkingOrder = project.body.blocks.map(b => b.id);
            
            project.body.blocks.forEach(block => {
                const item = document.createElement('div');
                item.style.cssText = 'padding:10px; background:#2a2a2a; border-radius:6px; display:flex; justify-content:space-between; align-items:center;';
                item.innerHTML = `<span>${block.type.toUpperCase()} (${block.id})</span>`;
                list.appendChild(item);
            });
            document.getElementById('layers-overlay').style.display = 'flex';
        }

        function closeLayersPanel() {
            document.getElementById('layers-overlay').style.display = 'none';
        }

        function saveLayersOrder() {
            renderPage();
            closeLayersPanel();
        }

        async function masterSave() {
            const iframeDoc = frame.contentDocument;
            const editorRoot = iframeDoc.getElementById('editor-root');
            if (!editorRoot) return;

            const zip = new JSZip();
            const pageContent = editorRoot.innerHTML;
            
            const htmlExport = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>${project.title}</title>
    <meta name="description" content="${project.metaDesc}">
    <link rel="stylesheet" href="msb.css">
</head>
<body>
    <div id="editor-root">${pageContent}</div>
</body>
</html>`;

            zip.file((project.pageName || 'index') + '.html', htmlExport);
            zip.file('project.json', JSON.stringify(project, null, 2));

            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = (project.pageName || 'project') + '.zip';
            a.click();
        }
    </script>
</body>
</html>
