    function addResizeHandle(el) {
        const handle = frame.contentDocument.createElement('div'); handle.className = 'resize-handle';
        const inDiv = el.closest('.block_container');
        const startResize = (e) => {
            e.preventDefault(); e.stopPropagation(); isResizing = true;
            const startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const startW = el.offsetWidth;
            const scale = wrapper.offsetWidth / ({ 'desktop': 1200, 'android': 448, 'iphone': 393 }[currentMode]);
            const onMove = (mE) => {
                const curX = mE.type.includes('touch') ? mE.touches[0].clientX : mE.clientX;
                let newW = startW + (curX - startX) / scale;
                if (inDiv) {
                    const parentW = inDiv.offsetWidth; const baseW = (parentW > 744) ? parentW * 0.618 : parentW;
                    if (newW > baseW) newW = baseW;
                    el.setAttribute('data-scale-factor', (newW / baseW).toFixed(4));
                }
                if (newW > 40) el.style.width = newW + 'px';
            };
            const onUp = () => {
                isResizing = false;
                frame.contentDocument.removeEventListener('mousemove', onMove); frame.contentDocument.removeEventListener('mouseup', onUp);
                frame.contentDocument.removeEventListener('touchmove', onMove); frame.contentDocument.removeEventListener('touchend', onUp);
            };
            frame.contentDocument.addEventListener('mousemove', onMove); frame.contentDocument.addEventListener('mouseup', onUp);
            frame.contentDocument.addEventListener('touchmove', onMove, {passive: false}); frame.contentDocument.addEventListener('touchend', onUp);
        };
        handle.addEventListener('mousedown', startResize); handle.addEventListener('touchstart', startResize, {passive: false});
        el.appendChild(handle);
    }
    function fitToWidth() {
        if (!selectedEl) return;
        const inDiv = selectedEl.closest('.block_container');
        if (inDiv) {
            selectedEl.setAttribute('data-scale-factor', '1.0');
            // Apply immediately — data-scale-factor changes don't change the
            // container's own size, so they never trigger the
            // ResizeObserver on their own. Without this, the new width
            // wouldn't show until something else happened to cause a
            // resize/re-render (e.g. clicking away).
            if (frame.contentWindow.applyDivImageLayout) {
                frame.contentWindow.applyDivImageLayout(inDiv);
            }
        } else {
            selectedEl.style.width = '100%';
            selectedEl.style.display = 'block';
            selectedEl.style.margin = '0 auto';
        }
    }
    function toggleSpacerLine() { if (!selectedEl) return; const currentLine = selectedEl.style.borderBottom; selectedEl.style.borderBottom = (currentLine === 'none' || !currentLine) ? '1px solid #eee' : 'none'; }
    function updateColor(val) { if(selectedEl) selectedEl.style.backgroundColor = val; }

// Builds the nav-sidebar's menu HTML from project.menu and writes it
// into the live page. This is the exact same HTML-generation logic
// saveMenuChanges() always used — factored out so it can also run as part
// of the normal render pipeline (renderPage()), keeping the on-page menu in
// sync with the JSON any time the page re-renders, not just right after the
// menu editor's Save button is pressed. The markup shape and expand/
// collapse behavior (toggleDropdown, sub-nav classes, etc.) are completely
// untouched — this only changes where the data comes from.
function renderMenu() {
    const doc = frame.contentDocument;
    if (!doc) return;
    const navContent = doc.querySelector('.nav-content');
    if (!navContent) return;

    let html = '';
    (project.menu || []).forEach(item => {
        if (!item.children || item.children.length === 0) {
            html += `<a href="${item.url}">${item.label}</a>\n`;
        } else {
            html += `<a href="javascript:void(0)" class="dropdown-btn" onclick="toggleDropdown(this)">${item.label} <i class="fa-solid fa-caret-down"></i></a>\n`;
            html += `<div class="sub-nav">\n`;
            item.children.forEach(sub => {
                html += `    <a href="${sub.url}">${sub.label}</a>\n`;
            });
            html += `</div>\n`;
        }
    });

    navContent.innerHTML = html;
}

function saveMenuChanges() {
    // JSON SOURCE OF TRUTH: menuData (the editor's working copy) becomes
    // the real project.menu here — deep-copied so later in-editor
    // edits can't accidentally alias back into the saved data.
    project.menu = JSON.parse(JSON.stringify(menuData));
    renderMenu();
    closeMenuEditor();
}

function getBlockLabel(block) {
    switch (block.type) {
        case 'text': {
            const plain = (block.contentHTML || '').replace(/<[^>]*>/g, '').trim();
            const variantLabel = block.variant === 'section_heading' ? 'T1' :
                                  block.variant === 'block_heading' ? 'T2' : 'T3';
            const excerpt = plain.length > 26 ? plain.slice(0, 26) + '…' : plain;
            return `Text (${variantLabel})${excerpt ? ': "' + excerpt + '"' : ''}`;
        }
        case 'spacer': return 'Spacer';
        case 'button': return `Button${block.label ? ': "' + block.label + '"' : ''}`;
        case 'customHtml': return 'Custom HTML';
        case 'image': return 'Image';
        case 'multiImage': return `Multi-Image Row (${(block.items || []).length} items)`;
        case 'gallery': return `Gallery (${(block.images || []).length} images)`;
        case 'container': {
            const parts = [];
            if (block.image) parts.push('image');
            const childCount = (block.children || []).length;
            if (childCount) parts.push(`${childCount} item${childCount === 1 ? '' : 's'}`);
            return `Div${parts.length ? ' (' + parts.join(', ') + ')' : ' (empty)'}`;
        }
        case 'contactForm': return 'Contact Form';
        default: return block.type;
    }
}

// Icon (Font Awesome class) matching each block type, reusing the same
// icons used in the sidebar insert buttons where applicable.
function getBlockIcon(type) {
    const icons = {
        text: 'fa-font',
        spacer: 'fa-arrows-up-down',
        button: 'fa-square',
        customHtml: 'fa-code',
        image: 'fa-image',
        multiImage: 'fa-images',
        gallery: 'fa-images',
        container: 'fa-vector-square',
        contactForm: 'fa-envelope'
    };
    return icons[type] || 'fa-cube';
}

function openLayersPanel() {
    // Save (but not necessarily render) whatever's currently selected, and
    // clear selection, so the panel's snapshot of getCurrentPage().body.blocks is fully
    // up to date. deselectAll() also renders, which is fine/expected here.
    if (selectedEl) deselectAll();

    switchDrawerTab('layers');
    layersWorkingOrder = getCurrentPage().body.blocks.map(b => b.id);
    renderLayersList();
    document.getElementById('layers-panel').classList.add('open');
}

function closeLayersPanel() {
    document.getElementById('layers-panel').classList.remove('open');
    layersWorkingOrder = [];
}

function toggleLayersPanel() {
    const panel = document.getElementById('layers-panel');
    if (panel.classList.contains('open')) {
        closeLayersPanel();
    } else {
        openLayersPanel();
    }
}

function switchDrawerTab(tab) {
    const isLayers = tab === 'layers';
    document.getElementById('drawer-tab-btn-layers').classList.toggle('active', isLayers);
    document.getElementById('drawer-tab-btn-pages').classList.toggle('active', !isLayers);
    document.getElementById('drawer-tab-layers').style.display = isLayers ? 'flex' : 'none';
    document.getElementById('drawer-tab-pages').style.display = isLayers ? 'none' : 'flex';
    if (!isLayers) renderPagesList();
}

// Rebuilds the row list from layersWorkingOrder + getCurrentPage().body.blocks (for
// labels/icons). Called on open, and after every completed drag, so drag
// state (transforms, etc.) always resets cleanly.
function renderLayersList() {
    const container = document.getElementById('layers-list');
    if (!container) return;
    container.innerHTML = '';

    if (layersWorkingOrder.length === 0) {
        container.innerHTML = '<div class="layers-empty">No sections yet.</div>';
        return;
    }

    layersWorkingOrder.forEach(id => {
        const block = getCurrentPage().body.blocks.find(b => b.id === id);
        if (!block) return;

        const row = document.createElement('div');
        row.className = 'layer-row';
        row.setAttribute('data-block-id', id);
        row.innerHTML = `
            <span class="layer-drag-handle"><i class="fa-solid fa-grip-lines"></i></span>
            <span class="layer-icon"><i class="fa-solid ${getBlockIcon(block.type)}"></i></span>
            <span class="layer-label"></span>
            <span class="layer-delete-btn" title="Delete"><i class="fa-solid fa-trash"></i></span>
        `;
        // Set label via textContent (not innerHTML) so block content/labels
        // containing "<" or "&" can't break the row's markup.
        row.querySelector('.layer-label').textContent = getBlockLabel(block);

        const handle = row.querySelector('.layer-drag-handle');
        handle.addEventListener('pointerdown', (e) => startLayerDrag(e, row));

        row.querySelector('.layer-delete-btn').addEventListener('click', (e) => deleteBlockFromLayersPanel(id, e));

        container.appendChild(row);
    });
}

// Pointer-based (mouse + touch, unified) drag-to-reorder. While dragging,
// the picked-up row visually follows the pointer and other rows shift out
// of the way to preview where it will land; layersWorkingOrder itself is
// only updated once, on release, then the list is fully rebuilt to reset
// all the transforms cleanly.
function startLayerDrag(e, row) {
    e.preventDefault();
    const container = document.getElementById('layers-list');
    const rows = Array.from(container.children);
    const startIndex = rows.indexOf(row);
    if (startIndex === -1) return;
    const rowHeight = row.offsetHeight + 8; // include the row's margin-bottom
    const startClientY = e.clientY;
    let targetIndex = startIndex;

    row.classList.add('dragging');
    try { row.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }

    const onMove = (moveE) => {
        const deltaY = moveE.clientY - startClientY;
        row.style.transform = `translateY(${deltaY}px)`;

        const shift = Math.round(deltaY / rowHeight);
        targetIndex = Math.max(0, Math.min(rows.length - 1, startIndex + shift));

        rows.forEach((r, i) => {
            if (r === row) return;
            if (targetIndex > startIndex && i > startIndex && i <= targetIndex) {
                r.style.transform = `translateY(-${rowHeight}px)`;
            } else if (targetIndex < startIndex && i < startIndex && i >= targetIndex) {
                r.style.transform = `translateY(${rowHeight}px)`;
            } else {
                r.style.transform = '';
            }
        });
    };

    const onUp = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);

        if (targetIndex !== startIndex) {
            const [movedId] = layersWorkingOrder.splice(startIndex, 1);
            layersWorkingOrder.splice(targetIndex, 0, movedId);
        }

        renderLayersList(); // full rebuild — cleanly resets all row positions
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
}

// Applies the panel's pending order to getCurrentPage().body.blocks for real, re-renders
// the live page to match, and closes the panel. This is the ONLY point
// where dragging in the layers panel actually affects the page.
function saveLayersOrder() {
    const reordered = layersWorkingOrder
        .map(id => getCurrentPage().body.blocks.find(b => b.id === id))
        .filter(Boolean);

    // Defensive: anything somehow missing from the working order (should
    // not normally happen) is kept, appended at the end, rather than
    // silently dropped.
    getCurrentPage().body.blocks.forEach(b => {
        if (!reordered.includes(b)) reordered.push(b);
    });

    getCurrentPage().body.blocks = reordered;
    renderPage();
    closeLayersPanel();
}

// Deletes a block directly from the Layers list — immediate (confirm-
// gated), not staged like drag-reordering is. Removes it from both
// getCurrentPage().body.blocks and the panel's own working order, clears
// selection if the deleted block was selected, then re-renders both the
// live page and the list.
function deleteBlockFromLayersPanel(blockId, event) {
    if (event) event.stopPropagation();
    if (!confirm('Delete this section? This cannot be undone.')) return;

    getCurrentPage().body.blocks = getCurrentPage().body.blocks.filter(b => b.id !== blockId);
    layersWorkingOrder = layersWorkingOrder.filter(id => id !== blockId);

    if (selectedEl && selectedEl.getAttribute && selectedEl.getAttribute('data-block-id') === blockId) {
        selectedEl = null;
        toolbarContent.style.visibility = 'hidden';
    }

    renderPage();
    renderLayersList();
}

// --- PAGES TAB ---

// Renders the Pages tab's list — one row per project.pages entry, with the
// currently-open page highlighted, and a click-to-switch handler. Called
// whenever the Pages tab is opened, and after anything that might change a
// page's displayed name/slug (e.g. Settings being saved, a page being added).
function renderPagesList() {
    const container = document.getElementById('pages-list');
    if (!container) return;
    container.innerHTML = '';

    project.pages.forEach(page => {
        const row = document.createElement('div');
        row.className = 'layer-row' + (page.id === currentPageId ? ' active-page-row' : '');
        row.innerHTML = `
            <span class="layer-icon"><i class="fa-solid fa-file"></i></span>
            <span class="layer-label"></span>
        `;
        row.querySelector('.layer-label').textContent = page.name + (page.slug ? ' (' + page.slug + ')' : '');
        row.addEventListener('click', () => switchToPage(page.id));
        container.appendChild(row);
    });
}

// Switches which page is being edited/previewed: commits/discards whatever
// was mid-edit on the OLD page first (deselectAll() also saves+renders it),
// then swaps currentPageId and renders the NEW page's blocks/header into
// the iframe. Menu and footer are GLOBAL, so they don't need to change.
function switchToPage(pageId) {
    if (pageId === currentPageId) return;
    if (selectedEl) deselectAll();
    currentPageId = pageId;
    renderPagesList();
    renderPage();
    closeLayersPanel();
}

// Creates a new page — starting from the same blank template every project
// starts with (see makeBlankPage()) — switches to it immediately, and
// refreshes the Pages list.
function addNewPage() {
    const name = prompt('Name for the new page:', 'New Page');
    if (!name) return;
    const slug = name.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');

    if (selectedEl) deselectAll();

    const page = makeBlankPage(name.trim(), slug);
    project.pages.push(page);
    currentPageId = page.id;
    renderPagesList();
    renderPage();
}




// Deselect when clicking empty space in the Sidebar or Toolbar
document.addEventListener('click', (e) => {
    // NEW: If you click anywhere outside a flyout group, close the menus
    if (!e.target.closest('.sidebar-flyout-group')) {

    }

    const clickedSidebar = e.target.closest('#sidebar');

// ==========================================================
// PROJECT STARTUP: New Project / Continue Project
// ==========================================================
// Everything below gates the existing init() (which loads template.html
// into the preview iframe and sets up all the interaction listeners) behind
// picking or remembering a real project folder via the File System Access
// API. init() itself is untouched — it's just no longer called directly on
// window.onload; it's called once a projectDirHandle (and imagesDirHandle)
// are ready, either from a fresh "New Project" pick or a remembered/browsed
// "Continue Project".

const PROJECTS_DB_NAME = 'msb_builder_db';
const PROJECTS_STORE = 'recentProjects';

function openProjectsDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(PROJECTS_DB_NAME, 1);
        req.onupgradeneeded = () => {
            req.result.createObjectStore(PROJECTS_STORE, { keyPath: 'name' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function saveRecentProject(name, dirHandle) {
    const db = await openProjectsDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PROJECTS_STORE, 'readwrite');
        tx.objectStore(PROJECTS_STORE).put({ name: name, dirHandle: dirHandle, lastOpened: Date.now() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

async function getRecentProjects() {
    const db = await openProjectsDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PROJECTS_STORE, 'readonly');
        const req = tx.objectStore(PROJECTS_STORE).getAll();
        req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.lastOpened - a.lastOpened));
        req.onerror = () => reject(req.error);
    });
}

async function getRecentProjectByName(name) {
    const db = await openProjectsDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PROJECTS_STORE, 'readonly');
        const req = tx.objectStore(PROJECTS_STORE).get(name);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
    });
}

// Entry point (replaces window.onload = init directly). Feature-detects the
// File System Access API — this builder can't function without it (every
// image and the project file itself now live on real disk), so on browsers
// that don't support it (Safari, Firefox, non-Chromium mobile) this blocks
// with a clear message rather than loading a broken editor.
function startupCheck() {
    if (!('showDirectoryPicker' in window)) {
        document.body.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#111; color:#eee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; text-align:center; padding:30px; box-sizing:border-box;">
                <div style="max-width:420px;">
                    <h2 style="color:#ff6b6b; margin-bottom:12px;">Browser Not Supported</h2>
                    <p style="line-height:1.6; color:#ccc;">My Snoozing Baby Builder needs direct folder access on your device, which this browser doesn't provide.</p>
                    <p style="line-height:1.6; color:#ccc;">Please open this page in <strong>Chrome or Edge</strong> (desktop, or Chrome on Android) to continue.</p>
                </div>
            </div>
        `;
        return;
    }
    document.getElementById('project-picker-overlay').style.display = 'flex';
    showProjectPickerChoice();
}

// Re-opens the same New/Continue picker mid-session (the sidebar's "Switch
// Project" button) — lets the user open a different project without
// reloading the page. Reuses the exact same flow as the initial startup.
// Unlike the mandatory startup gate, this shows a close (×) button, since
// there's already an open project to safely return to.
function openProjectPicker() {
    document.getElementById('project-picker-overlay').style.display = 'flex';
    const closeBtn = document.getElementById('project-picker-close');
    if (closeBtn) closeBtn.style.display = projectDirHandle ? 'inline' : 'none';
    showProjectPickerChoice();
}

function closeProjectPicker() {
    document.getElementById('project-picker-overlay').style.display = 'none';
}

// Writes the entire project object as JSON to <project.meta.name>.json
// inside the currently open project folder. This is now the ONLY save
// mechanism for the project itself — the old zip-based export (masterSave)
// has been removed entirely. Producing a final, publishable static HTML
// export remains a separate, not-yet-built feature.
async function saveProjectToFolder() {
    if (!projectDirHandle) {
        alert('No project folder is open.');
        return;
    }
    if (!project.meta || !project.meta.name) {
        alert('This project has no name set.');
        return;
    }

    // Commit whatever's currently selected/being edited first, so the
    // saved JSON reflects the latest state.
    if (selectedEl) deselectAll();

    try {
        const fileHandle = await projectDirHandle.getFileHandle(project.meta.name + '.json', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(project, null, 2));
        await writable.close();

        const msg = document.createElement('div');
        msg.innerHTML = `<i class="fa-solid fa-circle-check"></i> Project saved: ${project.meta.name}.json`;
        msg.style.cssText = "position:fixed; bottom:20px; right:20px; background:#2ecc71; color:white; padding:12px 20px; border-radius:8px; font-weight:bold; z-index:99999; box-shadow:0 5px 15px rgba(0,0,0,0.3); font-family:sans-serif;";
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 3000);
    } catch (err) {
        alert('Could not save project: ' + ((err && err.message) || err));
    }
}

function showProjectPickerChoice() {
    const body = document.getElementById('project-picker-body');
    body.innerHTML = `
        <p style="color:#aaa; font-size:13px; margin-bottom:20px;">Choose how you'd like to start.</p>
        <button class="save-settings-btn" style="width:100%; margin-bottom:10px; box-sizing:border-box;" onclick="showNewProjectForm()">+ New Project</button>
        <button class="save-settings-btn" style="width:100%; background:#444; box-sizing:border-box;" onclick="showContinueProjectList()">Continue a Project</button>
    `;
}

function showNewProjectForm() {
    pendingNewProjectDirHandle = null;
    const body = document.getElementById('project-picker-body');
    body.innerHTML = `
        <div class="settings-form-group">
            <label>Project Name</label>
            <input type="text" id="new-project-name" placeholder="My Snoozing Baby Site" oninput="checkNewProjectReady()">
        </div>
        <div class="settings-form-group">
            <label>Project Folder</label>
            <button class="save-settings-btn" style="width:100%; background:#444; box-sizing:border-box;" onclick="pickNewProjectFolder()">Choose Folder…</button>
            <div id="new-project-folder-status" style="margin-top:8px; font-size:12px; color:#888;">No folder selected yet.</div>
        </div>
        <button class="save-settings-btn" id="new-project-confirm-btn" style="width:100%; margin-top:15px; box-sizing:border-box;" disabled onclick="confirmNewProject()">Create Project</button>
        <button class="save-settings-btn" style="width:100%; background:transparent; color:#888; margin-top:8px; box-sizing:border-box;" onclick="showProjectPickerChoice()">Back</button>

let pendingNewProjectDirHandle = null;

async function pickNewProjectFolder() {
    try {
        pendingNewProjectDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('new-project-folder-status').textContent = 'Selected: ' + pendingNewProjectDirHandle.name;
        checkNewProjectReady();
    } catch (err) {
        // User cancelled the picker — not worth surfacing as an error.
    }
}

function checkNewProjectReady() {
    const nameInput = document.getElementById('new-project-name');
    const btn = document.getElementById('new-project-confirm-btn');
    if (!nameInput || !btn) return;
    btn.disabled = !(nameInput.value.trim() && pendingNewProjectDirHandle);
}

async function confirmNewProject() {
    const name = document.getElementById('new-project-name').value.trim();
    if (!name || !pendingNewProjectDirHandle) return;

    projectDirHandle = pendingNewProjectDirHandle;
    imagesDirHandle = await projectDirHandle.getDirectoryHandle('images', { create: true });

    project.meta.name = name;
    project.meta.nextImageNumber = 1;

    await saveRecentProject(name, projectDirHandle);

    document.getElementById('project-picker-overlay').style.display = 'none';
    init();
}

async function showContinueProjectList() {
    const body = document.getElementById('project-picker-body');
    body.innerHTML = `<p style="color:#888; font-size:13px;">Loading recent projects…</p>`;

    let recents = [];
    try {
        recents = await getRecentProjects();
    } catch (err) {
        recents = [];
    }

    let listHtml = '';
    if (recents.length === 0) {
        listHtml = `<p style="color:#888; font-size:13px;">No remembered projects yet on this device.</p>`;
    } else {
        listHtml = recents.map(r => `
            <button class="save-settings-btn" style="width:100%; background:#444; margin-bottom:8px; text-align:left; box-sizing:border-box;" onclick="continueRecentProject('${r.name.replace(/'/g, "\\'")}')">
                ${r.name}
            </button>
        `).join('');
    }

    body.innerHTML = `
        ${listHtml}
        <button class="save-settings-btn" style="width:100%; background:#333; margin-top:10px; box-sizing:border-box;" onclick="browseForProjectFolder()">Browse for a Folder…</button>
        <button class="save-settings-btn" style="width:100%; background:transparent; color:#888; margin-top:8px; box-sizing:border-box;" onclick="showProjectPickerChoice()">Back</button>
    `;
}

async function continueRecentProject(name) {
    let record;
    try {
        record = await getRecentProjectByName(name);
    } catch (err) {
        alert('Could not read remembered projects on this device.');
        return;
    }
    if (!record) {
        alert('Could not find that project — it may have been removed. Try "Browse for a Folder…" instead.');
        return;
    }

    let perm;
    try {
        perm = await record.dirHandle.requestPermission({ mode: 'readwrite' });
    } catch (err) {
        alert('Could not re-access that folder. Try "Browse for a Folder…" instead.');
        return;
    }
    if (perm !== 'granted') {
        alert('Permission was not granted for that folder.');
        return;
    }

    await loadProjectFromDirHandle(record.dirHandle, record.name);
}

async function browseForProjectFolder() {
    let dirHandle;
    try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch (err) {
        return; // cancelled
    }

    // Look for a project .json file directly inside the chosen folder to
    // determine the project name — this builder keeps one project per
    // folder, so the first .json found is the project file.
    let jsonFileName = null;
    for await (const [entryName, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && entryName.toLowerCase().endsWith('.json')) {
            jsonFileName = entryName;
            break;
        }
    }
    if (!jsonFileName) {
        alert('No project file (.json) was found in that folder.');
        return;
    }

    const name = jsonFileName.replace(/\.json$/i, '');
    try {
        await saveRecentProject(name, dirHandle);
    } catch (err) {
        // Non-fatal — remembering it for next time is a convenience, not a
        // requirement for opening it right now.
    }

    await loadProjectFromDirHandle(dirHandle, name);
}

// Collects every image filename (full-res AND thumbnail) currently
// referenced anywhere in `proj`, so cleanupOrphanImages() knows what's
// safe to keep. Mirrors the block schema used throughout render/save:
// image.src, multiImage.items[].src, gallery.images[].src/.thumb,
// container.image.src. Container children (text/spacer/button/customHtml)
// never carry images, so they're not walked here.
function collectUsedImageFilenames(proj) {
    const used = new Set();
    const addPath = (p) => { if (p) used.add(p.split('/').pop()); };

    addPath(proj && proj.head && proj.head.faviconSrc);

    (proj && proj.pages || []).forEach(page => {
        (page && page.body && page.body.blocks || []).forEach(block => {
            if (!block) return;
            if (block.type === 'image') {
                addPath(block.src);
                addPath(block.thumb);
            } else if (block.type === 'multiImage') {
                (block.items || []).forEach(item => { addPath(item.src); addPath(item.thumb); });
            } else if (block.type === 'gallery') {
                (block.images || []).forEach(imgData => { addPath(imgData.src); addPath(imgData.thumb); });
            } else if (block.type === 'container' && block.image) {
                addPath(block.image.src);
                addPath(block.image.thumb);
            }
        });
    });
    return used;
}

// Deletes every file in images/ that isn't referenced anywhere in the
// currently loaded project. Run once right after a project finishes
// loading — leftovers accumulate because saveImageToProject() never
// reuses/overwrites a filename (each "replace" mints a fresh one and
// abandons the old file), and because experimenting across sessions can
// leave files from a project.json that's since moved on. Non-fatal on
// individual failures (e.g. a locked file) — logs and keeps going.
async function cleanupOrphanImages() {
    if (!imagesDirHandle) return;
    const used = collectUsedImageFilenames(project);
    const orphans = [];
    for await (const [entryName, handle] of imagesDirHandle.entries()) {
        if (handle.kind === 'file' && !used.has(entryName)) orphans.push(entryName);
    }
    for (const name of orphans) {
        try {
            await imagesDirHandle.removeEntry(name);
        } catch (err) {
            console.error('Could not delete orphan image', name, err);
        }
    }
    if (orphans.length) {
        console.log('Deleted ' + orphans.length + ' orphan image file(s) not referenced by this project:', orphans);
    }
}

async function loadProjectFromDirHandle(dirHandle, name) {
    projectDirHandle = dirHandle;
    imagesDirHandle = await projectDirHandle.getDirectoryHandle('images', { create: true });

    let loaded;
    try {
        const fileHandle = await projectDirHandle.getFileHandle(name + '.json');
        const file = await fileHandle.getFile();
        const text = await file.text();
        loaded = JSON.parse(text);
    } catch (err) {
        alert('Could not read/parse ' + name + '.json from that folder.');
        return;
    }

    project = loaded;
    if (!project.meta) project.meta = { name: name, nextImageNumber: 1 };

    // MIGRATION: projects saved before multi-page support have
    // project.body.{header,menu,blocks} directly, no project.pages at all.
    // Wrap that single page into the new pages[] array so old projects keep
    // working instead of losing their content.
    if (!project.pages) {
        const legacyBody = project.body || { header: { logo: { text: 'My Snoozing Baby', class: 'logo' } }, blocks: [] };
        if (project.body && project.body.menu) project.menu = project.body.menu;
        const migratedPage = makeBlankPage('Home', 'index');
        migratedPage.body = legacyBody;
        project.pages = [migratedPage];
        delete project.body;
    }
    if (!project.menu) project.menu = [];
    if (!project.footer) project.footer = {};
    if (!project.head) project.head = { faviconSrc: '', faviconName: '' };

    currentPageId = project.pages[0].id;

    await cleanupOrphanImages();

    document.getElementById('project-picker-overlay').style.display = 'none';
    init();
    // renderPage()/renderMenu() already run once frame.onload fires at the
    // end of init(), so the loaded blocks/menu/header display automatically
    // once the iframe finishes loading — no extra render call needed here.
}

window.onload = startupCheck;

</script>

</body>
</html>
