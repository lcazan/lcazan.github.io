<style>
        /* --- ADDED SETTINGS MODAL STYLES --- */
        #settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;

            align-items: center;

        }
        .settings-modal {
            background: #1e1e1e;

            border: 1px solid #333;

            border-bottom: 1px solid #333;

            justify-content: space-between;
            align-items: center;

        .settings-header h3 { margin: 0; font-size: 16px; font-weight: 500; color: #eee; }

            padding: 10px;

        .settings-footer { padding: 15px 20px; background: #252525; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
        .save-settings-btn {

            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        /* --- LAYERS PANEL --- */
        #layers-tab {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: #1e1e1e;
            border: 1px solid #333;
            border-right: none;
            border-radius: 8px 0 0 8px;

            cursor: pointer;
            z-index: 15000;
            box-shadow: -2px 0 8px rgba(0,0,0,0.35);
            font-size: 16px;
        }
        #layers-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            max-width: 85vw;
            height: 100%;
            background: #1e1e1e;
            border-left: 1px solid #333;
            box-shadow: -4px 0 15px rgba(0,0,0,0.4);
            z-index: 14000;
            display: flex;
            flex-direction: column;
            transition: right 0.25s ease;
        }
        #layers-panel.open { right: 0; }
        .layers-panel-header {
            padding: 15px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #eee;
        }
        .layers-panel-header h3 { margin: 0; font-size: 16px; font-weight: 500; }
        .layers-panel-hint {
            padding: 8px 20px;
            font-size: 11px;
            color: #888;
            background: #191919;
            border-bottom: 1px solid #333;
        }
        .layers-list {

<script>


// Opens the clicked menu and closes any others
function toggleFlyout(id, event) {
    if (event) event.stopPropagation(); // Prevents the document click listener from immediately closing it
    
    const target = document.getElementById(id);
    const wasActive = target.classList.contains('active');
    
    closeAllFlyouts(); // Close everything first
    
    if (!wasActive) {
        target.classList.add('active'); // Open the one we tapped
    }
}

// Utility to shut all menus
function closeAllFlyouts() {
    document.querySelectorAll('.flyout-panel').forEach(panel => {
        panel.classList.remove('active');
    });
}


let isPanningMulti = false;
let panStartX = 0, panStartY = 0;
let bgStartPosX = 50, bgStartPosY = 50;
let pannedItem = null;
let isPanImgTag = false;


// Pure layout math + DOM application for a multi-image row: computes each
// item's width/height from the container's data-desired-w / data-ratio-val
// / style.gap attributes and current item count, and applies it directly to
// the container and its items. Deliberately takes `container` as a
// parameter rather than reading the global `selectedEl`, so it can be used
// both while live-editing (via recalculateMultiLimits, below) and when
// renderPage() redraws a saved row with nothing selected. Returns the
// resolved {n, w, gap, maxW, maxGap} so callers that also need to sync
// slider UI don't have to duplicate this math.
function applyMultiImageLayout(container) {
    const items = container.querySelectorAll('.multi-image-item');
    const n = items.length;
    const cw = container.offsetWidth;

    if (n === 0) {
        container.setAttribute('data-desired-w', '100');
        container.style.gap = '0px';
        container.style.height = '150px';
        return { n, w: 100, gap: 0, maxW: cw, maxGap: 0 };
    }

    container.style.height = 'auto';

    let w = parseFloat(container.getAttribute('data-desired-w'));
    if (isNaN(w)) w = 100;
    let gap = parseFloat(container.style.gap) || 0;
    const ratio = container.getAttribute('data-ratio-val') || "1";

    if (n === 1) {
        gap = 0;
        let maxw = cw;
        if (w > maxw) w = maxw;

        container.style.gap = '0px';
        items[0].style.width = w + 'px';
        items[0].style.aspectRatio = ratio.toString();
        items[0].style.height = 'auto';

        return { n, w, gap: 0, maxW: maxw, maxGap: 0 };
    }

    let maxGap = (cw - (w * n)) / (n - 1);
    if (maxGap < 0) maxGap = 0;
    if (gap > maxGap) gap = maxGap;

    let maxW = (cw - (gap * (n - 1))) / n;
    if (w > maxW) w = maxW;

    container.style.gap = gap + 'px';

    items.forEach(item => {
        item.style.width = w + 'px';
        item.style.aspectRatio = ratio.toString();
        item.style.height = 'auto';
        item.style.flex = '0 0 auto';
    });

    return { n, w, gap, maxW, maxGap };
}

// Live-editing entry point: recomputes selectedEl's multi-image-row layout
// via applyMultiImageLayout(), then syncs the toolbar sliders/labels to
// match. Behavior is identical to before this was split out — only the
// core math moved into the shared, parameterized function above.
function recalculateMultiLimits() {
    if (!selectedEl) return;
    const result = applyMultiImageLayout(selectedEl);

    const wSlider = document.getElementById('multi-size-slider'); // Now controls Width
    const gSlider = document.getElementById('multi-gap-slider');
    const wLabel = document.getElementById('multi-size-label');
    const gLabel = document.getElementById('multi-gap-label');

    if (result.n === 0) {
        if (wSlider) { wSlider.value = 100; wSlider.max = result.maxW; wSlider.disabled = true; }
        if (gSlider) { gSlider.value = 0; gSlider.max = 0; gSlider.disabled = true; }
        if (wLabel) wLabel.innerText = '100px';
        if (gLabel) gLabel.innerText = '0px';
        return;
    }

    if (result.n === 1) {
        if (wSlider) { wSlider.max = result.maxW; wSlider.value = result.w; wSlider.disabled = false; }
        if (gSlider) { gSlider.max = 0; gSlider.value = 0; gSlider.disabled = true; }
        if (wLabel) wLabel.innerText = Math.round(result.w) + 'px';
        if (gLabel) gLabel.innerText = '0px';
        return;
    }

    if (wSlider) { wSlider.disabled = false; wSlider.max = result.maxW; wSlider.value = result.w; }
    if (gSlider) { gSlider.disabled = false; gSlider.max = result.maxGap; gSlider.value = result.gap; }
    if (wLabel) wLabel.innerText = Math.round(result.w) + 'px';
    if (gLabel) gLabel.innerText = Math.round(result.gap) + 'px';
}











function handleMultiSizeChange(val) {
    if (!selectedEl) return;
    selectedEl.setAttribute('data-desired-w', val);
    recalculateMultiLimits(); 
}

function handleMultiGapChange(val) {
    if (!selectedEl) return;
    selectedEl.style.gap = val + 'px'; 
    recalculateMultiLimits();
}













function getMultiRowDimensions(row, targetHeight) {
    const items = row.querySelectorAll('.multi-image-item img');
    const gap = parseInt(row.style.gap) || 0;
    let totalWidth = 0;

    items.forEach(img => {
        // Calculate width based on aspect ratio: (Natural Width / Natural Height) * Target Height
        const ratio = img.naturalWidth / img.naturalHeight || 1; 
        totalWidth += (ratio * targetHeight);
    });

    // Add the gaps between images
    totalWidth += (items.length - 1) * gap;
    
    return totalWidth;
}



function handleMultiHeightScale(newHeight) {
    if (!selectedEl) return;
    
    const containerWidth = selectedEl.offsetWidth;
    const totalNeeded = getMultiRowDimensions(selectedEl, newHeight);

    // BUMP LOGIC: If the combined width exceeds container, cap the height
    if (totalNeeded > containerWidth) {
        // This is a simple recursive cap or you can solve for height:
        // Height = (ContainerWidth - TotalGaps) / Sum(AspectRatios)
        let sumRatios = 0;
        selectedEl.querySelectorAll('.multi-image-item img').forEach(img => {
            sumRatios += (img.naturalWidth / img.naturalHeight || 1);
        });
        const gap = parseInt(selectedEl.style.gap) || 0;
        const count = selectedEl.querySelectorAll('.multi-image-item').length;
        newHeight = (containerWidth - ((count - 1) * gap)) / sumRatios;
    }

    selectedEl.style.height = newHeight + 'px';
    updateMultiRowLimits();
}

function updateMultiRowLimits() {
    if (!selectedEl) return;
    const containerWidth = selectedEl.offsetWidth;
    const gapSlider = document.getElementById('spacing-range-input');
    const heightSlider = document.getElementById('height-range-input');

    // Calculate current sum of image widths at current height
    let sumWidths = 0;
    let sumRatios = 0;
    const items = selectedEl.querySelectorAll('.multi-image-item img');
    items.forEach(img => {
        const ratio = img.naturalWidth / img.naturalHeight || 1;
        sumRatios += ratio;
        sumWidths += (ratio * parseFloat(selectedEl.style.height));
    });

    // Max Gap = (Container - Sum of widths) / (n-1)
    if (gapSlider) {
        const maxGap = items.length > 1 ? (containerWidth - sumWidths) / (items.length - 1) : 0;
        gapSlider.max = Math.max(0, maxGap);
    }

    // Max Height = (Container - Total Gaps) / Sum of Ratios
    if (heightSlider) {
        const currentGapTotal = (items.length - 1) * (parseInt(selectedEl.style.gap) || 0);
        const maxHeight = (containerWidth - currentGapTotal) / sumRatios;
        heightSlider.max = Math.max(32, maxHeight);
    }
}

// Builds one multi-image-item's DOM (image + pan overlay) for a given
// already-saved permanent path/preview URL. Shared by triggerMultiImageAdd
// (one call per selected file) so adding several files at once doesn't
// duplicate this markup per-call. `previewUrl` is the THUMBNAIL's preview
// (the row always displays the thumbnail); `thumbSrc` is the thumbnail's
// own JSON-persisted path, kept separately from the full-res `permanentSrc`.
function buildMultiImageItem(previewUrl, permanentSrc, ratio, thumbSrc) {
    const newItem = document.createElement('div');
    newItem.className = 'multi-image-item';
    newItem.setAttribute('data-permanent-src', permanentSrc);
    if (thumbSrc) newItem.setAttribute('data-thumb-src', thumbSrc);

    const img = document.createElement('img');
    img.src = previewUrl;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.display = 'block';
    newItem.appendChild(img);

    // Pan handle — same pattern as gallery-component.html's .pan-overlay:
    // a permanent, centered overlay icon, shown via CSS on hover/selection,
    // that starts the pan gesture itself (see startInteraction()'s
    // .multi-image-pan-overlay check) so it's distinct from tapping the
    // item to select it.
    const panOverlay = document.createElement('div');
    panOverlay.className = 'multi-image-pan-overlay';
    panOverlay.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i>';
    newItem.appendChild(panOverlay);

    newItem.style.height = '100%';
    newItem.style.aspectRatio = ratio.toString();
    return newItem;
}

// Adding/replacing images in a multi-image row saves+displays a resized
// thumbnail (never the full-resolution file) — see saveImageWithThumbnail.
// Supports selecting/adding several images in one go (mirrors the
// gallery's multi-select add behavior).
function triggerMultiImageAdd() {
    const input = document.getElementById('image-upload');
    input.multiple = true;
    input.onchange = async function(e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        const ratio = parseFloat(selectedEl.getAttribute('data-ratio-val')) || 1;

        // Saved sequentially (not Promise.all) so each file gets its
        // number from project.meta.nextImageNumber in the order picked,
        // rather than racing for it.
        for (const file of files) {
            const { src, thumb, thumbBlob } = await saveImageWithThumbnail(file, THUMBNAIL_BASE_DIM.block);
            const previewUrl = thumbBlob ? URL.createObjectURL(thumbBlob) : URL.createObjectURL(file);
            // Pre-populate the cache — the next render reuses this instantly.
            resolvedImageCache.set(thumb || src, previewUrl);

            const newItem = buildMultiImageItem(previewUrl, src, ratio, thumb);
            selectedEl.appendChild(newItem);
        }

        input.value = "";
        input.multiple = false;

        recalculateMultiLimits();
        renderToolbar();
    };
    input.click();
}

function triggerMultiImageReplace() {
    const input = document.getElementById('image-upload');
    // Replace targets exactly one existing item — always single-select.
    input.multiple = false;
    input.onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (selectedEl && selectedEl.classList.contains('multi-image-item')) {
            // Always a fresh, unique path (see saveImageToProject) — the
            // old file is left in place on disk, just no longer referenced.
            const { src, thumb, thumbBlob } = await saveImageWithThumbnail(file, THUMBNAIL_BASE_DIM.block);
            const previewUrl = thumbBlob ? URL.createObjectURL(thumbBlob) : URL.createObjectURL(file);
            resolvedImageCache.set(thumb || src, previewUrl);
            selectedEl.setAttribute('data-permanent-src', src);
            if (thumb) selectedEl.setAttribute('data-thumb-src', thumb);
            else selectedEl.removeAttribute('data-thumb-src');

            let img = selectedEl.querySelector('img');
            if (!img) {
                selectedEl.style.backgroundImage = 'none';
                img = document.createElement('img');
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                selectedEl.appendChild(img);
            }
            img.src = previewUrl;
        }
        input.value = '';
    };
    input.click();
}


// ==========================================================
// GALLERY (embedded directly in the page, no iframe)
// ==========================================================
// Previously lived in a nested iframe (gallery-component.html) for style
// isolation, but that architecture had a persistent bug with no reliable
// workaround: removing an iframe from the document — even for an instant,
// even when the exact same node is reattached right afterward — makes the
// browser unload/reload its content, wiping out everything inside it.
// Multi-image rows already prove a gallery-like feature (multiple images,
// drag reorder, pan) works fine living directly in the page, so the
// gallery now does too. It shares the exact same central image storage as
// every other image type (saveImageToProject/resolveImagePath/
// resolvedImageCache) — no postMessage bridge needed anymore.
// gallery.css (linked into the preview iframe's own head in init()) still
// provides all the visual styling, using the same class names as before.

let currentGalleryTargetSlot = null; // which .gallery-item is being filled/replaced
let galleryDrakes = new WeakMap(); // Dragula instance per gallery element

// Builds one filled gallery item's DOM, mirroring gallery-component.html's
// original fillSlot(). `previewSrc` is what's shown immediately (a blob:
// URL for the THUMBNAIL — the gallery grid always displays the thumbnail,
// never the full-res image); `permanentSrc` is the full-res image's
// JSON-persisted path (kept for a future export lightbox); `thumbSrc` is
// the thumbnail's own JSON-persisted path.
function buildGalleryItem(doc, previewSrc, filename, permanentSrc, objectPosition, thumbSrc) {
    const slot = doc.createElement('div');
    slot.className = 'gallery-item has-image';
    if (permanentSrc) slot.setAttribute('data-permanent-src', permanentSrc);
    if (thumbSrc) slot.setAttribute('data-thumb-src', thumbSrc);

    const sentry = doc.createElement('div');
    sentry.className = 'sentry-layer';
    slot.appendChild(sentry);

    const img = doc.createElement('img');
    if (previewSrc) img.src = previewSrc;
    if (filename) img.setAttribute('data-filename', filename);
    img.style.objectPosition = objectPosition || '50% 50%';
    slot.appendChild(img);

    const panOverlay = doc.createElement('div');
    panOverlay.className = 'pan-overlay';
    panOverlay.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i>';
    slot.appendChild(panOverlay);

    const actions = doc.createElement('div');
    actions.className = 'item-actions';
    actions.innerHTML = `
        <button class="action-btn drag-handle"><i class="fa-solid fa-hand"></i></button>
        <button class="action-btn" data-gallery-action="replace"><i class="fa-solid fa-sync"></i></button>
        <button class="action-btn" data-gallery-action="delete"><i class="fa-solid fa-trash"></i></button>
    `;
    slot.appendChild(actions);

    addGalleryItemMenu(slot);
    return slot;
}

// Builds the trailing empty "add image" slot.
function buildGalleryEmptySlot(doc) {
    const slot = doc.createElement('div');
    slot.className = 'gallery-item gallery-empty-slot';
    addGalleryItemMenu(slot);
    return slot;
}

// The camera/photos/files choice menu, present (but hidden via CSS until
// .menu-open) on every slot, filled or empty.
function addGalleryItemMenu(slot) {
    slot.insertAdjacentHTML('beforeend', `
        <div class="choice-menu">
            <button class="choice-btn" data-gallery-pick="camera"><i class="fa-solid fa-camera"></i> CAMERA</button>
            <button class="choice-btn" data-gallery-pick="gallery"><i class="fa-solid fa-images"></i> PHOTOS</button>
            <button class="choice-btn" data-gallery-pick="files"><i class="fa-solid fa-folder-open"></i> FILES</button>
        </div>
    `);
}

function closeAllGalleryUI(galleryEl) {
    if (!galleryEl) return;
    galleryEl.querySelectorAll('.gallery-item').forEach(i => i.classList.remove('menu-open', 'active'));
}

// Handles discrete gallery tap-actions: choice-menu picks (camera/photos/
// files), item replace/delete, and sentry/empty-slot activation. Bound to
// a real `click` event (see init()'s frame.onload) rather than routed
// through startInteraction's touchstart+mousedown — those fire separately
// and on mobile a single tap generates synthesized mouse events shortly
// after the touch events, at the same coordinates. Since a menu can appear
// instantly in response to the touch, the synthesized mouse event could
// land on a freshly-rendered button and "click" it unintentionally, based
// on finger position rather than actual intent. A real `click` event is
// properly de-duplicated by the browser for a single logical tap, so it
// doesn't have this problem.
function handleGalleryClick(e) {
    const galleryPick = e.target.closest('[data-gallery-pick]');
    if (galleryPick) {
        const slot = galleryPick.closest('.gallery-item');
        const gallery = slot ? slot.closest('.photo_gallery') : null;
        if (slot && gallery) {
            currentGalleryTargetSlot = slot;
            closeAllGalleryUI(gallery);
            selectElement(gallery);
            const mode = galleryPick.getAttribute('data-gallery-pick');
            const inputId = mode === 'camera' ? 'gallery-input-camera' : mode === 'files' ? 'gallery-input-files' : 'gallery-input-gallery';
            const input = document.getElementById(inputId);
            if (input) input.click();
        }
        return;
    }

    const galleryAction = e.target.closest('[data-gallery-action]');
    if (galleryAction) {
        const slot = galleryAction.closest('.gallery-item');
        const gallery = slot ? slot.closest('.photo_gallery') : null;
        const action = galleryAction.getAttribute('data-gallery-action');
        if (slot && gallery) {
            selectElement(gallery);
            if (action === 'replace') {
                currentGalleryTargetSlot = slot;
                closeAllGalleryUI(gallery);
                slot.classList.add('menu-open');
            } else if (action === 'delete') {
                slot.remove();
                saveGalleryBlock(gallery);
            }
        }
        return;
    }

    // Drag handle / pan overlay — handled elsewhere (Dragula itself, and
    // startInteraction's press-driven pan logic respectively); don't
    // treat a click on either as a plain activation tap.
    if (e.target.closest('.drag-handle') || e.target.closest('.pan-overlay')) {
        return;
    }

    // Sentry layer (filled items only) — "activates" the item, showing its
    // overlay UI via CSS, and selects the gallery.
    const gallerySentry = e.target.closest('.gallery-item .sentry-layer');
    if (gallerySentry) {
        const slot = gallerySentry.closest('.gallery-item');
        const gallery = slot ? slot.closest('.photo_gallery') : null;
        if (slot && gallery) {
            closeAllGalleryUI(gallery);
            slot.classList.add('active');
            selectElement(gallery);
        }
        return;
    }

    // Empty "add" slot — opens its own choice-menu directly (no sentry
    // layer on empty slots, matching the original design).
    const galleryEmptySlot = e.target.closest('.gallery-empty-slot');
    if (galleryEmptySlot) {
        const gallery = galleryEmptySlot.closest('.photo_gallery');
        if (gallery) {
            closeAllGalleryUI(gallery);
            galleryEmptySlot.classList.add('menu-open');
            selectElement(gallery);
        }
        return;
    }
}

// Handles files picked via the choice-menu (camera/photos/files inputs) —
// saves each through the central image function, then fills/inserts slots.
async function handleGalleryFiles(fileList) {
    // Snapshot into a plain array synchronously, before any `await` below.
    // `fileList` is the input element's live FileList — the caller's
    // onchange handler clears input.value right after invoking this
    // function, which (since this function suspends at its first await)
    // runs before the loop below finishes, truncating/emptying the SAME
    // FileList object this loop reads from. A plain array copy is immune
    // to that.
    const files = Array.from(fileList || []);
    if (!files.length || !currentGalleryTargetSlot) return;
    const doc = frame.contentDocument;
    const gallery = currentGalleryTargetSlot.closest('.photo_gallery');
    if (!gallery) return;

    let insertAfter = currentGalleryTargetSlot;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const { src, thumb, thumbBlob } = await saveImageWithThumbnail(file, THUMBNAIL_BASE_DIM.gallery);

        // Prefer previewing the thumbnail (matches what's actually shown
        // once saved/reloaded); fall back to the full image if thumbnail
        // generation failed.
        const previewUrl = thumbBlob ? URL.createObjectURL(thumbBlob) : URL.createObjectURL(file);
        resolvedImageCache.set(thumb || src, previewUrl);

        const newItem = buildGalleryItem(doc, previewUrl, file.name, src, '50% 50%', thumb);

        if (i === 0) {
            insertAfter.replaceWith(newItem);
        } else {
            insertAfter.after(newItem);
        }
        insertAfter = newItem;
    }

    // Ensure there's always exactly one trailing empty "add" slot.
    const lastChild = gallery.lastElementChild;
    if (!lastChild || !lastChild.classList.contains('gallery-empty-slot')) {
        gallery.appendChild(buildGalleryEmptySlot(doc));
    }

    setupGalleryDragula(gallery);
    currentGalleryTargetSlot = null;
    saveGalleryBlock(gallery);
}

// Sets up (or re-sets-up) Dragula drag-reordering scoped to ONE gallery
// instance. Tracked per-element via a WeakMap so multiple galleries on the
// same page each get their own independent drake, and re-inserting items
// doesn't leak old instances.
function setupGalleryDragula(galleryEl) {
    const iframeDragula = frame.contentWindow && frame.contentWindow.dragula;
    if (!galleryEl || typeof iframeDragula !== 'function') return;
    const existing = galleryDrakes.get(galleryEl);
    if (existing) existing.destroy();

    const drake = iframeDragula([galleryEl], {
        moves: (el, source, handle) => handle.classList.contains('drag-handle') || !!handle.closest('.drag-handle'),
        accepts: (el, target, source, sibling) => !sibling || !sibling.classList.contains('gallery-empty-slot'),
        invalid: (el) => el.classList.contains('gallery-empty-slot')
    });
    drake.on('dragend', () => {
        saveGalleryBlock(galleryEl);
    });
    galleryDrakes.set(galleryEl, drake);
}








function cycleAspectRatio() {
    if (!selectedEl) return;
    const ratios = [1, 0.618, 1.618, 0.75, 1.33];
    let current = parseFloat(selectedEl.getAttribute('data-ratio-val')) || 1;
    let nextIdx = (ratios.indexOf(current) + 1) % ratios.length;
    let newRatio = ratios[nextIdx];
    
    selectedEl.setAttribute('data-ratio-val', newRatio);

    // Update the aspect ratio for all images. 
    // Because W is fixed, height instantly adjusts itself via CSS.
    const items = selectedEl.querySelectorAll('.multi-image-item');
    items.forEach(item => {
        item.style.aspectRatio = newRatio.toString();
    });

    // Just re-render the toolbar to update the aspect ratio button label
    renderToolbar();
}

async function saveSettingsChanges() {

// --- JSON SOURCE OF TRUTH ---
// The project's overall shape:
//
//   Project
//   ├── meta    — { name, nextImageNumber }. name is used for the
//   │             <name>.json filename; nextImageNumber is an
//   │             ever-incrementing counter used to name image files
//   │             (1.png, 2.jpg, ...) — never reused, even after a delete,
//   │             so a stale reference can never collide with a new image.
//   ├── head    — shared/template-controlled (meta tags etc.), not yet part
//   │             of the editable block system. Reserved for later (Project
//   │             Settings).
//   ├── body
//   │   ├── header
//   │   │   └── logo   — { text, class } rendered into template.html's
//   │   │                 <header>. Not yet independently selectable/
//   ├── menu    — GLOBAL (shared across every page, like a real site nav).
//   │              Same shape the menu editor's own working list (menuData)
//   │              already uses: { label, url, children }.
//   ├── footer  — GLOBAL. Social links, copyright text, and disclaimer,
//   │              edited via the Project Settings modal. See renderFooter().
//   └── pages   — one entry per page. Each page has its own `body`
//                  (header/blocks) plus its own title/slug/meta description/
//                  header scripts — these were the settings-modal fields
//                  that used to live directly on `project` before multi-page
//                  support; now they're per-page, since each page needs its
//                  own <title>/slug/meta tags. currentPageId (a plain JS
//                  variable, not part of `project` — see below) tracks which
//                  page's body is currently shown in the preview iframe.
//                    ├── id      — stable id, generated once per page
//                    ├── name    — display name shown in the Pages tab list
//                    ├── slug    — URL slug (was "Page Name" in Settings)
//                    ├── title   — browser tab title (was "Page Title")
//                    ├── metaDescription
//                    ├── headCode
//                    └── body
//                          ├── header.logo — proves this is the source of
//                          │     truth for the header's content; not yet
//                          │     editable in the iframe UI.
//                          └── blocks — the flat, ordered array of
//                                page-content blocks (text, spacer, button,
//                                customHtml, image, multiImage, gallery,
//                                container/div, contactForm). Array order =
//                                page order. A "container" block's own
//                                children live inside that block's own
//                                `children` array, not as separate top-level
//                                entries here.

// (not saved into project.json) — every load simply opens pages[0].
let currentPageId = project.pages[0].id;

function getPageById(id) {
    return project.pages.find(p => p.id === id) || null;
}

// Single point of truth for "which page's body/settings are active right
// now". Falls back to the first page if currentPageId is somehow stale
// (e.g. its page got deleted) so callers never have to null-check.
function getCurrentPage() {

// ==========================================================
// CENTRAL IMAGE STORAGE
// ==========================================================
// The ONLY place in the whole app that writes a full-resolution image file
// to disk. Every image-bearing block type (single image, div image,
// multi-image, gallery) now goes through saveImageWithThumbnail() below,
// which calls this for the full-res file and also generates/writes a
// resized thumbnail companion — the editor itself never works with the
// full-res file after this point, only the thumbnail.

// Saves `file` into the project's images/ folder under a brand-new, unique
// filename (e.g. "images/image-007.jpg") and returns that permanent,
// project-relative path — safe to store in JSON (never base64 or a blob:
// URL). Every call always gets a fresh filename, even when the user is
// "replacing" an image on an existing block — the old file is simply left
// unreferenced on disk rather than overwritten, so an in-progress write
// can never collide with or clobber a different image.
async function saveImageToProject(file) {
    if (!imagesDirHandle) {
        throw new Error('No project folder is open.');
    }
    const num = project.meta.nextImageNumber++;
    const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
    const ext = extMatch ? extMatch[1].toLowerCase() : 'png';
    const filename = 'image-' + String(num).padStart(3, '0') + '.' + ext;

    await writeFileToImagesFolder(filename, file);
    return 'images/' + filename;
}

// Shared low-level disk write used by saveImageToProject() and the
// thumbnail generator below — both just need "put this Blob/File at this
// filename inside images/".
async function writeFileToImagesFolder(filename, blobOrFile) {
    if (!imagesDirHandle) {
        throw new Error('No project folder is open.');
    }
    const fileHandle = await imagesDirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blobOrFile);
    await writable.close();
}

// Resizes `file` down to a max dimension of `maxDim` and re-compresses it
// as a JPEG for a small file size. Always outputs JPEG regardless of
// source format — an accepted tradeoff (loses PNG transparency) for a
// consistently small thumbnail. Returns null (not a rejected promise) if
// it fails, so callers can fall back to the full image without a
// thumbnail.
async function generateThumbnailBlob(file, maxDim) {
    try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
        const outW = Math.max(1, Math.round(bitmap.width * scale));
        const outH = Math.max(1, Math.round(bitmap.height * scale));

        const canvas = document.createElement('canvas');
        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, outW, outH);
        if (bitmap.close) bitmap.close();

        return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    } catch (err) {
        console.error('Thumbnail generation failed', err);
        return null;
    }
}

// Base thumbnail dimensions (longest side, before device-pixel-ratio
// scaling — see getThumbnailMaxDim()) for each editing context. The editor
// never works with a full-resolution image once one's been added — every
// live preview (gallery grid, single image, div image, multi-image row)
// displays a resized/compressed copy; only the untouched original stays on
// disk, for a future export/lightbox to use.
//   gallery — grid cells are always small (2-3 per row), regardless of how
//             big the overall gallery block is.
//   block   — single image / div image / multi-image row items: these can
//             be resized up toward the full preview width, so they get a
//             larger base size than a gallery cell.
const THUMBNAIL_BASE_DIM = {
    gallery: 800,
    block: 1200
};

// Scales a base thumbnail dimension by the current device's pixel ratio
// (capped at 2x) so a retina/high-DPI screen gets a correspondingly
// sharper thumbnail — this is the one legitimate "device" factor that
// actually affects how many real pixels a given CSS size needs to look
// sharp. General screen/monitor resolution (e.g. laptop vs external
// display) is deliberately NOT used: it doesn't determine how large an
// image renders on the page — the page's own CSS layout does that, and
// the preview iframe here is already scaled down to simulate phone/
// desktop widths regardless of the actual monitor. Tying thumbnail size to
// whichever screen happens to be open would just make output inconsistent
// across sessions/devices for the same project.
function getThumbnailMaxDim(baseDim) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    return Math.round(baseDim * dpr);
}

// Saves an image plus its resized thumbnail companion, sharing the same
// base filename — e.g. "images/image-007.jpg" (full) and
// "images/image-007-thumbnail.jpg" (thumb) — so the two are easy to spot
// as a pair when browsing the images/ folder. `baseDim` should be one of
// THUMBNAIL_BASE_DIM's values, picked by the caller for its context.
// Returns:
//   src       — full-res permanent path; not shown anywhere yet, but kept
//               for a future export lightbox to load on click.
//   thumb     — thumbnail permanent path; this is what actually gets
//               displayed, both while editing and (later) once exported.
//   thumbBlob — the same thumbnail bytes just written, handed back so the
//               caller can build an instant local preview URL without a
//               redundant disk read right after the write.
// If thumbnail generation fails, thumb is '' and thumbBlob is null —
// callers should fall back to showing/using the full-res `src` instead.
async function saveImageWithThumbnail(file, baseDim) {
    const src = await saveImageToProject(file);
    let thumb = '';
    let thumbBlob = null;

    thumbBlob = await generateThumbnailBlob(file, getThumbnailMaxDim(baseDim));
    if (thumbBlob) {
        const dot = src.lastIndexOf('.');
        const thumbPath = (dot === -1 ? src : src.slice(0, dot)) + '-thumbnail.jpg';
        try {
            await writeFileToImagesFolder(thumbPath.split('/').pop(), thumbBlob);
            thumb = thumbPath;
        } catch (err) {
            console.error('Could not write thumbnail to disk', err);
            thumbBlob = null;
        }
    }

    return { src, thumb, thumbBlob };
}

// Cache of resolved image blob URLs, keyed by permanent path (e.g.
// "images/image-003.jpg"). renderPage() rebuilds every block's DOM from
// scratch on every render — including blocks whose images haven't actually
// changed — so resolving straight from disk every time meant every image
// on the page went blank and took a beat to reappear on every single
// click-away, anywhere on the page. Since paths are never reused
// (saveImageToProject always mints a fresh filename, even on "replace"), a
// cached URL for a given path is valid forever — no invalidation needed.
const resolvedImageCache = new Map();

// Reads a File System handle for `path` and returns a File (a File is also
// a Blob), given its project-relative path (e.g. "images/image-007.jpg").
async function getProjectImageBlob(path) {
    if (!imagesDirHandle) {
        throw new Error('No project folder is open.');
    }
    const filename = (path || '').split('/').pop();
    if (!filename) throw new Error('Empty image path.');
    const fileHandle = await imagesDirHandle.getFileHandle(filename);
    return await fileHandle.getFile();
}

// Convenience wrapper for render paths that live in this SAME window
// (single image, div image, multi-image) — they can resolve a stored path
// directly into a displayable blob: URL without needing the postMessage
// bridge the nested gallery iframe requires. Used because srcdoc-loaded
// iframe content has no real base URL that could resolve a relative
// images/... path against the actual project folder on disk. Checks the
// cache first — only ever reads from disk the FIRST time a given path is
// displayed.
async function resolveImagePath(path) {
    if (!path) return '';
    if (resolvedImageCache.has(path)) return resolvedImageCache.get(path);
    try {
        const blob = await getProjectImageBlob(path);
        const url = URL.createObjectURL(blob);
        resolvedImageCache.set(path, url);
        return url;
    } catch (err) {
        console.error('Could not resolve image path', path, err);
        return '';
    }
}

// Applies a resolved image URL to `img` for `path` — synchronously and
// instantly if already cached (the common case after the very first
// render), or asynchronously with the usual brief resolve on a genuine
// cache miss (first time this exact path has ever been displayed this
// session, e.g. right after loading a project). Use this instead of
// calling resolveImagePath() + .then() directly at every render call site.
function applyResolvedImageSrc(img, path) {
    if (!img || !path) return;
    if (resolvedImageCache.has(path)) {
        img.src = resolvedImageCache.get(path);
        return;
    }
    resolveImagePath(path).then(url => { if (url) img.src = url; });
}

// Handles Sandbox (Custom HTML) resizing. Gallery height-reporting is gone
// — the gallery is embedded directly in the page now, no iframe, so it
// just participates in normal page layout like everything else.
window.addEventListener('message', (event) => {
    const doc = frame.contentDocument;
    if (!doc || !event.data) return;

    // Handle Sandbox (Custom HTML) Resizing
    if (event.data.type === 'sandboxHeight') {
        // Corrected selector syntax: '#' + event.data.id + ' iframe'
        const sandboxIframe = doc.querySelector('#' + event.data.id + ' iframe');
        if (sandboxIframe) {
            const newHeight = event.data.height + 'px';
            sandboxIframe.style.height = newHeight;
            
            const block = sandboxIframe.closest('.block_custom_html');
            if (block) {
                block.style.height = 'auto'; // Prevent clipping
                block.style.minHeight = newHeight;
            }
        }
    }
});

// --- 3. THE UPDATE FUNCTIONS ---
function updateSandbox(block) {
    const textarea = block.querySelector('.html-input-box');
    const iframe = block.querySelector('.widget-sandbox');
    if (!textarea || !iframe) return;

    const rawCode = textarea.value;

    // We inject a specialized script into the srcdoc to measure content
    // and report it back to the preview frame (the relay).
    const heightScript = `
        <script>
            (function() {
                const sendHeight = () => {
                    // Force a layout recalculation
                    const height = document.documentElement.getBoundingClientRect().height || 
                                 document.body.scrollHeight || 
                                 document.documentElement.scrollHeight;
                    
                    window.parent.postMessage({
                        type: 'sandboxHeight',
                        id: '${block.id}', 
                        height: Math.ceil(height)
                    }, '*');
                };

                // Trigger on all major lifecycle events
                window.addEventListener('load', sendHeight);
                window.addEventListener('resize', sendHeight);

                // Watch for DOM changes (elements added/removed)
                const observer = new MutationObserver(sendHeight);
                observer.observe(document.body, { 
                    childList: true, 
                    subtree: true, 
                    attributes: true 
                });

                // Watch for size changes of elements (images loading, etc)
                if (window.ResizeObserver) {
                    new ResizeObserver(sendHeight).observe(document.body);
                }

                // Initial burst polling to catch "lazy" widgets like Elfsight
                let checks = 0;
                const poll = setInterval(() => {
                    sendHeight();
                    if (checks++ > 20) clearInterval(poll);
                }, 500);

                // Final safety check at 5 seconds
                setTimeout(sendHeight, 5000);
            })();
        <\/script>
    `;

    // Combine user code with our height reporter
    iframe.srcdoc = rawCode + heightScript;
}

            if (e.target.closest('.drag-handle')) {

                    panStartY = point.clientY;

                    const gPosParts = gPos.split(' ');

                    bgStartPosY = parseFloat(gPosParts[1]) || 50;
                }

                     e.target.closest('.div-other-wrapper > *') || 
                     e.target.closest('.block_spacer') ||

            const point = e.touches ? e.touches[0] : e;

            // isScrolling check. Previously this was gated by the same
            // tap-vs-scroll heuristic used for general item selection
            // below, so once movement passed the 10px threshold isScrolling
            // flipped true and preventDefault() stopped being called —
            // letting the browser's native scroll take over mid-drag. Since
            // panning is only ever started by deliberately pressing the pan
            // handle (never ambiguous with scrolling), it should never
            // defer to that heuristic. This same state machine
            // (isPanningMulti/pannedItem/...) is shared by both multi-image

            // time, so reusing it avoids a parallel, near-duplicate set of

            if (isPanningMulti && pannedItem) {

                const deltaY = (panStartY - point.clientY) * 0.4;

            const moveY = Math.abs(point.clientY - startY);

            }

                    }
                }
            }
            isPanningMulti = false; 
            pannedItem = null; 
            pendingSelection = null;
        };

        doc.addEventListener('mousedown', startInteraction);
        doc.addEventListener('touchstart', startInteraction, { passive: true }); // passive: true helps scrolling speed
        doc.addEventListener('mousemove', moveInteraction, { passive: false });
        doc.addEventListener('touchmove', moveInteraction, { passive: false });
        doc.addEventListener('mouseup', endInteraction);
        doc.addEventListener('touchend', endInteraction);
        // Real click event (properly de-duplicated by the browser for a
        // single tap, unlike touchstart+mousedown above) for discrete
        // gallery tap-actions — see handleGalleryClick().
        doc.addEventListener('click', handleGalleryClick);

        // very first load, not just after the user's first edit triggers a
        // render.
        renderPage();

        // The menu is synced separately, once, here — NOT from inside
        // renderPage() itself. See the note in renderPage() for why: a
        // destructive rebuild on every click-to-empty-space would wipe out
        // an expanded dropdown's .active/.show state the instant after
        // toggleDropdown() set it.
        renderMenu();
        renderFooter();
    };
}

function applyAndClosePill() {
    const editable = document.getElementById('pill-editable');

            btnLink.setAttribute('href', editable.innerText);
        }
    }

    // --- JSON SOURCE OF TRUTH: persist whenever a pill edit is finalized ---
    // Covers the explicit APPLY button, deselectAll()'s auto-apply for
    // buttons, and openPill()'s guard when switching fields (e.g. TEXT ->
    // LINK) without pressing Apply first. Does NOT render — same reasoning
    // as selectElement()'s switch-away save.
    if (selectedEl) saveSelectedBlock(selectedEl);

    // Hide UI
    document.getElementById('input-pill').style.display = 'none';
    activePillMode = null;
    console.log("Applied and Synced.");
}

function insertElement(type, data) {
    const doc = frame.contentDocument; 
    const root = doc.getElementById('editor-root');

    // --- NEW: CONSTRAINT GUARDRAIL ---
    // Prevent nesting structural blocks inside restricted components.
    // If a restricted component is selected, step up to the top-level parent wrapper.
    let safeReferenceEl = selectedEl;
    if (safeReferenceEl) {
        const restrictedParent = safeReferenceEl.closest('.block_multi_image') || 
                                 safeReferenceEl.closest('.block_button_container') ||
                                 safeReferenceEl.closest('.block_contact_form') ||
                                 safeReferenceEl.closest('.photo_gallery');
        
        if (restrictedParent) {
            safeReferenceEl = restrictedParent; 
        }
    }

    // 1. MULTI-IMAGE ROW
    if (type === 'block_multi_image') {
        const el = doc.createElement('div');

        const handle = doc.createElement('div');
        handle.className = 'multi-image-handle';
        handle.innerText = 'ROW';

// Determines where a brand-new block should land in getCurrentPage().body.blocks, based
// on its live DOM position — NOT just appended to the end. insertElement()
// already places the new element right after whatever was selected (or at
// the end of #editor-root if nothing was selected), so this walks backward
// through preceding siblings to find the nearest one already tracked in
// getCurrentPage().body.blocks, and returns the index right after it. If no tracked
// sibling precedes it (nothing was selected, or everything before it is an
// untracked/ephemeral block type), it belongs at the very end — matching the
// "nothing selected" case.
function getInsertIndexForNewBlock(el) {
    let sib = el.previousElementSibling;
    while (sib) {
        const sibId = sib.getAttribute('data-block-id');
        if (sibId) {
            const idx = getCurrentPage().body.blocks.findIndex(b => b.id === sibId);
            if (idx !== -1) return idx + 1;
        }
        sib = sib.previousElementSibling;
    }
    return getCurrentPage().body.blocks.length;
}

// Rebuilds #editor-root FROM getCurrentPage().body.blocks, and only from getCurrentPage().body.blocks.
// This wipes whatever is currently in the DOM and redraws purely off the
// data. This is ONLY called from deselectAll() (i.e. when clicking to empty
// space) — see saveSelectedBlock()/selectElement() for why saving and
// rendering are deliberately separate steps now.
function renderPage() {
    const doc = frame.contentDocument;
    const root = doc.getElementById('editor-root');
    if (!root) return;

    // --- HEADER / LOGO ---
    // Lives outside #editor-root (it's part of template.html's fixed
    // <header>), so it's synced here rather than as a getCurrentPage().body.blocks
    // entry. Not yet independently selectable/editable in the iframe UI —
    // this just makes getCurrentPage().body.header.logo the source of truth for
    // what's currently a simple div+text, matching template.html's
    // previously-static markup exactly.
    const logoEl = doc.querySelector('header .logo');
    if (logoEl && getCurrentPage().body.header && getCurrentPage().body.header.logo) {
        logoEl.className = getCurrentPage().body.header.logo.class || 'logo';
        logoEl.textContent = getCurrentPage().body.header.logo.text || '';
    }

    // NOTE: the menu (nav-sidebar) is deliberately NOT re-synced here.
    // renderMenu() does a destructive innerHTML rebuild of .nav-content,
    // which would wipe out the .active/.show classes toggleDropdown() adds
    // when a submenu is expanded — and since renderPage() runs on every
    // click to empty space (including clicks on the menu itself, which
    // isn't part of #editor-root), that made dropdowns appear to do
    // nothing: they'd open and get rebuilt-away almost instantly. renderMenu()
    // is only called from saveMenuChanges() (after an actual edit) and once
    // on initial load (see frame.onload) — never from the general render
    // cycle.

    root.innerHTML = '';

    getCurrentPage().body.blocks.forEach(block => {
        if (block.type === 'text') {
            const tagMap = { 'section_heading': 'h2', 'block_heading': 'h3', 'block_text': 'p' };
            const el = doc.createElement(tagMap[block.variant] || 'p');
            el.className = `editable ${block.variant}`;
            el.contentEditable = "true";
            el.setAttribute('data-placeholder', 'Type here...');
            el.setAttribute('data-block-id', block.id);
            el.innerHTML = block.contentHTML;
            if (block.align) el.style.textAlign = block.align;
            root.appendChild(el);
        }
        else if (block.type === 'spacer') {
            // Spacer has no content to type — its only property is whether
            // the divider line is shown, toggled via toggleSpacerLine().
            const el = doc.createElement('div');
            el.className = 'editable block_spacer';
            el.contentEditable = "false";
            el.setAttribute('data-block-id', block.id);
            el.style.borderBottom = block.showLine ? '1px solid #eee' : 'none';
            root.appendChild(el);
        }
        else if (block.type === 'button') {
            // Button label/link are edited via the floating input pill
            // (openPill/syncRealTime/applyAndClosePill), which already syncs
            // live into the DOM anchor — we just rebuild that anchor from
            // the saved label/href here. No alignment is tracked for
            // buttons anymore (align/center buttons were removed from this
            // block's toolbar — see renderToolbar()).
            const el = doc.createElement('div');
            el.className = 'editable block_button_container';
            el.contentEditable = "false";
            el.setAttribute('data-block-id', block.id);
            el.innerHTML = `<a href="${block.href}" class="block_button" onclick="return false;">${block.label}</a>`;
            root.appendChild(el);
        }
        else if (block.type === 'customHtml') {
            // Rebuild the same structure insertElement() creates (header,
            // textarea, sandbox iframe), restore the saved code into the
            // textarea via .value (not innerHTML, to avoid breaking on code
            // containing "</textarea>"). Deliberately does NOT call
            // activateCustomHtml() here — the saved code should only ever
            // run when the user explicitly presses Activate, not
            // automatically every time the page re-renders.
            const el = doc.createElement('div');
            el.className = 'editable block_custom_html';
            el.contentEditable = "false";
            el.id = 'customhtml_' + block.id;
            el.setAttribute('data-block-id', block.id);
            el.setAttribute('data-html-code', block.code || '');
            el.innerHTML = `
                <div class="custom-html-ui-container" contenteditable="false">
                    <div class="custom-html-header">
                        <span><i class="fa-solid fa-code"></i> Custom HTML/Widget</span>
                        <button class="activate-btn" onclick="window.parent.updateHTML(this)">Activate</button>
                    </div>
                    <textarea class="html-input-box" placeholder="Paste your embed code here..." 
                        oninput="this.closest('.block_custom_html').setAttribute('data-html-code', this.value);"></textarea>
                </div>
                <div class="html-render-area"></div> 
                <div class="sandbox-iframe-wrapper">
                    <iframe class="widget-sandbox" sandbox="allow-scripts allow-popups allow-forms allow-same-origin"></iframe>
                </div>
            `;
            root.appendChild(el);
            const textarea = el.querySelector('.html-input-box');
            if (textarea) textarea.value = block.code || '';
        }
        else if (block.type === 'image') {
            const el = doc.createElement('div');
            el.className = 'editable block_image';
            el.contentEditable = "false";
            el.setAttribute('data-block-id', block.id);
            el.setAttribute('data-scale-factor', block.scaleFactor || '1.0');
            if (block.src) el.setAttribute('data-permanent-src', block.src);
            if (block.thumb) el.setAttribute('data-thumb-src', block.thumb);
            el.style.width = block.width || '200px';
            el.innerHTML = `<img>`;
            const img = el.querySelector('img');
            if (block.alt && img) img.setAttribute('alt', block.alt);
            if (block.link) el.setAttribute('data-link', block.link);
            if (block.align) {
                el.style.textAlign = block.align;
                el.style.display = block.align === 'center' ? 'block' : 'inline-block';
                el.style.margin = block.align === 'center' ? '0 auto' : '0';
            }
            root.appendChild(el);
            // Instant if already cached (the common case); only a genuine
            // first-time disk read causes a brief resolve delay. Older
            // projects saved before thumbnails existed have no `thumb` —
            // fall back to the full-res src for those.
            applyResolvedImageSrc(img, block.thumb || block.src);
        }
        else if (block.type === 'multiImage') {
            const el = doc.createElement('div');
            el.className = 'block_multi_image';
            el.setAttribute('data-block-id', block.id);
            el.setAttribute('data-desired-w', block.desiredWidth || 100);
            el.setAttribute('data-ratio-val', block.aspectRatio || '1');
            el.style.gap = (block.gap || 0) + 'px';

            const handle = doc.createElement('div');
            handle.className = 'multi-image-handle';
            handle.innerText = 'ROW';
            el.appendChild(handle);

            (block.items || []).forEach(itemData => {
                const item = doc.createElement('div');
                item.className = 'multi-image-item';
                if (itemData.src) item.setAttribute('data-permanent-src', itemData.src);
                if (itemData.thumb) item.setAttribute('data-thumb-src', itemData.thumb);
                const img = doc.createElement('img');
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.display = 'block';
                img.style.objectPosition = itemData.objectPosition || '50% 50%';
                if (itemData.alt) img.setAttribute('alt', itemData.alt);
                item.appendChild(img);

                // Pan handle — same overlay used in triggerMultiImageAdd()
                // and matching gallery-component.html's .pan-overlay.
                const panOverlay = doc.createElement('div');
                panOverlay.className = 'multi-image-pan-overlay';
                panOverlay.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i>';
                item.appendChild(panOverlay);

                if (itemData.link) item.setAttribute('data-link', itemData.link);
                item.style.aspectRatio = (block.aspectRatio || '1').toString();
                el.appendChild(item);

                applyResolvedImageSrc(img, itemData.thumb || itemData.src);
            });

            root.appendChild(el);
            // Resolves each item's actual width/height from the row's
            // stored width/gap/ratio + current item count — same math used
            // while live-editing (see applyMultiImageLayout above).
            applyMultiImageLayout(el);
        }
        else if (block.type === 'gallery') {
            const el = doc.createElement('div');
            el.className = 'editable photo_gallery' + (block.mode === 'masonry' ? ' masonry-mode' : '');
            el.setAttribute('data-block-id', block.id);

            (block.images || []).forEach(imgData => {
                const item = buildGalleryItem(doc, '', imgData.originalName, imgData.src, imgData.pos, imgData.thumb);
                el.appendChild(item);
                const img = item.querySelector('img');
                // Older projects saved before thumbnails existed have no
                // `thumb` — fall back to the full-res src for those.
                applyResolvedImageSrc(img, imgData.thumb || imgData.src);
            });
            el.appendChild(buildGalleryEmptySlot(doc));

            root.appendChild(el);
            setupGalleryDragula(el);
        }
        else if (block.type === 'contactForm') {
            const el = doc.createElement('form');
            el.className = 'editable block_contact_form';
            el.setAttribute('action', 'mailto:lcazan.old@gmail.com');
            el.setAttribute('method', 'post');
            el.setAttribute('enctype', 'text/plain');
            el.setAttribute('onsubmit', 'return window.validateContactForm(this)');
            el.setAttribute('data-block-id', block.id);
            el.innerHTML = buildContactFormFieldsHTML();
            root.appendChild(el);
        }
        else if (block.type === 'container') {
            const el = doc.createElement('div');
            el.className = 'editable block_container';
            el.contentEditable = "false";
            el.setAttribute('data-block-id', block.id);
            if (block.bgColor) el.style.backgroundColor = block.bgColor;

            if (block.image) {
                const imgWrapper = doc.createElement('div');
                imgWrapper.className = 'editable block_image';
                imgWrapper.contentEditable = "false";
                imgWrapper.setAttribute('data-scale-factor', block.image.scaleFactor || '1.0');
                if (block.image.src) imgWrapper.setAttribute('data-permanent-src', block.image.src);
                if (block.image.thumb) imgWrapper.setAttribute('data-thumb-src', block.image.thumb);
                // Initial width — the ResizeObserver set up by initDivLogic()
                // recalculates this proportionally once it observes the
                // container, same as insertElement()'s original default.
                imgWrapper.style.width = '200px';
                imgWrapper.innerHTML = `<img>`;
                const innerImg = imgWrapper.querySelector('img');
                if (block.image.alt && innerImg) innerImg.setAttribute('alt', block.image.alt);
                if (block.image.link) imgWrapper.setAttribute('data-link', block.image.link);
                el.appendChild(imgWrapper);
                applyResolvedImageSrc(innerImg, block.image.thumb || block.image.src);
            }

            if (block.children && block.children.length) {
                const wrap = doc.createElement('div');
                wrap.className = 'div-other-wrapper';
                block.children.forEach(childData => {
                    const childEl = renderChildBlock(doc, childData);
                    if (childEl) wrap.appendChild(childEl);
                });
                el.appendChild(wrap);
            }

            root.appendChild(el);
            if (frame.contentWindow.initDivLogic) frame.contentWindow.initDivLogic();
        }
    });
}

// Reads a text block's current content and formatting straight from the DOM
// and writes it into getCurrentPage().body.blocks — updating the existing entry if this
// block was already saved (matched by data-block-id), or inserting a new
// entry at its current DOM position if this is its first save. Does NOT
// render — see saveSelectedBlock() for why saving and rendering are
// deliberately separate steps now.
function saveTextBlock(el) {
    const variant = el.classList.contains('section_heading') ? 'section_heading' :
                    el.classList.contains('block_heading') ? 'block_heading' :
                    'block_text';

    let blockId = el.getAttribute('data-block-id');
    if (!blockId) {
        blockId = 'blk_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        el.setAttribute('data-block-id', blockId);
    }

    const blockData = {
        id: blockId,
        type: 'text',
        variant: variant,
        contentHTML: el.innerHTML,
        align: el.style.textAlign || ''
    };

    const existingIndex = getCurrentPage().body.blocks.findIndex(b => b.id === blockId);
    if (existingIndex !== -1) {
        getCurrentPage().body.blocks[existingIndex] = blockData; // update in place, order unchanged
    } else {
        getCurrentPage().body.blocks.splice(getInsertIndexForNewBlock(el), 0, blockData); // new block, inserted at its DOM position
    }
}

// Switches a text block between T1 (section_heading/h2), T2 (block_heading/h3),
// and T3 (block_text/p). Since the tag itself changes, this rebuilds the
// element with the new tag, carries over its current content and alignment,
// and re-selects it so the toolbar reflects the new variant immediately.
function changeTextVariant(newVariant) {
    if (!selectedEl) return;
    const tagMap = { 'section_heading': 'h2', 'block_heading': 'h3', 'block_text': 'p' };
    const newTag = tagMap[newVariant];
    if (!newTag) return;

    const doc = frame.contentDocument;
    const newEl = doc.createElement(newTag);
    newEl.className = `editable ${newVariant}`;
    newEl.contentEditable = "true";
    newEl.setAttribute('data-placeholder', 'Type here...');
    const existingId = selectedEl.getAttribute('data-block-id');
    if (existingId) newEl.setAttribute('data-block-id', existingId);
    newEl.innerHTML = selectedEl.innerHTML;
    newEl.style.textAlign = selectedEl.style.textAlign || '';

    selectedEl.replaceWith(newEl);
    selectedEl = newEl;
    selectedEl.classList.add('selected-item');

    renderToolbar();
}

// Pushes a custom-html block's code into its sandboxed iframe, wiring up the
// height-reporting script. Called ONLY by the Activate button (via
// window.updateHTML) — no longer called from renderPage(), so a saved
// widget stays inert after a re-render until the user explicitly presses
// Activate again.
function activateCustomHtml(container) {
    const textarea = container.querySelector('.html-input-box');
    const code = textarea ? textarea.value : (container.getAttribute('data-html-code') || '');

    const sandboxIframe = container.querySelector('.widget-sandbox');
    if (!sandboxIframe) return;

    const frameDoc = sandboxIframe.contentDocument || sandboxIframe.contentWindow.document;
    frameDoc.open();
    frameDoc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
                img, video, iframe { max-width: 100%; }
            </style>
        </head>
        <body>
            ${code}
            <script>
                (function() {
                    const sendHeight = () => {
                        const height = document.documentElement.getBoundingClientRect().height || 
                                     document.body.scrollHeight || 
                                     document.documentElement.scrollHeight;
                        window.parent.postMessage({
                            type: 'sandboxHeight',
                            id: '${container.id}', 
                            height: Math.ceil(height)
                        }, '*');
                    };
                    window.addEventListener('load', sendHeight);
                    window.addEventListener('resize', sendHeight);
                    const observer = new MutationObserver(sendHeight);
                    observer.observe(document.body, { 
                        childList: true, 
                        subtree: true, 
                        attributes: true 
                    });
                    if (window.ResizeObserver) {
                        new ResizeObserver(sendHeight).observe(document.body);
                    }
                    let checks = 0;
                    const poll = setInterval(() => {
                        sendHeight();
                        if (checks++ > 20) clearInterval(poll);
                    }, 500);
                    setTimeout(sendHeight, 5000);
                })();
            <\/script>
        </body>
        </html>
    `);
    frameDoc.close();
}

// Reads one child element living inside a container's .div-other-wrapper
// and returns its data as a plain object. Only text/spacer/button
// /customHtml can nest inside a div (insertElement's early-return branches
// keep multiImage/gallery top-level only), so those are the only types
// handled here. Mirrors the same field shapes used for top-level blocks of
// the same type — deliberately a separate function rather than reusing
// saveTextBlock() etc. directly, since those write straight into
// getCurrentPage().body.blocks (top-level array bookkeeping) which doesn't apply to
// a container's nested children (rebuilt fresh as a plain array each save,
// same pattern as a multi-image row's items).
function extractChildBlockData(el) {
    let blockId = el.getAttribute('data-block-id');
    if (!blockId) {
        blockId = 'blk_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        el.setAttribute('data-block-id', blockId);
    }

    if (el.classList.contains('section_heading') || el.classList.contains('block_heading') || el.classList.contains('block_text')) {
        const variant = el.classList.contains('section_heading') ? 'section_heading' :
                        el.classList.contains('block_heading') ? 'block_heading' : 'block_text';
        return { id: blockId, type: 'text', variant: variant, contentHTML: el.innerHTML, align: el.style.textAlign || '' };
    }
    if (el.classList.contains('block_spacer')) {
        return { id: blockId, type: 'spacer', showLine: !!(el.style.borderBottom && el.style.borderBottom !== 'none') };
    }
    if (el.classList.contains('block_button_container')) {
        const link = el.querySelector('a');
        return { id: blockId, type: 'button', label: link ? link.innerText : 'FIND OUT MORE', href: link ? (link.getAttribute('href') || '#') : '#' };
    }
    if (el.classList.contains('block_custom_html')) {
        const textarea = el.querySelector('.html-input-box');
        const code = textarea ? textarea.value : (el.getAttribute('data-html-code') || '');
        return { id: blockId, type: 'customHtml', code: code };
    }
    return null;
}

// The render-side counterpart to extractChildBlockData(): builds a live DOM
// element from one child block's data. Mirrors the per-type element
// creation already used at the top level in renderPage(), scoped to the
// types that can nest inside a container.
function renderChildBlock(doc, block) {
    if (block.type === 'text') {
        const tagMap = { 'section_heading': 'h2', 'block_heading': 'h3', 'block_text': 'p' };
        const el = doc.createElement(tagMap[block.variant] || 'p');
        el.className = `editable ${block.variant}`;
        el.contentEditable = "true";
        el.setAttribute('data-placeholder', 'Type here...');
        el.setAttribute('data-block-id', block.id);
        el.innerHTML = block.contentHTML;
        if (block.align) el.style.textAlign = block.align;
        return el;
    }
    if (block.type === 'spacer') {
        const el = doc.createElement('div');
        el.className = 'editable block_spacer';
        el.contentEditable = "false";
        el.setAttribute('data-block-id', block.id);
        el.style.borderBottom = block.showLine ? '1px solid #eee' : 'none';
        return el;
    }
    if (block.type === 'button') {
        const el = doc.createElement('div');
        el.className = 'editable block_button_container';
        el.contentEditable = "false";
        el.setAttribute('data-block-id', block.id);
        el.innerHTML = `<a href="${block.href}" class="block_button" onclick="return false;">${block.label}</a>`;
        return el;
    }
    if (block.type === 'customHtml') {
        const el = doc.createElement('div');
        el.className = 'editable block_custom_html';
        el.contentEditable = "false";
        el.id = 'customhtml_' + block.id;
        el.setAttribute('data-block-id', block.id);
        el.setAttribute('data-html-code', block.code || '');
        el.innerHTML = `
            <div class="custom-html-ui-container" contenteditable="false">
                <div class="custom-html-header">
                    <span><i class="fa-solid fa-code"></i> Custom HTML/Widget</span>
                    <button class="activate-btn" onclick="window.parent.updateHTML(this)">Activate</button>
                </div>
                <textarea class="html-input-box" placeholder="Paste your embed code here..." 
                    oninput="this.closest('.block_custom_html').setAttribute('data-html-code', this.value);"></textarea>
            </div>
            <div class="html-render-area"></div> 
            <div class="sandbox-iframe-wrapper">
                <iframe class="widget-sandbox" sandbox="allow-scripts allow-popups allow-forms allow-same-origin"></iframe>
            </div>
        `;
        const textarea = el.querySelector('.html-input-box');
        if (textarea) textarea.value = block.code || '';
        return el;
    }
    return null;
}

function saveContainerBlock(el) {
    let blockId = el.getAttribute('data-block-id');
    if (!blockId) {
        blockId = 'blk_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        el.setAttribute('data-block-id', blockId);
    }

    const imgWrapper = el.querySelector(':scope > .block_image');
    let image = null;
    if (imgWrapper) {
        const img = imgWrapper.querySelector('img');

            thumb: imgWrapper.getAttribute('data-thumb-src') || '',

            link: imgWrapper.getAttribute('data-link') || '',
            alt: img ? (img.getAttribute('alt') || '') : ''
        };
    }

    const wrap = el.querySelector(':scope > .div-other-wrapper');
    const children = [];
    if (wrap) {
        Array.from(wrap.children).forEach(child => {
            const data = extractChildBlockData(child);
            if (data) children.push(data);
        });
    }

    const blockData = {
        id: blockId,
        type: 'container',
        bgColor: el.style.backgroundColor || '',
        image: image,
        children: children
    };

    const existingIndex = getCurrentPage().body.blocks.findIndex(b => b.id === blockId);
    if (existingIndex !== -1) {
        getCurrentPage().body.blocks[existingIndex] = blockData;
    } else {
        getCurrentPage().body.blocks.splice(getInsertIndexForNewBlock(el), 0, blockData);
    }
}

// Single dispatcher used everywhere a block needs to be saved: figures out
// what kind of block `el` is (including resolving a multi-image-item up to
// its parent row, since items aren't tracked independently) and calls the
// matching save*Block() function. Deliberately does NOT call renderPage() —
// callers decide separately whether a render is also warranted right now.
// Used by: selectElement() (switching focus directly between two blocks),
// deselectAll() (clicking to empty space, which also renders afterward),
// openPill() (switching pill fields), and applyAndClosePill() (Apply
// button, or auto-apply on deselect).
function saveSelectedBlock(el) {
    if (!el) return;

    // If this element IS a container, or is nested inside one, any edit is
    // saved by re-serializing the WHOLE container fresh — nested children
    // aren't tracked as independent top-level getCurrentPage().body.blocks entries,
    // same pattern as multi-image items being saved via their parent row.
    // el.closest() matches el itself if el already has the class, so this
    // correctly covers both "the container itself was edited" and "a child
    // inside it was edited".
    const parentContainer = el.closest('.block_container');
    if (parentContainer) {
        saveContainerBlock(parentContainer);
        return;
    }

    const isTextBlock = el.classList.contains('section_heading') ||
                         el.classList.contains('block_heading') ||
                         el.classList.contains('block_text');

    if (isTextBlock) {
        saveTextBlock(el);
    } else if (el.classList.contains('block_spacer')) {
        saveSpacerBlock(el);
    } else if (el.classList.contains('block_button_container')) {
        saveButtonBlock(el);
    } else if (el.classList.contains('block_custom_html')) {
        saveCustomHtmlBlock(el);
    } else if (el.classList.contains('block_image')) {
        saveImageBlock(el);
    } else if (el.classList.contains('block_multi_image')) {
        saveMultiImageBlock(el);
    } else if (el.classList.contains('multi-image-item')) {
        const row = el.closest('.block_multi_image');
        if (row) saveMultiImageBlock(row);
    } else if (el.classList.contains('photo_gallery')) {
        saveGalleryBlock(el);
    } else if (el.classList.contains('block_contact_form')) {
        saveContactFormBlock(el);
    }
}

    function deleteElement() { 
    if(selectedEl) { 
        const iframeDoc = frame.contentDocument;
        const p = selectedEl.parentElement; 
        
        // 1. Check if we are deleting a Custom HTML block
        const isHTMLBlock = selectedEl.classList.contains('block_custom_html');

        // --- JSON SOURCE OF TRUTH: flag migrated blocks for removal from getCurrentPage().body.blocks ---
        const isMigratedBlock = selectedEl.classList.contains('section_heading') ||
                                 selectedEl.classList.contains('block_heading') ||
                                 selectedEl.classList.contains('block_text') ||
                                 selectedEl.classList.contains('block_spacer') ||
                                 selectedEl.classList.contains('block_button_container') ||
                                 selectedEl.classList.contains('block_custom_html') ||
                                 selectedEl.classList.contains('block_image') ||
                                 selectedEl.classList.contains('block_multi_image') ||
                                 selectedEl.classList.contains('photo_gallery') ||
                                 selectedEl.classList.contains('block_contact_form') ||
                                 selectedEl.classList.contains('block_container');
        const blockId = selectedEl.getAttribute('data-block-id');

        // A multi-image-item has no data-block-id of its own — it's just an
        // entry inside its parent row's `items` array. Deleting one means
        // re-saving the parent row (without this item) and re-flowing the
        // remaining items to fill the space, rather than removing anything
        // from getCurrentPage().body.blocks directly.
        const isMultiImageItem = selectedEl.classList.contains('multi-image-item');
        const parentRow = isMultiImageItem ? selectedEl.closest('.block_multi_image') : null;

        // Similarly, anything nested inside a container (a child block, or
        // the container's own image) isn't a top-level getCurrentPage().body.blocks
        // entry either — deleting it means re-saving the PARENT container
        // fresh, without this child. el.closest() only matches ancestors,
        // so this is false when selectedEl IS the container itself (that
        // case falls through to the normal top-level removal below).
        const parentContainer = selectedEl.closest('.block_container');
        const isNestedInContainer = parentContainer && parentContainer !== selectedEl;

        // 2. Remove the block itself
        selectedEl.remove(); 
        if (p && p.classList.contains('div-other-wrapper') && p.children.length === 0) p.remove(); 
        
        // 3. OBLITERATE THE INFECTION
        // If it was an HTML block, find everything tagged 'dudu' and kill it
        if (isHTMLBlock) {
            iframeDoc.querySelectorAll('[data-origin="dudu"]').forEach(el => el.remove());
            console.log("Widget infection obliterated.");
        }

        // Remove from getCurrentPage().body.blocks so it doesn't come back on next
        // render. Skipped for nested-in-container children — they were
        // never top-level entries, so this filter would be a harmless
        // no-op for them anyway; the real fix is saveContainerBlock() below.
        if (isMigratedBlock && blockId && !isNestedInContainer) {
            getCurrentPage().body.blocks = getCurrentPage().body.blocks.filter(b => b.id !== blockId);
        }

        if (parentRow) {
            applyMultiImageLayout(parentRow); // resize remaining items to fill the freed space
            saveMultiImageBlock(parentRow); // persist the row without the deleted item
        }

        if (isNestedInContainer) {
            saveContainerBlock(parentContainer); // persist the container without the deleted child/image
        }

        // Reset the toolbar container's stretched height BEFORE clearing
        // selectedEl. Multi-image rows/items get a tall, vertically-stacked
        // toolbar (see renderToolbar()'s isMultiRow branch) — normally
        // resetToolbar() restores the standard height when deselecting, but
        // that check lives inside deselectAll() and is gated on selectedEl
        // still being set, which we're about to null out below. Without
        // this, deleting a multi-image row/item left the toolbar's dark
        // background bar behind even though its buttons had disappeared.
        const wasMulti = selectedEl.classList.contains('multi-image-item') ||
                          selectedEl.classList.contains('block_multi_image');
        if (wasMulti) {
            resetToolbar();
        }

        // Clear selectedEl BEFORE deselectAll() so it doesn't try to
        // re-save a block we just deleted. deselectAll() always renders at
        // the end, so no separate renderPage() call is needed here.
        selectedEl = null;
        deselectAll(); 
    } 
}
