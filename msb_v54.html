<script id="v50-local-first-storage">
(function(){
  // ==================================================================
  // Local-first storage: project data + photo blobs live in IndexedDB.
  // A persistent isSaved flag tracks whether the browser copy is ahead
  // of the last exported .zip file. Saving/loading is done through a
  // single portable .zip (msb.json + images/originals|lightbox|thumbnails),
  // exported via the native Save dialog on desktop or the Share Sheet on
  // iOS/Android, and re-imported through a plain file picker.
  // ==================================================================

  const IDB_NAME='msbSnooLocalDB', IDB_VERSION=1;
  const STORE_META='meta', STORE_IMAGES='images';
  const META_DATA_KEY='projectData', META_SAVED_KEY='isSaved';
  const IMAGES_DIR='images', ORIGINALS_DIR='originals', LIGHTBOX_DIR='lightbox', THUMBS_DIR='thumbnails';

  let isSavedFlag=true; // in-memory mirror of the persisted flag, for instant UI updates
  window.__msbSuppressDirty=false; // true while we're loading/importing, not editing

  // ---- IndexedDB helpers ----
  function idbOpen(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(IDB_NAME,IDB_VERSION);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
        if(!db.objectStoreNames.contains(STORE_IMAGES)) db.createObjectStore(STORE_IMAGES);
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async function idbGetMeta(key){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_META,'readonly');
      const req=tx.objectStore(STORE_META).get(key);
      req.onsuccess=()=>resolve(req.result===undefined?null:req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async function idbSetMeta(key,val){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_META,'readwrite');
      tx.objectStore(STORE_META).put(val,key);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }
  async function idbSetImage(path,blob){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_IMAGES,'readwrite');
      tx.objectStore(STORE_IMAGES).put(blob,path);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }
  async function idbGetImage(path){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_IMAGES,'readonly');
      const req=tx.objectStore(STORE_IMAGES).get(path);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }
  async function idbAllImageEntries(){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_IMAGES,'readonly');
      const entries=[];
      const req=tx.objectStore(STORE_IMAGES).openCursor();
      req.onsuccess=e=>{
        const cursor=e.target.result;
        if(cursor){ entries.push({path:cursor.key,blob:cursor.value}); cursor.continue(); }
        else resolve(entries);
      };
      req.onerror=()=>reject(req.error);
    });
  }
  async function idbClearImages(){
    const db=await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_IMAGES,'readwrite');
      tx.objectStore(STORE_IMAGES).clear();
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }

  // ---- Dataset helpers ----
  function blankDataset(){
    return {
      snoos: (typeof createInitialSnoos==='function') ? createInitialSnoos() : {},
      categories: JSON.parse(JSON.stringify(defaultCategories)),
      dscInvoices: [],
      selectedId: 'MSB-001'
    };
  }
  function applyDataset(ds){
    snoos = ds.snoos || (typeof createInitialSnoos==='function' ? createInitialSnoos() : {});
    categories = ds.categories || JSON.parse(JSON.stringify(defaultCategories));
    for(const k of Object.keys(defaultCategories)) if(!Array.isArray(categories[k])||!categories[k].length) categories[k]=JSON.parse(JSON.stringify(defaultCategories[k]));
    selectedId = (ds.selectedId && snoos[ds.selectedId]) ? ds.selectedId : Object.keys(snoos)[0];
    if(Array.isArray(window.dscInvoices)){
      window.dscInvoices.length=0;
      (ds.dscInvoices||[]).forEach(x=>window.dscInvoices.push(x));
    } else {
      window.dscInvoices=ds.dscInvoices||[];
    }
    if(typeof normalizeRecords==='function') normalizeRecords();
    if(snoos) Object.values(snoos).forEach(s=>{
      if(typeof ensureStatus==='function') ensureStatus(s);
      if(typeof recalculateStatusFromHistory==='function') recalculateStatusFromHistory(s);
    });
  }
  function buildProjectPayload(){
    return {version:3, savedAt:new Date().toISOString(), snoos, categories, selectedId, dscInvoices: window.dscInvoices||[]};
  }

  // ---- isSaved indicator ----
  function updateSaveIndicator(){
    const btn=document.getElementById('saveDataBtn');
    if(!btn) return;
    btn.classList.toggle('is-dirty', isSavedFlag===false);
    btn.title = isSavedFlag===false ? 'You have unsaved changes since the last Save Data export' : 'All changes are included in your last Save Data export';
  }
  async function setIsSaved(v){
    isSavedFlag=v;
    await idbSetMeta(META_SAVED_KEY,v);
    updateSaveIndicator();
  }

  // ---- Persist to IndexedDB (replaces the old folder/localStorage writers) ----
  window.saveData=function(){
    if(typeof normalizeRecords==='function') normalizeRecords();
    if(snoos) Object.values(snoos).forEach(s=>{ if(typeof recalculateStatusFromHistory==='function') recalculateStatusFromHistory(s); });
    const payload=buildProjectPayload();
    idbSetMeta(META_DATA_KEY,payload).catch(e=>console.error('Could not save locally',e));
    if(!window.__msbSuppressDirty) setIsSaved(false);

  // ==================================================================
  // Image storage: three tiers per photo, written as Blobs into
  // IndexedDB under the same path scheme the old folder layout used
  // (images/originals, images/lightbox, images/thumbnails), so a
  // manually-extracted .zip still looks and reads the same way.
  // ==================================================================
  function randomName(){ return `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }
  async function writeImageBlob(subfolder,filename,blob){
    const path=`${IMAGES_DIR}/${subfolder}/${filename}`;
    await idbSetImage(path,blob);
    return path;
  }
  function loadImage(dataUrl){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=dataUrl;
    });
  }
  function canvasToBlob(canvas,type,quality){
    return new Promise(resolve=>canvas.toBlob(resolve,type,quality));
  }

  window.fileToDataURL=async function(file){
    const readAsDataURL=()=>new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
    const dataUrl=await readAsDataURL();
    const img=await loadImage(dataUrl).catch(()=>null);
    const base=randomName();

    // Always keep the original file exactly as selected, metadata intact.
    const origExt=(file.name.split('.').pop()||'jpg').toLowerCase();
    const originalPath=await writeImageBlob(ORIGINALS_DIR,`${base}_orig.${origExt}`,file);

    if(!img){
      return {name:file.name,type:file.type,path:originalPath,thumbPath:originalPath,originalPath,data:null,thumb:null};
    }

    // Lightbox tier: longest edge capped at 2048px, WebP quality 0.80.
    const maxLightbox=2048;
    const lbScale=Math.min(1,maxLightbox/Math.max(img.naturalWidth,img.naturalHeight));
    const lbCanvas=document.createElement('canvas');
    lbCanvas.width=Math.max(1,Math.round(img.naturalWidth*lbScale));
    lbCanvas.height=Math.max(1,Math.round(img.naturalHeight*lbScale));
    lbCanvas.getContext('2d').drawImage(img,0,0,lbCanvas.width,lbCanvas.height);
    const lightboxBlob=await canvasToBlob(lbCanvas,'image/webp',0.80);
    const lightboxPath=await writeImageBlob(LIGHTBOX_DIR,`${base}.webp`,lightboxBlob);

    // Thumbnail tier: 250x250 center-cropped square, WebP quality 0.75.
    const thumbSize=250;
    const side=Math.min(img.naturalWidth,img.naturalHeight);
    const sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
    const thumbCanvas=document.createElement('canvas');
    thumbCanvas.width=thumbSize; thumbCanvas.height=thumbSize;
    thumbCanvas.getContext('2d').drawImage(img,sx,sy,side,side,0,0,thumbSize,thumbSize);
    const thumbBlob=await canvasToBlob(thumbCanvas,'image/webp',0.75);
    const thumbPath=await writeImageBlob(THUMBS_DIR,`${base}_thumb.webp`,thumbBlob);

    return {name:file.name,type:'image/webp',path:lightboxPath,thumbPath,originalPath,data:null,thumb:null};
  };

  // ---- Lazy-loading: images are referenced by path, resolved to blob URLs on demand. ----
  let blobUrlCache=new Map();
  function resetBlobUrlCache(){
    blobUrlCache.forEach(url=>{ try{ URL.revokeObjectURL(url); }catch(e){} });
    blobUrlCache=new Map();
    document.querySelectorAll('img.lazy-photo[data-hydrated]').forEach(img=>{ img.removeAttribute('data-hydrated'); img.removeAttribute('src'); });
  }
  async function resolveImagePath(path){
    if(!path) return '';
    if(blobUrlCache.has(path)) return blobUrlCache.get(path);
    try{
      const blob=await idbGetImage(path);
      if(!blob) return '';
      const url=URL.createObjectURL(blob);
      blobUrlCache.set(path,url);
      return url;
    }catch(e){ console.error('Could not load image',path,e); return ''; }
  }
  async function hydrateLazyPhoto(img){
    if(img.dataset.hydrated) return;
    img.dataset.hydrated='1';
    const key=img.dataset.photoKey;
    if(!key) return;
    const url=await resolveImagePath(key);
    if(url) img.src=url;
  }
  function hydrateAllLazyPhotos(root){
    (root||document).querySelectorAll('img.lazy-photo:not([data-hydrated])').forEach(hydrateLazyPhoto);
  }
  new MutationObserver(()=>hydrateAllLazyPhotos(document)).observe(document.body,{childList:true,subtree:true});

  function photoImgTag(p,extraClass){
    const key=p.thumbPath||p.path||'';
    return `<img class="${extraClass} lazy-photo" data-photo-key="${esc(key)}" src="" alt="${esc(p.name||'Photo')}">`;
  }

  window.photoHtmlClickable=function(photos){
    if(!photos?.length) return '';
    const id='photoset-'+(++photoSetCounter); photoSets[id]=photos;
    return `<div class="photo-grid">${photos.map((p,i)=>`<button type="button" class="photo-button" onclick="event.stopPropagation();openLightbox('${id}',${i})">${photoImgTag(p,'photo-thumb')}</button>`).join('')}</div>`;
  };
  window.photoHtmlEditable=function(photos){
    if(!photos?.length) return '';
    const id='editphotoset-'+(++photoSetCounter); photoSets[id]=photos;
    return `<div class="return-assessment-photo-grid">${photos.map((p,i)=>`<button type="button" class="return-assessment-photo-button" onclick="event.stopPropagation();openLightbox('${id}',${i})">${photoImgTag(p,'return-assessment-photo-thumb')}</button>`).join('')}</div>`;
  };

  // ---- Lightbox: a horizontal slide track, one slide per photo. Swiping
  // left/right — or tapping the arrow buttons — slides smoothly to the
  // neighboring photo, using the same track-translate mechanism as the
  // rental calendar's swipeable time periods. Each slide lazily resolves
  // its own image (current slide plus one neighbor each side) so paging
  // through a large photo set stays fast.
  const LIGHTBOX_VELOCITY = 2500; // px/sec
  let lightboxPhotos=null, lightboxSetId=null, lightboxIndex=0;
  let lbDragging=false, lbStartX=0, lbDragDX=0;

  function lightboxSlideDuration(px){ return Math.min(.4,Math.max(.14,px/LIGHTBOX_VELOCITY)); }

  function lightboxBuildTrack(){
    const track=document.getElementById('lightboxTrack'); if(!track) return;
    track.innerHTML=lightboxPhotos.map((p,idx)=>`<div class="lightbox-slide" data-index="${idx}"><div class="lightbox-loader"></div><img class="lightbox-img" alt="${esc(p.name||'Photo')}"></div>`).join('');
  }

  function lightboxLoadSlide(idx){
    const photos=lightboxPhotos;
    if(!photos || idx<0 || idx>=photos.length) return;
    const slide=document.querySelector(`#lightboxTrack .lightbox-slide[data-index="${idx}"]`);
    if(!slide || slide.dataset.loading || slide.dataset.loaded) return;
    const p=photos[idx], key=p.path||p.thumbPath||'';
    const img=slide.querySelector('.lightbox-img'), loader=slide.querySelector('.lightbox-loader');
    if(!key){ if(loader) loader.classList.remove('visible'); return; }
    slide.dataset.loading='1';
    if(loader) loader.classList.add('visible');
    resolveImagePath(key).then(url=>{
      slide.dataset.loading='';
      if(photos!==lightboxPhotos) return; // this photo set was closed/replaced while loading
      if(!url){ if(loader) loader.classList.remove('visible'); return; }
      img.onload=()=>{ img.classList.add('loaded'); if(loader) loader.classList.remove('visible'); };
      img.src=url;
      slide.dataset.loaded='1';
    });
  }

  function lightboxUpdateChrome(){
    const cap=document.getElementById('lightboxCaption'),prev=document.getElementById('lightboxPrev'),next=document.getElementById('lightboxNext'),del=document.getElementById('lightboxDelete');
    cap.textContent=`${lightboxIndex+1} of ${lightboxPhotos.length}`;
    prev.style.visibility=lightboxIndex?'visible':'hidden';
    next.style.visibility=lightboxIndex<lightboxPhotos.length-1?'visible':'hidden';
    const canDelete = lightboxSetId.startsWith('editphotoset-') && (
      (window.returnPhotoState && window.returnPhotoState.photos===lightboxPhotos) ||
      (window.dscPhotoState && (window.dscPhotoState.before===lightboxPhotos || window.dscPhotoState.after===lightboxPhotos))
    );
    del.style.display=canDelete?'block':'none';
    del.onclick=()=>{
      if(!canDelete) return;
      lightboxPhotos.splice(lightboxIndex,1);
      const rerenderThumbs=()=>{
        if(window.returnPhotoState&&window.returnPhotoState.photos===lightboxPhotos) renderReturnPhotoPreview();
        if(window.dscPhotoState&&window.dscPhotoState.before===lightboxPhotos) renderDscPhotoPreview('before');
        if(window.dscPhotoState&&window.dscPhotoState.after===lightboxPhotos) renderDscPhotoPreview('after');
      };
      if(!lightboxPhotos.length){ closeLightbox(); rerenderThumbs(); return; }
      if(lightboxIndex>=lightboxPhotos.length) lightboxIndex=lightboxPhotos.length-1;
      lightboxBuildTrack();
      lightboxSetPosition(false);
      lightboxLoadSlide(lightboxIndex); lightboxLoadSlide(lightboxIndex-1); lightboxLoadSlide(lightboxIndex+1);
      rerenderThumbs();
    };
  }

  function lightboxSetPosition(animate){
    const track=document.getElementById('lightboxTrack'), viewport=document.getElementById('lightboxTrackViewport');
    if(!track||!viewport) return;
    const vw=viewport.offsetWidth;
    track.style.transition=animate?`transform ${lightboxSlideDuration(vw)}s ease-out`:'none';
    track.style.transform=`translateX(${-lightboxIndex*vw}px)`;
    lightboxUpdateChrome();
  }

  function lightboxGoTo(idx,animate){
    lightboxIndex=Math.max(0,Math.min(idx,lightboxPhotos.length-1));
    lightboxSetPosition(animate);
    lightboxLoadSlide(lightboxIndex); lightboxLoadSlide(lightboxIndex+1); lightboxLoadSlide(lightboxIndex-1);
  }

  function lightboxWireSwipe(){
    const viewport=document.getElementById('lightboxTrackViewport'), track=document.getElementById('lightboxTrack');
    if(!viewport||!track||viewport.dataset.swipeBound) return;
    viewport.dataset.swipeBound='1';
    viewport.addEventListener('touchstart',e=>{
      lbDragging=true; lbStartX=e.touches[0].clientX; lbDragDX=0;
      track.style.transition='none';
    },{passive:true});
    viewport.addEventListener('touchmove',e=>{
      if(!lbDragging) return;
      lbDragDX=e.touches[0].clientX-lbStartX;
      const vw=viewport.offsetWidth;
      track.style.transform=`translateX(${-lightboxIndex*vw+lbDragDX}px)`;
    },{passive:true});
    viewport.addEventListener('touchend',()=>{
      if(!lbDragging) return;
      lbDragging=false;
      if(lbDragDX<-50) lightboxGoTo(lightboxIndex+1,true);
      else if(lbDragDX>50) lightboxGoTo(lightboxIndex-1,true);
      else lightboxSetPosition(true);
    });
  }
  window.addEventListener('resize',()=>{ if(document.getElementById('lightboxBackdrop')?.classList.contains('open')) lightboxSetPosition(false); });

  window.openLightbox=function(id,i){
    const photos=photoSets[id];
    if(!photos?.length) return;
    lightboxPhotos=photos; lightboxSetId=id;
    lightboxBuildTrack();
    lightboxWireSwipe();
    document.getElementById('lightboxBackdrop').classList.add('open');
    lightboxGoTo(i,false);
    document.getElementById('lightboxPrev').onclick=()=>{ if(lightboxIndex>0) lightboxGoTo(lightboxIndex-1,true); };
    document.getElementById('lightboxNext').onclick=()=>{ if(lightboxIndex<lightboxPhotos.length-1) lightboxGoTo(lightboxIndex+1,true); };
  };

  // ==================================================================
  // ZIP packaging (store method — no compression). Photos are already
  // compressed formats (JPEG/WebP), so this keeps the code dependency-
  // free while still producing a standard .zip anyone can open and
  // manually pull images out of if something goes wrong.
  // ==================================================================
  let crcTable=null;
  function crc32(bytes){
    if(!crcTable){
      crcTable=new Uint32Array(256);
      for(let n=0;n<256;n++){
        let c=n;
        for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        crcTable[n]=c>>>0;
      }
    }
    let crc=0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++) crc=crcTable[(crc^bytes[i])&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }
  function dosDateTime(d){
    d=d||new Date();
    const dosTime=((d.getHours()&0x1f)<<11)|((d.getMinutes()&0x3f)<<5)|((d.getSeconds()>>1)&0x1f);
    const dosDate=(((d.getFullYear()-1980)&0x7f)<<9)|(((d.getMonth()+1)&0xf)<<5)|(d.getDate()&0x1f);
    return {dosTime,dosDate};
  }
  function zipFiles(files){
    const {dosTime,dosDate}=dosDateTime();
    const encoder=new TextEncoder();
    const localParts=[], centralParts=[];
    let offset=0;
    for(const f of files){
      const nameBytes=encoder.encode(f.name);
      const data=f.data;
      const crc=crc32(data);
      const size=data.length;

      const local=new DataView(new ArrayBuffer(30));
      local.setUint32(0,0x04034b50,true);
      local.setUint16(4,20,true);
      local.setUint16(6,0,true);
      local.setUint16(8,0,true);
      local.setUint16(10,dosTime,true);
      local.setUint16(12,dosDate,true);
      local.setUint32(14,crc,true);
      local.setUint32(18,size,true);
      local.setUint32(22,size,true);
      local.setUint16(26,nameBytes.length,true);
      local.setUint16(28,0,true);
      localParts.push(new Uint8Array(local.buffer),nameBytes,data);

      const central=new DataView(new ArrayBuffer(46));
      central.setUint32(0,0x02014b50,true);
      central.setUint16(4,20,true);
      central.setUint16(6,20,true);
      central.setUint16(8,0,true);
      central.setUint16(10,0,true);
      central.setUint16(12,dosTime,true);
      central.setUint16(14,dosDate,true);
      central.setUint32(16,crc,true);
      central.setUint32(20,size,true);
      central.setUint32(24,size,true);
      central.setUint16(28,nameBytes.length,true);
      central.setUint16(30,0,true);
      central.setUint16(32,0,true);
      central.setUint16(34,0,true);
      central.setUint16(36,0,true);
      central.setUint32(38,0,true);
      central.setUint32(42,offset,true);
      centralParts.push(new Uint8Array(central.buffer),nameBytes);

      offset+=30+nameBytes.length+size;
    }
    const centralStart=offset;
    let centralSize=0;
    centralParts.forEach(p=>centralSize+=p.length);

    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);
    end.setUint16(4,0,true);
    end.setUint16(6,0,true);
    end.setUint16(8,files.length,true);
    end.setUint16(10,files.length,true);
    end.setUint32(12,centralSize,true);
    end.setUint32(16,centralStart,true);
    end.setUint16(20,0,true);

    return new Blob([...localParts,...centralParts,new Uint8Array(end.buffer)],{type:'application/zip'});
  }
  async function buildZipBlob(payload,imageEntries){
    const encoder=new TextEncoder();
    const files=[{name:'msb.json',data:encoder.encode(JSON.stringify(payload,null,2))}];
    for(const {path,blob} of imageEntries){
      files.push({name:path,data:new Uint8Array(await blob.arrayBuffer())});
    }
    return zipFiles(files);
  }
  function guessMime(name){
    const ext=(name.split('.').pop()||'').toLowerCase();
    if(ext==='webp') return 'image/webp';
    if(ext==='jpg'||ext==='jpeg') return 'image/jpeg';
    if(ext==='png') return 'image/png';
    if(ext==='gif') return 'image/gif';
    if(ext==='heic'||ext==='heif') return 'image/heic';
    return 'application/octet-stream';
  }
  async function parseZipBlob(file){
    const buf=new Uint8Array(await file.arrayBuffer());
    const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
    let eocdOffset=-1;
    const minEOCD=22;
    const scanStart=Math.max(0,buf.length-Math.min(buf.length,65557));
    for(let i=buf.length-minEOCD;i>=scanStart;i--){
      if(dv.getUint32(i,true)===0x06054b50){ eocdOffset=i; break; }
    }
    if(eocdOffset<0) throw new Error('This does not look like a valid .zip file.');
    const totalEntries=dv.getUint16(eocdOffset+10,true);
    const centralOffset=dv.getUint32(eocdOffset+16,true);

    let payload=null;
    const images=[];
    let ptr=centralOffset;
    for(let i=0;i<totalEntries;i++){
      if(dv.getUint32(ptr,true)!==0x02014b50) throw new Error('Corrupt zip central directory.');
      const method=dv.getUint16(ptr+10,true);
      const compSize=dv.getUint32(ptr+20,true);
      const nameLen=dv.getUint16(ptr+28,true);
      const extraLen=dv.getUint16(ptr+30,true);
      const commentLen=dv.getUint16(ptr+32,true);
      const localOffset=dv.getUint32(ptr+42,true);
      const name=new TextDecoder().decode(buf.slice(ptr+46,ptr+46+nameLen));
      ptr+=46+nameLen+extraLen+commentLen;

      const lSig=dv.getUint32(localOffset,true);
      if(lSig!==0x04034b50) throw new Error('Corrupt zip entry for '+name);
      const lNameLen=dv.getUint16(localOffset+26,true);
      const lExtraLen=dv.getUint16(localOffset+28,true);
      const dataStart=localOffset+30+lNameLen+lExtraLen;
      const rawData=buf.slice(dataStart,dataStart+compSize);

      let fileBytes;
      if(method===0){
        fileBytes=rawData;
      } else if(method===8 && typeof DecompressionStream!=='undefined'){
        const stream=new Blob([rawData]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        fileBytes=new Uint8Array(await new Response(stream).arrayBuffer());
      } else {
        throw new Error('Unsupported compression method in zip entry: '+name);
      }

      if(name==='msb.json'){
        payload=JSON.parse(new TextDecoder().decode(fileBytes));
      } else if(name.startsWith(IMAGES_DIR+'/')){
        images.push({path:name,blob:new Blob([fileBytes],{type:guessMime(name)})});
      }
    }
    return {payload,images};
  }

  // ==================================================================
  // Save Data: unified cross-platform export.
  //   Desktop (showSaveFilePicker available) -> native Save-As dialog.
  //   iOS / Android (Web Share with files) -> native Share Sheet.
  //   Otherwise -> plain browser download.
  // ==================================================================
  window.msbSaveData=async function(){
    const btn=document.getElementById('saveDataBtn');
    const originalLabel=btn?btn.textContent:'Save Data';
    if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
    try{
      const payload=buildProjectPayload();
      const images=await idbAllImageEntries();
      const zipBlob=await buildZipBlob(payload,images);
      const filename=`msb-snoo-backup-${todayISO()}.zip`;
      let saved=false;

      if(window.showSaveFilePicker){
        try{
          const handle=await window.showSaveFilePicker({
            suggestedName:filename,
            types:[{description:'MSB SNOO Backup',accept:{'application/zip':['.zip']}}]
          });
          const writable=await handle.createWritable();
          await writable.write(zipBlob);
          await writable.close();
          saved=true;
        }catch(e){
          if(e && e.name==='AbortError') return; // user cancelled the dialog
          console.error(e);
        }
      }

      if(!saved){
        const file=new File([zipBlob],filename,{type:'application/zip'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          try{
            await navigator.share({files:[file],title:'MSB SNOO Backup',text:filename});
            saved=true;
          }catch(e){
            if(e && e.name==='AbortError') return; // user cancelled the share sheet
            console.error(e);
          }
        }
      }

      if(!saved){
        const a=document.createElement('a');
        a.href=URL.createObjectURL(zipBlob);
        a.download=filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),4000);
        saved=true;
      }

      if(saved) await setIsSaved(true);
    }catch(e){
      console.error(e);
      alert('Could not save the project file. Please try again.');
    }finally{
      if(btn){ btn.disabled=false; btn.textContent='Save Data'; updateSaveIndicator(); }
    }
  };

  // ==================================================================
  // Load Data: import a previously-exported .zip, replacing everything
  // currently cached in this browser.
  // ==================================================================
  window.msbLoadDataFile=async function(file){
    if(!file) return;
    if(!confirm('Loading a project file will replace all data currently cached in this browser. Continue?')) return;
    try{
      const {payload,images}=await parseZipBlob(file);
      if(!payload || !payload.snoos) throw new Error('This file does not look like an MSB SNOO backup.');
      await idbClearImages();
      for(const img of images) await idbSetImage(img.path,img.blob);
      await idbSetMeta(META_DATA_KEY,payload);
      resetBlobUrlCache();
      window.__msbSuppressDirty=true;
      applyDataset(payload);
      window.__msbSuppressDirty=false;
      await setIsSaved(true);
      if(typeof renderList==='function') renderList();
      if(typeof renderDetail==='function') renderDetail();
      hideStartupGate();
      alert('Project loaded successfully.');
    }catch(e){
      console.error(e);
      alert('Could not load that file: '+(e.message||'unknown error'));
    }
  };

  document.addEventListener('DOMContentLoaded',()=>{
    const input=document.getElementById('loadDataInput');
    if(input) input.addEventListener('change',()=>{
      const f=input.files && input.files[0];
      input.value='';
      if(f) window.msbLoadDataFile(f);
    });
  });

  // ==================================================================
  // Startup gate.
  //   - Local data exists, isSaved === false -> load it straight away,
  //     no prompt (browser copy is newer than any export).
  //   - Local data exists, isSaved === true  -> ask whether to load a
  //     saved file or continue with the cached (already-exported) copy.
  //   - No local data at all (first run ever) -> ask to load a file or
  //     start a new project.
  // ==================================================================
  function gateEl(){ return document.getElementById('msbStartupGate'); }
  function hideStartupGate(){ const g=gateEl(); if(g) g.classList.add('hidden'); }
  function showStartupGate(mode,cachedPayload){
    let gate=gateEl();
    if(!gate){ gate=document.createElement('div'); gate.id='msbStartupGate'; document.body.appendChild(gate); }
    gate.classList.remove('hidden');
    const isFirstRun = mode==='first';
    gate.innerHTML=`<div class="gate-card">
      <h2>${isFirstRun?'Welcome to MSB SNOO Inventory':'Project was exported'}</h2>
      <p>${isFirstRun
        ? 'Load a previously saved project file (.zip) to continue where you left off, or start a brand new project on this device.'
        : 'Your project was last saved to a file, and there are no newer changes cached in this browser. Load a saved project file, or continue with the cached browser data.'}</p>
      <div class="gate-actions">
        <button class="gate-primary" id="gateLoadBtn">Load a saved project file</button>
        <button class="gate-secondary" id="gateContinueBtn">${isFirstRun?'Start a new project':'Continue with cached data'}</button>
      </div>
      <div class="gate-error" id="gateError"></div>
      <div class="gate-note">Use Save Data any time to export a fresh backup, and Load Data to bring one back in.</div>
    </div>`;
    const err=gate.querySelector('#gateError');
    const showErr=msg=>{ err.textContent=msg; err.style.display=msg?'block':'none'; };

    gate.querySelector('#gateLoadBtn').onclick=()=>{
      const picker=document.createElement('input');
      picker.type='file'; picker.accept='.zip';
      picker.onchange=async()=>{
        const f=picker.files && picker.files[0];
        if(!f) return;
        try{
          const {payload,images}=await parseZipBlob(f);
          if(!payload || !payload.snoos) throw new Error('This file does not look like an MSB SNOO backup.');
          await idbClearImages();
          for(const img of images) await idbSetImage(img.path,img.blob);
          await idbSetMeta(META_DATA_KEY,payload);
          resetBlobUrlCache();
          window.__msbSuppressDirty=true;
          applyDataset(payload);
          window.__msbSuppressDirty=false;
          await setIsSaved(true);
          if(typeof renderList==='function') renderList();
          if(typeof renderDetail==='function') renderDetail();
          hideStartupGate();
        }catch(e){
          console.error(e);
          showErr('Could not load that file: '+(e.message||'unknown error'));
        }
      };
      picker.click();
    };

    gate.querySelector('#gateContinueBtn').onclick=async()=>{
      if(isFirstRun){
        const blank=blankDataset();
        window.__msbSuppressDirty=true;
        applyDataset(blank);
        window.__msbSuppressDirty=false;
        await idbSetMeta(META_DATA_KEY,{version:3,savedAt:new Date().toISOString(),...blank});
        await setIsSaved(false); // nothing has ever been exported yet
      } else {
        window.__msbSuppressDirty=true;
        applyDataset(cachedPayload);
        window.__msbSuppressDirty=false;
      }
      if(typeof renderList==='function') renderList();
      if(typeof renderDetail==='function') renderDetail();
      hideStartupGate();
    };
  }

  async function startup(){
    // Show a blank shell instantly while we check storage.
    applyDataset(blankDataset());
    if(typeof renderList==='function') renderList();
    if(typeof renderDetail==='function') renderDetail();

    const projectData=await idbGetMeta(META_DATA_KEY);
    const savedFlag=await idbGetMeta(META_SAVED_KEY);
    isSavedFlag = savedFlag===true;
    updateSaveIndicator();

    if(projectData){
      if(savedFlag===true){
        showStartupGate('choice',projectData);
      } else {
        window.__msbSuppressDirty=true;
        applyDataset(projectData);
        window.__msbSuppressDirty=false;
        if(typeof renderList==='function') renderList();
        if(typeof renderDetail==='function') renderDetail();
      }
    } else {
      showStartupGate('first',null);
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',startup);
  } else {
    startup();
  }
})();
</script>

<script id="v36-header-title-minwidth">

  const observedRoot=document.querySelector('.content');
  if(observedRoot) new MutationObserver(()=>requestAnimationFrame(updateHeaderTitleMinWidth)).observe(observedRoot,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});

  requestAnimationFrame(updateHeaderTitleMinWidth);
})();

<script id="v46-calendar-frozen-swipe">
(function(){
  // ---- Fully self-contained calendar implementation. Replaces the v24
  // calendar entirely by overwriting the same window-level entry points
  // (openCalendar / calendarShift / calendarSetZoom / calendarGoToday) so
  // no other part of the app needs to change. ----

  let calendarZoom='6month';
  let calendarAnchor=new Date();
  let calAnimating=false, calDragging=false, calAxisLocked=null;
  let calStartX=0, calStartY=0, calDragDX=0;
  const CAL_SWIPE_THRESHOLD=150;   // px — deliberate swipe required
  const CAL_AXIS_LOCK_DEADZONE=8;  // px — ignore tiny jitters before deciding axis
  const CAL_SLIDE_VELOCITY=2200;

  function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
  function startOfMonth(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonthsDate(d,n){ return new Date(d.getFullYear(),d.getMonth()+n,1); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function fmtShort(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  function calShiftedAnchor(anchor,dir){
    const d=new Date(anchor);
    if(calendarZoom==='6month') d.setMonth(d.getMonth()+dir*6);
    else if(calendarZoom==='month') d.setMonth(d.getMonth()+dir*1);
    else d.setDate(d.getDate()+dir*7);
    return d;
  }
  function calSlideDuration(px){ return Math.min(.45,Math.max(.16,px/CAL_SLIDE_VELOCITY)); }

  function calendarComputeRange(anchor){
    anchor=anchor||calendarAnchor;
    if(calendarZoom==='6month'){
      const anchorMonth=startOfMonth(anchor);
      const rangeStart=addMonthsDate(anchorMonth,-2);
      const columns=[];
      for(let i=0;i<6;i++){
        const cs=addMonthsDate(rangeStart,i), ce=addMonthsDate(rangeStart,i+1);
        columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{month:'short',year:'2-digit'})});
      }
      return {rangeStart, rangeEnd:addMonthsDate(rangeStart,6), columns};
    }
    if(calendarZoom==='month'){
      const monthStart=startOfMonth(anchor);
      const monthEnd=addMonthsDate(monthStart,1);
      const rangeStart=startOfWeek(monthStart);
      const columns=[];
      let cursor=rangeStart;
      while(cursor<monthEnd){
        const ce=addDays(cursor,7);
        columns.push({start:cursor,end:ce,label:fmtShort(cursor)});
        cursor=ce;
      }
      return {rangeStart, rangeEnd:cursor, columns, title:monthStart.toLocaleDateString(undefined,{month:'long',year:'numeric'})};
    }
    const rangeStart=startOfWeek(anchor);
    const columns=[];
    for(let i=0;i<7;i++){
      const cs=addDays(rangeStart,i), ce=addDays(rangeStart,i+1);
      columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{weekday:'short'}),sublabel:String(cs.getDate())});
    }
    return {rangeStart, rangeEnd:addDays(rangeStart,7), columns};
  }
  function calendarRangeLabel(range){
    if(range.title) return range.title;
    const lastCol=range.columns[range.columns.length-1];
    const endDisplay=addDays(lastCol.end,-1);
    if(calendarZoom==='6month') return `${range.columns[0].start.toLocaleDateString(undefined,{month:'short',year:'numeric'})} – ${endDisplay.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`;
    return `${fmtShort(range.rangeStart)} – ${fmtShort(endDisplay)}`;
  }

  function calendarBuildHeaderHTML(anchor){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const headHtml=cols.map(c=>`<div class="cal-col-head">${c.sublabel?`<span class="cal-col-head-main">${esc(c.label)}</span><span class="cal-col-head-sub">${esc(c.sublabel)}</span>`:esc(c.label)}</div>`).join('');
    return {
      html:`<div class="cal-col-heads" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${headHtml}</div>`,
      label:calendarRangeLabel(range)
    };
  }

  function calendarBuildBodyHTML(anchor){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const totalSpanDays=(range.rangeEnd-range.rangeStart)/86400000;
    const labels=Object.values(snoos).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
    const now=new Date(); now.setHours(12,0,0,0);
    const todayPct=(now>=range.rangeStart && now<range.rangeEnd) ? (daysBetween(range.rangeStart,now)/totalSpanDays)*100 : null;
    const todayLine=todayPct!=null?`<div class="cal-today-line" style="left:${todayPct}%"></div>`:'';
    const palette=['bar-a','bar-b','bar-c','bar-d','bar-e','bar-f'];
    let colorCursor=0;
    const rows=labels.map(s=>{
      const rentals=[];
      if(s.rental) rentals.push(s.rental);
      (s.returns||[]).forEach(r=>rentals.push(r));
      let bars='';
      for(const r of rentals){
        const startRaw=r.start||r.checkoutDate, endRaw=r.end||r.expectedReturnDate||r.checkinDate||r.date;
        if(!startRaw) continue;
        const start=new Date(startRaw+'T00:00:00');
        const end=endRaw?new Date(endRaw+'T00:00:00'):addDays(start,1);
        if(end<=range.rangeStart || start>=range.rangeEnd) continue;
        const clampedStart=start<range.rangeStart?range.rangeStart:start;
        const clampedEnd=end>range.rangeEnd?range.rangeEnd:end;
        const leftPct=(daysBetween(range.rangeStart,clampedStart)/totalSpanDays)*100;
        const widthPct=(daysBetween(clampedStart,clampedEnd)/totalSpanDays)*100;
        const colorClass=palette[colorCursor%palette.length]; colorCursor++;
        const invoice=r.invoiceNumber?` <span class="cal-bar-invoice">${esc(r.invoiceNumber)}</span>`:'';
        const clipLeft=start<range.rangeStart, clipRight=end>range.rangeEnd;
        const clipClass=`${clipLeft?' cal-bar-clip-left':''}${clipRight?' cal-bar-clip-right':''}`;
        bars+=`<div class="cal-bar ${colorClass}${clipClass}" style="left:${leftPct}%;width:${widthPct}%" title="${esc(r.customer||'')}${r.invoiceNumber?' — '+esc(r.invoiceNumber):''}"><span class="cal-bar-customer">${esc(r.customer||'Customer')}</span>${invoice}</div>`;
      }
      return `<div class="cal-row-track">${bars}</div>`;
    }).join('');
    return `<div style="position:relative;--cal-cols:${cols.length}">${todayLine}${rows}</div>`;
  }

  function calendarBuildFrozenHTML(){
    const labels=Object.values(snoos).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
    return labels.map(s=>`<div class="cal-frozen-row-label">${esc(s.id)}</div>`).join('');
  }

  function calendarPaintPanes(){
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const bodyViewport=document.getElementById('calBodyViewport');
    if(!headerTrack||!bodyTrack||!bodyViewport) return;
    const roles=['prev','current','next'];
    const anchors={prev:calShiftedAnchor(calendarAnchor,-1), current:calendarAnchor, next:calShiftedAnchor(calendarAnchor,1)};
    let currentLabel='';
    roles.forEach(role=>{
      const hPane=headerTrack.querySelector(`[data-role="${role}"]`);
      const bPane=bodyTrack.querySelector(`[data-role="${role}"]`);
      const built=calendarBuildHeaderHTML(anchors[role]);
      if(hPane) hPane.innerHTML=built.html;
      if(bPane) bPane.innerHTML=calendarBuildBodyHTML(anchors[role]);
      if(role==='current') currentLabel=built.label;
    });
    const labelEl=document.getElementById('calendarRangeLabel');
    if(labelEl) labelEl.textContent=currentLabel;
    const frozen=document.getElementById('calFrozenInner');
    if(frozen) frozen.innerHTML=calendarBuildFrozenHTML();
    document.querySelectorAll('.calendar-zoom-btn').forEach(b=>b.classList.toggle('selected',b.dataset.zoom===calendarZoom));
    const vw=bodyViewport.offsetWidth;
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition='none'; t.style.transform=`translateX(${-vw}px)`; });
    bodyViewport.scrollTop=0;
    if(frozen) frozen.style.transform='translateY(0px)';
  }

  function calendarSyncFrozenScroll(){
    const bodyViewport=document.getElementById('calBodyViewport');
    const frozen=document.getElementById('calFrozenInner');
    if(!bodyViewport||!frozen) return;
    frozen.style.transform=`translateY(${-bodyViewport.scrollTop}px)`;
  }

  window.calendarShift=function(dir){
    if(calAnimating) return;
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const bodyViewport=document.getElementById('calBodyViewport');
    if(!headerTrack||!bodyTrack||!bodyViewport) return;
    calAnimating=true;
    const vw=bodyViewport.offsetWidth;
    const target=dir<0?0:-2*vw;
    const dur=calSlideDuration(vw);
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${target}px)`; });
    let done=false;
    const finish=()=>{
      if(done) return; done=true;
      bodyTrack.removeEventListener('transitionend',finish);
      calendarAnchor=calShiftedAnchor(calendarAnchor,dir);
      calendarPaintPanes();
      calAnimating=false;
    };
    bodyTrack.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,Math.round(dur*1000)+80);
  };
  window.calendarSetZoom=function(zoom){
    if(zoom===calendarZoom) return;
    calendarZoom=zoom;
    calendarPaintPanes();
  };
  window.calendarGoToday=function(){ calendarAnchor=new Date(); calendarPaintPanes(); };

  window.openCalendar=function(){
    calendarZoom='6month';
    calendarAnchor=new Date();
    openModal('Rental Calendar',`<div class="calendar-wrap">
      <div class="calendar-toolbar">
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(-1)" aria-label="Previous">‹</button>
        <div class="calendar-toolbar-center">
          <div class="calendar-range-label" id="calendarRangeLabel"></div>
          <div class="calendar-zoom-group" role="group" aria-label="Zoom level">
            <button type="button" class="calendar-zoom-btn" data-zoom="6month" onclick="calendarSetZoom('6month')">6 mo</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="month" onclick="calendarSetZoom('month')">Month</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="week" onclick="calendarSetZoom('week')">Week</button>
          </div>
        </div>
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(1)" aria-label="Next">›</button>
      </div>
      <button type="button" class="secondary calendar-today-btn" onclick="calendarGoToday()">Today</button>
      <div class="cal-grid">
        <div class="cal-head-row">
          <div class="cal-corner"></div>
          <div class="cal-header-viewport" id="calHeaderViewport">
            <div class="cal-header-track" id="calHeaderTrack">
              <div class="cal-header-pane" data-role="prev"></div>
              <div class="cal-header-pane" data-role="current"></div>
              <div class="cal-header-pane" data-role="next"></div>
            </div>
          </div>
        </div>
        <div class="cal-body-row">
          <div class="cal-frozen-col"><div class="cal-frozen-inner" id="calFrozenInner"></div></div>
          <div class="cal-body-viewport" id="calBodyViewport">
            <div class="cal-body-track" id="calBodyTrack">
              <div class="cal-body-pane" data-role="prev"></div>
              <div class="cal-body-pane" data-role="current"></div>
              <div class="cal-body-pane" data-role="next"></div>
            </div>
          </div>
        </div>
      </div>
    </div>`);
    hideModalSave();
    calendarPaintPanes();
    calendarWireSwipe();
    calendarWireVerticalSync();
  };

  function calendarWireVerticalSync(){
    const bodyViewport=document.getElementById('calBodyViewport');
    if(!bodyViewport||bodyViewport.dataset.syncBound) return;
    bodyViewport.dataset.syncBound='1';
    bodyViewport.addEventListener('scroll',calendarSyncFrozenScroll,{passive:true});
  }

  function calendarWireSwipe(){
    const viewport=document.getElementById('calBodyViewport');
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    if(!viewport||!headerTrack||!bodyTrack||viewport.dataset.swipeBound) return;
    viewport.dataset.swipeBound='1';

    viewport.addEventListener('touchstart',e=>{
      if(calAnimating) return;
      calDragging=true; calAxisLocked=null;
      calStartX=e.touches[0].clientX; calStartY=e.touches[0].clientY; calDragDX=0;
    },{passive:true});

    viewport.addEventListener('touchmove',e=>{
      if(!calDragging) return;
      const dx=e.touches[0].clientX-calStartX;
      const dy=e.touches[0].clientY-calStartY;
      if(!calAxisLocked){
        if(Math.abs(dx)>CAL_AXIS_LOCK_DEADZONE || Math.abs(dy)>CAL_AXIS_LOCK_DEADZONE){
          calAxisLocked=Math.abs(dx)>Math.abs(dy)?'x':'y';
        } else {
          return;
        }
      }
      if(calAxisLocked!=='x') return; // vertical gesture — let native scrolling happen, don't touch transform
      e.preventDefault();
      calDragDX=dx;
      const vw=viewport.offsetWidth;
      const tx=`translateX(${-vw+calDragDX}px)`;
      headerTrack.style.transition='none'; headerTrack.style.transform=tx;
      bodyTrack.style.transition='none'; bodyTrack.style.transform=tx;
    },{passive:false});

    viewport.addEventListener('touchend',()=>{
      if(!calDragging) return;
      calDragging=false;
      const wasHorizontal=calAxisLocked==='x';
      calAxisLocked=null;
      if(!wasHorizontal) return; // it was a vertical scroll gesture — nothing more to do
      const vw=viewport.offsetWidth;
      if(calDragDX < -CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-2*vw}px)`; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else if(calDragDX > CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform='translateX(0px)'; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,-1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else {
        // Not a deliberate enough swipe — snap back to center exactly.
        const dur=calSlideDuration(Math.max(Math.abs(calDragDX),1));
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-vw}px)`; });
      }
    });
  }

  window.addEventListener('resize',()=>{
    if(document.getElementById('calBodyViewport') && !calAnimating && !calDragging) calendarPaintPanes();
  });
})();
</script>

<script id="v47-calendar-alignment-fix">
(function(){
  // Fully supersedes v46's calendar wiring (same window.* entry points),
  // fixing row-height alignment, the disappearing-grid scroll bug, the
  // vertical bounce, and lowering the swipe threshold to 100px.

  let calendarZoom='6month';
  let calendarAnchor=new Date();
  let calAnimating=false, calDragging=false, calAxisLocked=null;
  let calStartX=0, calStartY=0, calDragDX=0;
  const CAL_SWIPE_THRESHOLD=100;   // px
  const CAL_AXIS_LOCK_DEADZONE=8;  // px
  const CAL_SLIDE_VELOCITY=2200;
  const CAL_ROW_H=60;              // shared row height — SNOO labels & grid rows

  function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
  function startOfMonth(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonthsDate(d,n){ return new Date(d.getFullYear(),d.getMonth()+n,1); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function fmtShort(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  function calShiftedAnchor(anchor,dir){
    const d=new Date(anchor);
    if(calendarZoom==='6month') d.setMonth(d.getMonth()+dir*6);
    else if(calendarZoom==='month') d.setMonth(d.getMonth()+dir*1);
    else d.setDate(d.getDate()+dir*7);
    return d;
  }
  function calSlideDuration(px){ return Math.min(.45,Math.max(.16,px/CAL_SLIDE_VELOCITY)); }

  function calendarComputeRange(anchor){
    anchor=anchor||calendarAnchor;
    if(calendarZoom==='6month'){
      const anchorMonth=startOfMonth(anchor);
      const rangeStart=addMonthsDate(anchorMonth,-2);
      const columns=[];
      for(let i=0;i<6;i++){
        const cs=addMonthsDate(rangeStart,i), ce=addMonthsDate(rangeStart,i+1);
        columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{month:'short',year:'2-digit'})});
      }
      return {rangeStart, rangeEnd:addMonthsDate(rangeStart,6), columns};
    }
    if(calendarZoom==='month'){
      const monthStart=startOfMonth(anchor);
      const monthEnd=addMonthsDate(monthStart,1);
      const rangeStart=startOfWeek(monthStart);
      const columns=[];
      let cursor=rangeStart;
      while(cursor<monthEnd){
        const ce=addDays(cursor,7);
        columns.push({start:cursor,end:ce,label:fmtShort(cursor)});
        cursor=ce;
      }
      return {rangeStart, rangeEnd:cursor, columns, title:monthStart.toLocaleDateString(undefined,{month:'long',year:'numeric'})};
    }
    const rangeStart=startOfWeek(anchor);
    const columns=[];
    for(let i=0;i<7;i++){
      const cs=addDays(rangeStart,i), ce=addDays(rangeStart,i+1);
      columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{weekday:'short'}),sublabel:String(cs.getDate())});
    }
    return {rangeStart, rangeEnd:addDays(rangeStart,7), columns};
  }
  function calendarRangeLabel(range){
    if(range.title) return range.title;
    const lastCol=range.columns[range.columns.length-1];
    const endDisplay=addDays(lastCol.end,-1);
    if(calendarZoom==='6month') return `${range.columns[0].start.toLocaleDateString(undefined,{month:'short',year:'numeric'})} – ${endDisplay.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`;
    return `${fmtShort(range.rangeStart)} – ${fmtShort(endDisplay)}`;
  }

  function calendarBuildHeaderHTML(anchor){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const headHtml=cols.map(c=>`<div class="cal-col-head">${c.sublabel?`<span class="cal-col-head-main">${esc(c.label)}</span><span class="cal-col-head-sub">${esc(c.sublabel)}</span>`:esc(c.label)}</div>`).join('');
    return {
      html:`<div class="cal-col-heads" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${headHtml}</div>`,
      label:calendarRangeLabel(range)
    };
  }

  function calendarSortedSnoos(){
    return Object.values(snoos).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  }

  function calendarBuildBodyHTML(anchor,labels){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const totalSpanDays=(range.rangeEnd-range.rangeStart)/86400000;
    const now=new Date(); now.setHours(12,0,0,0);
    const todayPct=(now>=range.rangeStart && now<range.rangeEnd) ? (daysBetween(range.rangeStart,now)/totalSpanDays)*100 : null;
    const todayLine=todayPct!=null?`<div class="cal-today-line" style="left:${todayPct}%;top:0;bottom:0"></div>`:'';
    const palette=['bar-a','bar-b','bar-c','bar-d','bar-e','bar-f'];
    let colorCursor=0;
    const rowsHtml=labels.map(s=>{
      const rentals=[];
      if(s.rental) rentals.push(s.rental);
      (s.returns||[]).forEach(r=>rentals.push(r));
      let bars='';
      for(const r of rentals){
        const startRaw=r.start||r.checkoutDate, endRaw=r.end||r.expectedReturnDate||r.checkinDate||r.date;
        if(!startRaw) continue;
        const start=new Date(startRaw+'T00:00:00');
        const end=endRaw?new Date(endRaw+'T00:00:00'):addDays(start,1);
        if(end<=range.rangeStart || start>=range.rangeEnd) continue;
        const clampedStart=start<range.rangeStart?range.rangeStart:start;
        const clampedEnd=end>range.rangeEnd?range.rangeEnd:end;
        const leftPct=(daysBetween(range.rangeStart,clampedStart)/totalSpanDays)*100;
        const widthPct=(daysBetween(clampedStart,clampedEnd)/totalSpanDays)*100;
        const colorClass=palette[colorCursor%palette.length]; colorCursor++;
        const invoice=r.invoiceNumber?` <span class="cal-bar-invoice">${esc(r.invoiceNumber)}</span>`:'';
        const clipLeft=start<range.rangeStart, clipRight=end>range.rangeEnd;
        const clipClass=`${clipLeft?' cal-bar-clip-left':''}${clipRight?' cal-bar-clip-right':''}`;
        bars+=`<div class="cal-bar ${colorClass}${clipClass}" style="left:${leftPct}%;width:${widthPct}%" title="${esc(r.customer||'')}${r.invoiceNumber?' — '+esc(r.invoiceNumber):''}"><span class="cal-bar-customer">${esc(r.customer||'Customer')}</span>${invoice}</div>`;
      }
      return `<div class="cal-row-track" style="height:${CAL_ROW_H}px">${bars}</div>`;
    }).join('');
    const totalHeight=labels.length*CAL_ROW_H;
    return `<div style="position:relative;--cal-cols:${cols.length};height:${totalHeight}px">${todayLine}${rowsHtml}</div>`;
  }

  function calendarBuildFrozenHTML(labels){
    return labels.map(s=>`<div class="cal-frozen-row-label" style="height:${CAL_ROW_H}px">${esc(s.id)}</div>`).join('');
  }

  function calendarPaintPanes(){
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const bodyViewport=document.getElementById('calBodyViewport');
    const trackViewport=document.getElementById('calTrackViewport');
    const frozenCol=document.getElementById('calFrozenCol');
    if(!headerTrack||!bodyTrack||!bodyViewport||!trackViewport) return;
    const labels=calendarSortedSnoos();
    const roles=['prev','current','next'];
    const anchors={prev:calShiftedAnchor(calendarAnchor,-1), current:calendarAnchor, next:calShiftedAnchor(calendarAnchor,1)};
    let currentLabel='';
    roles.forEach(role=>{
      const hPane=headerTrack.querySelector(`[data-role="${role}"]`);
      const bPane=bodyTrack.querySelector(`[data-role="${role}"]`);
      const built=calendarBuildHeaderHTML(anchors[role]);
      if(hPane) hPane.innerHTML=built.html;
      if(bPane) bPane.innerHTML=calendarBuildBodyHTML(anchors[role],labels);
      if(role==='current') currentLabel=built.label;
    });
    const labelEl=document.getElementById('calendarRangeLabel');
    if(labelEl) labelEl.textContent=currentLabel;
    if(frozenCol) frozenCol.innerHTML=calendarBuildFrozenHTML(labels);
    document.querySelectorAll('.calendar-zoom-btn').forEach(b=>b.classList.toggle('selected',b.dataset.zoom===calendarZoom));
    const vw=trackViewport.offsetWidth;
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition='none'; t.style.transform=`translateX(${-vw}px)`; });
    bodyViewport.scrollTop=0;
  }

  window.calendarShift=function(dir){
    if(calAnimating) return;
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const trackViewport=document.getElementById('calTrackViewport');
    if(!headerTrack||!bodyTrack||!trackViewport) return;
    calAnimating=true;
    const vw=trackViewport.offsetWidth;
    const target=dir<0?0:-2*vw;
    const dur=calSlideDuration(vw);
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${target}px)`; });
    let done=false;
    const finish=()=>{
      if(done) return; done=true;
      bodyTrack.removeEventListener('transitionend',finish);
      calendarAnchor=calShiftedAnchor(calendarAnchor,dir);
      calendarPaintPanes();
      calAnimating=false;
    };
    bodyTrack.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,Math.round(dur*1000)+80);
  };
  window.calendarSetZoom=function(zoom){
    if(zoom===calendarZoom) return;
    calendarZoom=zoom;
    calendarPaintPanes();
  };
  window.calendarGoToday=function(){ calendarAnchor=new Date(); calendarPaintPanes(); };

  window.openCalendar=function(){
    calendarZoom='6month';
    calendarAnchor=new Date();
    openModal('Rental Calendar',`<div class="calendar-wrap">
      <div class="calendar-toolbar">
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(-1)" aria-label="Previous">‹</button>
        <div class="calendar-toolbar-center">
          <div class="calendar-range-label" id="calendarRangeLabel"></div>
          <div class="calendar-zoom-group" role="group" aria-label="Zoom level">
            <button type="button" class="calendar-zoom-btn" data-zoom="6month" onclick="calendarSetZoom('6month')">6 mo</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="month" onclick="calendarSetZoom('month')">Month</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="week" onclick="calendarSetZoom('week')">Week</button>
          </div>
        </div>
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(1)" aria-label="Next">›</button>
      </div>
      <button type="button" class="secondary calendar-today-btn" onclick="calendarGoToday()">Today</button>
      <div class="cal-grid">
        <div class="cal-head-row">
          <div class="cal-corner"></div>
          <div class="cal-header-viewport" id="calHeaderViewport">
            <div class="cal-header-track" id="calHeaderTrack">
              <div class="cal-header-pane" data-role="prev"></div>
              <div class="cal-header-pane" data-role="current"></div>
              <div class="cal-header-pane" data-role="next"></div>
            </div>
          </div>
        </div>
        <div class="cal-body-viewport" id="calBodyViewport">
          <div class="cal-body-scroll-inner">
            <div class="cal-frozen-col" id="calFrozenCol"></div>
            <div class="cal-track-viewport" id="calTrackViewport">
              <div class="cal-body-track" id="calBodyTrack">
                <div class="cal-body-pane" data-role="prev"></div>
                <div class="cal-body-pane" data-role="current"></div>
                <div class="cal-body-pane" data-role="next"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`);
    hideModalSave();
    calendarPaintPanes();
    calendarWireSwipe();
  };

  function calendarWireSwipe(){
    const scrollHost=document.getElementById('calBodyViewport');
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const trackViewport=document.getElementById('calTrackViewport');
    if(!scrollHost||!headerTrack||!bodyTrack||!trackViewport||scrollHost.dataset.swipeBound) return;
    scrollHost.dataset.swipeBound='1';

    scrollHost.addEventListener('touchstart',e=>{
      if(calAnimating) return;
      calDragging=true; calAxisLocked=null;
      calStartX=e.touches[0].clientX; calStartY=e.touches[0].clientY; calDragDX=0;
    },{passive:true});

    scrollHost.addEventListener('touchmove',e=>{
      if(!calDragging) return;
      const dx=e.touches[0].clientX-calStartX;
      const dy=e.touches[0].clientY-calStartY;
      if(!calAxisLocked){
        if(Math.abs(dx)>CAL_AXIS_LOCK_DEADZONE || Math.abs(dy)>CAL_AXIS_LOCK_DEADZONE){
          calAxisLocked=Math.abs(dx)>Math.abs(dy)?'x':'y';
        } else {
          return;
        }
      }
      if(calAxisLocked!=='x') return; // vertical gesture — native scroll handles it, we do nothing
      e.preventDefault();
      calDragDX=dx;
      const vw=trackViewport.offsetWidth;
      const tx=`translateX(${-vw+calDragDX}px)`;
      headerTrack.style.transition='none'; headerTrack.style.transform=tx;
      bodyTrack.style.transition='none'; bodyTrack.style.transform=tx;
    },{passive:false});

    scrollHost.addEventListener('touchend',()=>{
      if(!calDragging) return;
      calDragging=false;
      const wasHorizontal=calAxisLocked==='x';
      calAxisLocked=null;
      if(!wasHorizontal) return;
      const vw=trackViewport.offsetWidth;
      if(calDragDX < -CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-2*vw}px)`; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else if(calDragDX > CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform='translateX(0px)'; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,-1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else {
        const dur=calSlideDuration(Math.max(Math.abs(calDragDX),1));
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-vw}px)`; });
      }
    });
  }

  window.addEventListener('resize',()=>{
    if(document.getElementById('calTrackViewport') && !calAnimating && !calDragging) calendarPaintPanes();
  });
})();
</script>

    const key=String(r.id||r.rentalId||[r.customer||'',r.start||r.checkoutDate||''].join('|'));
    let h=0;
    for(let i=0;i<key.length;i++){ h=(h*31+key.charCodeAt(i))|0; }
    return palette[Math.abs(h)%palette.length];
  }

  function calendarBuildBodyHTML(anchor,labels){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const totalSpanDays=(range.rangeEnd-range.rangeStart)/86400000;
    const now=new Date(); now.setHours(12,0,0,0);
    const todayPct=(now>=range.rangeStart && now<range.rangeEnd) ? (daysBetween(range.rangeStart,now)/totalSpanDays)*100 : null;
    const todayLine=todayPct!=null?`<div class="cal-today-line" style="left:${todayPct}%;top:0;bottom:0"></div>`:'';
    const palette=['bar-a','bar-b','bar-c','bar-d','bar-e','bar-f'];
    const rowsHtml=labels.map(s=>{
      const rentals=[];
      if(s.rental) rentals.push(s.rental);
      (s.returns||[]).forEach(r=>rentals.push(r));
      let bars='';
      for(const r of rentals){
        const startRaw=r.start||r.checkoutDate, endRaw=r.end||r.expectedReturnDate||r.checkinDate||r.date;
        if(!startRaw) continue;
        const start=new Date(startRaw+'T00:00:00');
        const end=endRaw?new Date(endRaw+'T00:00:00'):addDays(start,1);
        if(end<=range.rangeStart || start>=range.rangeEnd) continue;
        const clampedStart=start<range.rangeStart?range.rangeStart:start;
        const clampedEnd=end>range.rangeEnd?range.rangeEnd:end;
        const leftPct=(daysBetween(range.rangeStart,clampedStart)/totalSpanDays)*100;
        const widthPct=(daysBetween(clampedStart,clampedEnd)/totalSpanDays)*100;
        const colorClass=calBarColorClass(r,palette);
        const invoice=r.invoiceNumber?` <span class="cal-bar-invoice">${esc(r.invoiceNumber)}</span>`:'';
        const clipLeft=start<range.rangeStart, clipRight=end>range.rangeEnd;
        const clipClass=`${clipLeft?' cal-bar-clip-left':''}${clipRight?' cal-bar-clip-right':''}`;
        bars+=`<div class="cal-bar ${colorClass}${clipClass}" style="left:${leftPct}%;width:${widthPct}%" title="${esc(r.customer||'')}${r.invoiceNumber?' — '+esc(r.invoiceNumber):''}"><span class="cal-bar-customer">${esc(r.customer||'Customer')}</span>${invoice}</div>`;
      }
      return `<div class="cal-row-track" style="height:${CAL_ROW_H}px">${bars}</div>`;
    }).join('');
    const totalHeight=labels.length*CAL_ROW_H;
    return `<div style="position:relative;--cal-cols:${cols.length};height:${totalHeight}px">${todayLine}${rowsHtml}</div>`;
  }


  function calendarBuildFrozenHTML(labels){
    return labels.map(s=>`<div class="cal-frozen-row-label" style="height:${CAL_ROW_H}px">${esc(s.id)}</div>`).join('');
  }

  function calSetPeekHide(direction){
    // direction is the role ('next' or 'prev') of the pane currently being
    // revealed by a drag or an in-flight transition. Only that pane's bar
    // labels are hidden; the pane the user is moving away from keeps
    // showing its customer/invoice text until the swipe completes.
    const bodyTrack=document.getElementById('calBodyTrack');
    if(!bodyTrack) return;
    bodyTrack.querySelectorAll('.cal-body-pane').forEach(p=>p.classList.remove('cal-pane-peek-hide'));
    if(direction){
      const target=bodyTrack.querySelector(`[data-role="${direction}"]`);
      if(target) target.classList.add('cal-pane-peek-hide');
    }
  }

  function calendarPaintPanes(){
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const bodyViewport=document.getElementById('calBodyViewport');
    const trackViewport=document.getElementById('calTrackViewport');
    const frozenCol=document.getElementById('calFrozenCol');
    if(!headerTrack||!bodyTrack||!bodyViewport||!trackViewport) return;
    const labels=calendarSortedSnoos();
    const roles=['prev','current','next'];
    const anchors={prev:calShiftedAnchor(calendarAnchor,-1), current:calendarAnchor, next:calShiftedAnchor(calendarAnchor,1)};
    let currentLabel='';
    roles.forEach(role=>{
      const hPane=headerTrack.querySelector(`[data-role="${role}"]`);
      const bPane=bodyTrack.querySelector(`[data-role="${role}"]`);
      const built=calendarBuildHeaderHTML(anchors[role]);
      if(hPane) hPane.innerHTML=built.html;
      if(bPane) bPane.innerHTML=calendarBuildBodyHTML(anchors[role],labels);
      if(role==='current') currentLabel=built.label;
    });
    const labelEl=document.getElementById('calendarRangeLabel');
    if(labelEl) labelEl.textContent=currentLabel;
    if(frozenCol) frozenCol.innerHTML=calendarBuildFrozenHTML(labels);
    document.querySelectorAll('.calendar-zoom-btn').forEach(b=>b.classList.toggle('selected',b.dataset.zoom===calendarZoom));
    calSetPeekHide(null);
    const vw=trackViewport.offsetWidth;
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition='none'; t.style.transform=`translateX(${-vw}px)`; });
    bodyViewport.scrollTop=0;
  }

  window.calendarShift=function(dir){
    if(calAnimating) return;
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const trackViewport=document.getElementById('calTrackViewport');
    if(!headerTrack||!bodyTrack||!trackViewport) return;
    calAnimating=true;
    calSetPeekHide(dir<0?'prev':'next');
    const vw=trackViewport.offsetWidth;
    const target=dir<0?0:-2*vw;
    const dur=calSlideDuration(vw);
    [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${target}px)`; });
    let done=false;
    const finish=()=>{
      if(done) return; done=true;
      bodyTrack.removeEventListener('transitionend',finish);
      calendarAnchor=calShiftedAnchor(calendarAnchor,dir);
      calendarPaintPanes();
      calAnimating=false;
    };
    bodyTrack.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,Math.round(dur*1000)+80);
  };
  window.calendarSetZoom=function(zoom){
    if(zoom===calendarZoom) return;
    calendarZoom=zoom;
    calendarPaintPanes();
  };
  window.calendarGoToday=function(){ calendarAnchor=new Date(); calendarPaintPanes(); };

  window.openCalendar=function(){
    calendarZoom='6month';
    calendarAnchor=new Date();
    openModal('Rental Calendar',`<div class="calendar-wrap">
      <div class="calendar-toolbar">
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(-1)" aria-label="Previous">‹</button>
        <div class="calendar-toolbar-center">
          <div class="calendar-range-label" id="calendarRangeLabel"></div>
          <div class="calendar-zoom-group" role="group" aria-label="Zoom level">
            <button type="button" class="calendar-zoom-btn" data-zoom="6month" onclick="calendarSetZoom('6month')">6 mo</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="month" onclick="calendarSetZoom('month')">Month</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="week" onclick="calendarSetZoom('week')">Week</button>
          </div>
        </div>
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(1)" aria-label="Next">›</button>
      </div>
      <button type="button" class="secondary calendar-today-btn" onclick="calendarGoToday()">Today</button>
      <div class="cal-grid">
        <div class="cal-head-row">
          <div class="cal-corner"></div>
          <div class="cal-header-viewport" id="calHeaderViewport">
            <div class="cal-header-track" id="calHeaderTrack">
              <div class="cal-header-pane" data-role="prev"></div>
              <div class="cal-header-pane" data-role="current"></div>
              <div class="cal-header-pane" data-role="next"></div>
            </div>
          </div>
        </div>
        <div class="cal-body-viewport" id="calBodyViewport">
          <div class="cal-body-scroll-inner">
            <div class="cal-frozen-col" id="calFrozenCol"></div>
            <div class="cal-track-viewport" id="calTrackViewport">
              <div class="cal-body-track" id="calBodyTrack">
                <div class="cal-body-pane" data-role="prev"></div>
                <div class="cal-body-pane" data-role="current"></div>
                <div class="cal-body-pane" data-role="next"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`);
    hideModalSave();
    calendarPaintPanes();
    calendarWireSwipe();
  };

  function calendarWireSwipe(){
    const scrollHost=document.getElementById('calBodyViewport');
    const headerTrack=document.getElementById('calHeaderTrack');
    const bodyTrack=document.getElementById('calBodyTrack');
    const trackViewport=document.getElementById('calTrackViewport');
    if(!scrollHost||!headerTrack||!bodyTrack||!trackViewport||scrollHost.dataset.swipeBound) return;
    scrollHost.dataset.swipeBound='1';

    scrollHost.addEventListener('touchstart',e=>{
      if(calAnimating) return;
      calDragging=true; calAxisLocked=null;
      calStartX=e.touches[0].clientX; calStartY=e.touches[0].clientY; calDragDX=0;
    },{passive:true});

    scrollHost.addEventListener('touchmove',e=>{
      if(!calDragging) return;
      const dx=e.touches[0].clientX-calStartX;
      const dy=e.touches[0].clientY-calStartY;
      if(!calAxisLocked){
        if(Math.abs(dx)>CAL_AXIS_LOCK_DEADZONE || Math.abs(dy)>CAL_AXIS_LOCK_DEADZONE){
          calAxisLocked=Math.abs(dx)>Math.abs(dy)?'x':'y';
        } else {
          return;
        }
      }
      if(calAxisLocked!=='x') return;
      e.preventDefault();
      calDragDX=dx;
      calSetPeekHide(calDragDX<0?'next':calDragDX>0?'prev':null);
      const vw=trackViewport.offsetWidth;
      const tx=`translateX(${-vw+calDragDX}px)`;
      headerTrack.style.transition='none'; headerTrack.style.transform=tx;
      bodyTrack.style.transition='none'; bodyTrack.style.transform=tx;
    },{passive:false});

    scrollHost.addEventListener('touchend',()=>{
      if(!calDragging) return;
      calDragging=false;
      const wasHorizontal=calAxisLocked==='x';
      calAxisLocked=null;
      if(!wasHorizontal) return;
      const vw=trackViewport.offsetWidth;
      if(calDragDX < -CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-2*vw}px)`; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else if(calDragDX > CAL_SWIPE_THRESHOLD){
        calAnimating=true;
        const dur=calSlideDuration(vw);
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform='translateX(0px)'; });
        let done=false;
        const finish=()=>{ if(done)return; done=true; bodyTrack.removeEventListener('transitionend',finish); calendarAnchor=calShiftedAnchor(calendarAnchor,-1); calendarPaintPanes(); calAnimating=false; };
        bodyTrack.addEventListener('transitionend',finish,{once:true});
        setTimeout(finish,Math.round(dur*1000)+80);
      } else {
        calSetPeekHide(null);
        const dur=calSlideDuration(Math.max(Math.abs(calDragDX),1));
        [headerTrack,bodyTrack].forEach(t=>{ t.style.transition=`transform ${dur}s ease-out`; t.style.transform=`translateX(${-vw}px)`; });
      }
    });
  }

  window.addEventListener('resize',()=>{
    if(document.getElementById('calTrackViewport') && !calAnimating && !calDragging) calendarPaintPanes();
  });
})();
</script>

<style id="v53-desktop-full-height-fix">
/* v53: On wider (desktop) screens, several bottom paddings that exist purely
   to clear mobile browser chrome / iOS safe-area / home-indicator (the
   90px reserve on .detail-lower-panel, the 30px on .content, and the 60px
   on main) were also being applied on desktop, where none of that is
   needed. That stacked up to ~180px of dead, non-scrolling blank space
   below the last rental/maintenance/service card, well short of the
   actual bottom of the browser window. Mobile keeps its original spacing;
   on desktop these are trimmed back so #tabContent (and the DSC service
   history list) can actually extend from the bottom of the tab bar all
   the way down to the bottom of main. */
@media (min-width: 761px) {
  main { padding-bottom: 16px; }
  .content { padding-bottom: 0; }
  #detail .detail-lower-panel { padding-bottom: 0 !important; }
  #detail .detail-lower-panel > #tabContent { padding-bottom: 16px !important; }
  #detail .detail-lower-panel > .dsc-history > .section-body { padding-bottom: 16px !important; }
}
</style>

<style id="v54-compact-short-screen-header">
/* v54: Compact mode for short/landscape displays (e.g. a 2011 MacBook Air
   at 1366x768, or any browser window under ~700px tall). The title, action
   buttons, and status banner normally stack into two separate rows inside
   .detail-top-panel, which can eat half the screen on a short display.
   Below the height threshold, they collapse into a single row: a smaller
   title, compact buttons, and the status banner sharing the same line
   (wrapping only if the window is also narrow). This also neutralizes the
   old hard-coded 92px minimum height (from both the base CSS and the
   status-safe-minimum script) so the panel can actually shrink to fit.
*/
@media (max-height: 700px) {
  #detail .detail-top-panel {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    gap: 6px 14px !important;
    padding: 8px 0 !important;
    min-height: 0 !important;
  }
  #detail .detail-top-panel > .title-row {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 10px !important;
    margin-bottom: 0 !important;
    flex: 1 1 auto !important;
    min-width: 0 !important;
  }
  #detail .detail-top-panel > .title-row > div:first-child {
    flex: 0 0 auto !important;
  }
  #detail .detail-top-panel h2 {
    font-size: 16px !important;
    line-height: 1.15 !important;
  }
  #detail .detail-top-panel .snoo-serial {
    font-size: 10px !important;
    margin-top: 0 !important;
  }
  #detail .detail-top-panel .header-spacer-row {
    display: none !important;
  }
  #detail .detail-top-panel > .title-row > .action-row {
    display: flex !important;
    flex: 0 0 auto !important;
    width: auto !important;
    gap: 5px !important;
  }
  #detail .detail-top-panel .action-row button {
    padding: 6px 9px !important;
    font-size: 11px !important;
    white-space: nowrap !important;
  }
  #detail .detail-top-panel > .status-banner {
    order: 3 !important;
    flex: 1 1 220px !important;
    min-width: 160px !important;
    margin: 0 !important;
    padding: 6px 10px !important;
    font-size: 11.5px !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
  }
  #detail .detail-top-panel .status-dot {
    width: 8px !important;
    height: 8px !important;
    margin-right: 5px !important;
  }
  #detail .panel-resizer {
    height: 14px !important;
    min-height: 14px !important;
    flex: 0 0 14px !important;
  }
}
</style>
