<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSB SNOO Inventory</title>
<style>
  :root {
    --plum: #56324d;
    --plum-dark: #3f2539;
    --plum-light: #efe7ed;
    --bg: #f5f4f2;
    --panel: #ffffff;
    --text: #29272a;
    --muted: #777177;
    --border: #ddd8dc;
    --green: #39745a;
    --green-bg: #e8f3ed;
    --red: #a43e45;
    --red-bg: #fae9ea;
    --amber: #936c1f;
    --amber-bg: #faf2dc;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; tap-highlight-color: transparent; }
  html, body { width: 100%; max-width: 100%; -webkit-tap-highlight-color: transparent; }
  button, a, input, textarea, select, label, .snoo, .option, .tab, .photo-button, .status-banner, .history-item {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  button:focus, .snoo:focus, .option:focus, .tab:focus, .photo-button:focus, .status-banner:focus, .history-item:focus {
    outline: none;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    height: 68px;
    background: var(--plum);
    color: white;
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 14px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 21px;
    margin: 0;
    font-weight: 700;
  }

  header .subtitle {
    opacity: .75;
    font-size: 13px;
  }

  .settings {
    margin-left: auto;
    border: 1px solid rgba(255,255,255,.35);
    background: transparent;
    color: white;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .workspace {
    flex: 1 1 auto;
    min-height: 0;
    height: calc(100vh - 68px);
    display: grid;
    grid-template-columns: 1fr;
  }

  .inventory {
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: none;
    flex-direction: column;
    min-height: 0;
  }

  .inventory-top {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .inventory-top strong { font-size: 15px; }
  .inventory-top small {
    display: block;
    color: var(--muted);
    margin-top: 3px;
  }

  .snoo-list {
    overflow-y: auto;
    padding: 8px;
  }

  .snoo {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    text-align: left;
    border-radius: 9px;
    padding: 12px 13px;
    margin-bottom: 5px;
    cursor: pointer;
    color: var(--text);
  }

  .snoo:hover { background: #f7f4f6; }
  .snoo.active {
    background: var(--plum-light);
    border-color: #d8c6d3;
  }

  .snoo-id {
    font-size: 17px;
    font-weight: 750;
  }

  .snoo-status {
    font-size: 12px;
    margin-top: 5px;
    color: var(--muted);
  }

  .status-rented { color: var(--plum); font-weight: 650; }
  .status-clean { color: var(--green); }
  .status-attention { color: var(--red); font-weight: 650; }

  main {
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    height: 100%;
    padding: 14px 14px 60px;
    -webkit-overflow-scrolling: touch;
  }

  .content {
    padding-bottom: 30px;
  }

  .content {
    max-width: 1050px;
    margin: 0 auto;
  }

  .snoo-picker {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    background: white;
    color: var(--plum-dark);
    border-radius: 8px;
    padding: 8px 11px;
    cursor: pointer;
    font-weight: 700;
  }

  .snoo-picker::before { content: "☰"; font-size: 15px; }

  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  h2 {
    margin: 0;
    font-size: 28px;
  }

  .availability {
    margin-top: 7px;
    color: var(--green);
    font-weight: 700;
  }

  .availability.rented { color: var(--plum); }

  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button {
    font: inherit;
  }

  .primary, .secondary, .danger {
    border-radius: 7px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 650;
  }

  .primary {
    color: white;
    background: var(--plum);
    border: 1px solid var(--plum);
  }

  .secondary {
    background: white;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .danger {
    color: var(--red);
    background: white;
    border: 1px solid #e2bfc2;
  }

  .summary {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 22px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 15px;
  }

  .card-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 7px;
  }

  .card-value {
    font-weight: 700;
    line-height: 1.35;
  }

  .attention {
    border: 1px solid #e5bfc2;
    background: var(--red-bg);
    color: #7d2e34;
    border-radius: 9px;
    padding: 13px 15px;
    margin-bottom: 20px;
    font-weight: 700;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }

  .tab {
    border: 0;
    background: transparent;
    padding: 11px 15px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 650;
    border-bottom: 3px solid transparent;
  }

  .tab.active {
    color: var(--plum);
    border-bottom-color: var(--plum);
  }

  .section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
  }

  .section-header {
    padding: 14px 16px;
    background: #faf9fa;
    border-bottom: 1px solid var(--border);
    font-weight: 750;
  }

  .section-body { padding: 16px; }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .option {
    border: 1px solid var(--border);
    background: white;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
  }

  .option.selected {
    background: var(--plum-light);
    border-color: #b99fb1;
    color: var(--plum-dark);
    font-weight: 700;
  }

  .option input { display: none; }

  label.block {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 650;
  }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 11px;
    font: inherit;
    background: white;
  }

  textarea { min-height: 85px; resize: vertical; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .full { grid-column: 1 / -1; }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
  }

  .photo-thumb {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    background: #f3f1f3;
  }

  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-count {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }

  .delete-entry {
    float: right;
    border: 1px solid #e2bfc2;
    background: white;
    color: var(--red);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 12px;
  }

  .history-badge {
    display:inline-block;
    padding:4px 7px;
    border-radius:5px;
    font-size:11px;
    font-weight:800;
    margin-bottom:7px;
    background:var(--plum-light);
    color:var(--plum-dark);
  }
  .history-badge.completed {
    background:var(--green-bg);
    color:var(--green);
  }
  .current-rental {
    border:1px solid #cdb7c8;
    background:#fcf9fc;
    border-radius:8px;
    padding:13px;
  }

  .status-banner {
    width:100%; border:0; background:transparent; padding:7px 0; text-align:left;
    font:inherit; font-weight:750; cursor:pointer; margin:8px 0 12px; color:var(--text);
  }
  .status-green, .status-yellow, .status-red { background:transparent; color:var(--text); }
  .status-dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px; vertical-align:-1px; background:#777; }
  .status-green .status-dot { background:#35a853; }
  .status-yellow .status-dot { background:#e0a400; }
  .status-red .status-dot { background:#d93025; }
  .status-blue .status-dot { background:#1976d2; }
  .status-large { padding:12px; border-radius:8px; }
  .month-options,.accessory-row { display:flex; gap:8px; flex-wrap:wrap; }
  .month-btn,.accessory-btn { border:1px solid var(--border); background:white; border-radius:8px; padding:9px 12px; font:inherit; cursor:pointer; }
  .month-btn.selected,.accessory-btn.selected { border-color:var(--plum); background:var(--plum-light); font-weight:700; }
  .month-btn { min-width:42px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .muted { color:var(--muted); font-size:12px; }
  .settings { margin-left:6px; }

  .overview-stat { padding:10px 0; border-bottom:1px solid var(--border); }
  .overview-stat:last-child { border-bottom:0; }
  .extension-list { margin-top:9px; padding-top:8px; border-top:1px solid var(--border); }
  .extension-row { margin-top:5px; font-size:13px; }

  .history-item {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
  }
  .history-item:last-child { border-bottom: 0; }
  .history-date { color: var(--muted); font-size: 12px; }
  .history-title { font-weight: 700; margin: 3px 0; }

  .empty {
    padding: 35px;
    text-align: center;
    color: var(--muted);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(25,18,24,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    width: min(620px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }

  .modal-head {
    padding: 17px 19px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-head h3 { margin: 0; }
  .modal-body { padding: 19px; }
  .modal-foot {
    padding: 14px 19px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }



  .photo-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.94);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
  }
  .photo-lightbox.open { display: flex; }
  .photo-lightbox > img {
    max-width: 92vw;
    max-height: 86vh;
    object-fit: contain;
    user-select: none;
  }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    border: 0;
    color: white;
    background: rgba(0,0,0,.35);
    cursor: pointer;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 30px;
    line-height: 40px;
    z-index: 2;
  }
  .lightbox-close { top: 14px; right: 14px; font-size: 32px; }
  .lightbox-prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lightbox-count {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.45);
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 13px;
  }


  .maintenance-date { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .edit-extension-btn { margin-top: 5px; font-size: 12px; padding: 5px 8px; }
  .photo-edit-wrap { position: relative; width:100%; min-width:0; }
  .photo-preview-button { display:block; width:100%; min-width:0; }
  .photo-delete { position:absolute; top:6px; right:6px; width:24px; height:24px; border:0; border-radius:50%; background:rgba(0,0,0,.72); color:white; font-weight:800; cursor:pointer; z-index:2; }
  .photo-preview-button { border:0; padding:0; background:transparent; cursor:pointer; width:100%; }
  .lightbox-delete { position:absolute; top:14px; left:14px; border:0; border-radius:7px; padding:8px 12px; background:rgba(164,62,69,.9); color:white; font-weight:700; cursor:pointer; z-index:3; }

  /* Slide track: each photo gets its own full-viewport-width slide, and the
     whole strip translates horizontally to move between them — the same
     mechanism used by the rental calendar's swipeable periods. */
  .lightbox-track-viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: pan-y;
  }
  .lightbox-track {
    display: flex;
    width: 100%;
    height: 100%;
    will-change: transform;
  }
  .lightbox-slide {
    flex: 0 0 100%;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 45px 50px;
    box-sizing: border-box;
  }
  .lightbox-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    opacity: 0;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity .18s ease-out;
  }
  .lightbox-img.loaded { opacity: 1; }
  .lightbox-loader {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25);
    border-top-color: rgba(255,255,255,.85);
    animation: lightbox-spin .8s linear infinite;
    display: none;
    z-index: 1;
  }
  .lightbox-loader.visible { display: block; }
  @keyframes lightbox-spin { to { transform: rotate(360deg); } }

  .photo-picker {
    margin-top: 14px;
    border: 1px dashed #cfc6cd;
    border-radius: 9px;
    padding: 14px;
    background: #fbfafb;
  }

  .photo-picker input[type="file"] {
    width: 100%;
    font: inherit;
  }

  .photo-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
  }

  .photo-button {
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    min-width: 0;
  }

  .edit-photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); width:100%; }
  .return-edit-photo-grid { display:grid !important; grid-template-columns:repeat(3, minmax(0, 1fr)) !important; width:100% !important; gap:10px !important; }
  .return-edit-photo-grid .photo-edit-wrap { width:100% !important; min-width:0 !important; max-width:none !important; }
  .return-edit-photo-grid .photo-preview-button { display:block !important; width:100% !important; min-width:0 !important; max-width:none !important; }
  .return-edit-photo-grid .photo-thumb { display:block !important; width:100% !important; max-width:none !important; height:auto !important; aspect-ratio:1/1 !important; object-fit:cover !important; }

  .photo-thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    min-width: 0;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid var(--border);
  }

  .entry-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 9px;
  }

  .delete-entry {
    border: 1px solid #e2bfc2;
    background: white;
    color: var(--red);
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
  }



  .hidden { display: none !important; }

  @media (min-width: 761px) {
    body { max-width: 100vw; }
    .content { max-width: 1100px; }
    .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 760px) {
    body { overflow: hidden; }
    .app, .workspace, main { min-height: 0; }
    main { width: 100%; min-width: 0; height: calc(100vh - 68px); }
    .title-row { flex-direction: column; gap: 12px; }
    header { gap: 8px; }
    header h1 { font-size: 20px; }
    .header-actions { width: 100%; display:flex; gap:6px; }
    .header-actions .settings { flex:1 1 0; min-width:0; padding:8px 6px; font-size:12px; }
    .title-row .action-row { width: 100%; }
    .action-row button { flex: 1 1 auto; }
    h2 { font-size: 25px; }
    .tabs { overflow-x: auto; }
    .tab { white-space: nowrap; }
    .modal { max-height: 94vh; }
  }
/* Return Assessment photo preview: three equal, full-width thumbnails. */
#returnPhotoPreview.return-edit-photo-grid,
#returnPhotoPreview.photo-grid,
#returnPhotoPreview .return-assessment-photo-grid {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  grid-auto-flow: row !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
  gap: 10px !important;
  align-items: stretch !important;
  box-sizing: border-box !important;
}
#returnPhotoPreview .photo-edit-wrap {
  width: 100% !important;
  min-width: 0 !important;
  max-width: none !important;
  display: block !important;
}
#returnPhotoPreview .photo-preview-button {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: none !important;
  padding: 0 !important;
  margin: 0 !important;
}
#returnPhotoPreview .photo-thumb {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: none !important;
  height: auto !important;
  aspect-ratio: 1 / 1 !important;
  object-fit: cover !important;
}

/* Inventory and DSC each live in their own permanent pane so that switching
   between them never destroys/recreates DOM nodes (and therefore never
   forces already-loaded images to redecode). Only one pane is visible at a
   time; the other stays fully mounted but hidden. */
.detail-pane[hidden] { display: none !important; }
</style>

<style id="return-assessment-photo-grid-css">
/* Return Assessment photo thumbnails are deliberately independent from the
   history thumbnails. The grid controls placement; each image fills exactly
   one grid column and is square. */
#returnPhotoPreview .return-assessment-photo-grid {
  display:grid !important;
  grid-template-columns:repeat(3, minmax(0, 1fr)) !important;
  grid-auto-rows:auto !important;
  gap:10px !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  margin-top:10px !important;
  box-sizing:border-box !important;
}
#returnPhotoPreview .return-assessment-photo-button {
  display:block !important;
  width:100% !important;
  min-width:0 !important;
  max-width:none !important;
  aspect-ratio:1 / 1 !important;
  padding:0 !important;
  margin:0 !important;
  border:1px solid var(--border) !important;
  border-radius:7px !important;
  overflow:hidden !important;
  background:#f3f1f3 !important;
  cursor:pointer !important;
}
#returnPhotoPreview .return-assessment-photo-thumb {
  display:block !important;
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  max-width:none !important;
  min-height:0 !important;
  object-fit:cover !important;
  aspect-ratio:1 / 1 !important;
}
</style>

<style id="rental-history-v20-styling">
/* Completed rental cycles: one visually distinct rounded card per cycle. */
.history-item.completed-rental {
  background: #f7fbff !important;
  border: 1px solid #c9d8e8 !important;
  border-radius: 14px !important;
  padding: 14px !important;
  margin: 0 0 12px 0 !important;
  box-sizing: border-box !important;
}

/* Customer name: 1.5x, blue, bold and underlined, with a blank row beneath. */
.history-item.completed-rental .history-title {
  font-size: 1.5em !important;
  line-height: 1.25 !important;
  font-weight: 700 !important;
  color: #3697ff !important;
  text-decoration: none !important;
  margin-bottom: 1em !important;
}
</style>


<style id="current-rental-name-v21-styling">
/* Current/open rental: customer name uses the same visual treatment as
   completed rental-history customer names. The spacing is based on the
   following text's font size (1em), not the enlarged name font size. */
.current-rental .history-title,
.current-rental .rental-title,
.current-rental .customer-name,
.current-rental .rental-customer-name,
.current-rental .customer {
  font-size: 1.5em !important;
  line-height: 1.25 !important;
  font-weight: 700 !important;
  color: #3697ff !important;
  text-decoration: none !important;
  margin-bottom: 1em !important;
}
</style>


<style id="rental-period-v22-styling">

<script>
const TODAY = new Date();
const todayISO = () => new Date().toISOString().slice(0,10);

const defaultCategories = {
  cleanliness: ["Very Clean", "Okay", "Very Dirty", "Needs Deep Cleaning"],
  damage: ["No damage", "Veneer damage", "Mesh damage", "Other damage"],
  missing: ["Missing charger", "Missing mattress", "Missing sack", "Missing sheet", "Missing leg lifters"],
  cleaning: ["Deep cleaning", "Spot cleaning", "Wipe down", "Vacuuming"],
  maintenance: ["Replace motor O-rings", "Replace bearing O-rings", "Replace motor bearings", "Grease bearings", "Repair clip cables", "Repair audio cable", "Replaced microphone", "Veneer touch-up"]
};

const DATA_KEY = "msbSnooDataV2";
const CAT_KEY = "msbCategoriesV2";
let categories = loadJSON(CAT_KEY, structuredClone(defaultCategories));
let data = loadJSON(DATA_KEY, null);
let snoos = data?.snoos || createInitialSnoos();
let selectedId = data?.selectedId || "MSB-001";
let activeTab = "rentals";
let photoSets = {};
let photoSetCounter = 0;

function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}

function saveData() {
  normalizeRecords();
  Object.values(snoos).forEach(recalculateStatusFromHistory);
  const payload = { version: 2, savedAt: new Date().toISOString(), snoos, categories, selectedId };
  localStorage.setItem(DATA_KEY, JSON.stringify(payload));
  localStorage.setItem(CAT_KEY, JSON.stringify(categories));
}

function createInitialSnoos() {
  const result = {};
  for (let i = 1; i <= 24; i++) {
    const id = `MSB-${String(i).padStart(3,"0")}`;
    result[id] = {
      id, rental: null, returns: [], maintenance: [],
      status: {level:"red", label:"Needs deep cleaning before next rental"},
      createdAt: new Date().toISOString()
    };
  }
  return result;
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function formatDate(v) {
  if (!v) return "—";
  const d = new Date(v + "T12:00:00");
  return isNaN(d) ? "—" : d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function addMonths(dateStr, months) {
  const d = new Date(dateStr + "T12:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + Number(months));
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return d.toISOString().slice(0,10);
}
function daysUntil(date) {
  const d = new Date(date + "T12:00:00");
  const now = new Date(todayISO() + "T12:00:00");
  return Math.ceil((d-now)/86400000);
}
function ensureStatus(s) {
  if (!s.status) s.status = {level:"red", label:"Needs deep cleaning before next rental"};
}
function hasDeepClean(s){ return (s.maintenance||[]).some(m=>(m.cleaning||[]).some(x=>String(x).toLowerCase()==='deep cleaning')); }
function hasMotorORings(s){ return (s.maintenance||[]).some(m=>(m.maintenance||[]).some(x=>String(x).toLowerCase().includes('motor o-rings'))); }
function readinessState(s){
  const deep=hasDeepClean(s), orings=hasMotorORings(s), r=latestReturn(s);
  const hasAnyMaintenance=Array.isArray(s.maintenance) && s.maintenance.length>0;
  // The motor O-ring requirement applies ONLY to a brand-new SNOO with no
  // maintenance records at all. Once maintenance has begun, the app never
  // blocks a rental merely because the O-rings were not recorded again.
  if(!hasAnyMaintenance) {
    if(!deep && !orings) return {level:'red',label:'Needs deep cleaning before next rental, needs motor O-rings'};
    if(!deep) return {level:'red',label:'Needs deep cleaning before next rental'};
    if(!orings) return {level:'red',label:'Needs motor O-rings before next rental'};
  } else if(!deep) {
    return {level:'red',label:'Needs deep cleaning before next rental'};
  }

  // A return assessment ALWAYS changes the post-rental cleanliness state.
  // Normal cleanliness selections are yellow/Needs cleaning. Only the
  // explicit Needs Deep Cleaning selection is red. A later deep-cleaning
  // maintenance entry can restore green.
  if(r) {
    const cleanliness=String(r.cleanliness||'').trim().toLowerCase();
    const needsDeep=cleanliness.includes('needs deep cleaning');
    const returnedOn=r.checkinDate||r.date;
    const returnStamp=r.recordedAt||((returnedOn||'')+'T23:59:59');
    const cleaningAfter=(s.maintenance||[]).filter(m=>{
      const stamp=m.recordedAt||((m.date||'')+'T12:00:00');
      return stamp > returnStamp && Array.isArray(m.cleaning) && m.cleaning.length>0;
    });
    const deepAfter=cleaningAfter.some(m=>
      m.cleaning.some(x=>String(x).trim().toLowerCase()==='deep cleaning')
    );
    const anyCleaningAfter=cleaningAfter.length>0;
    if(deepAfter) return {level:'green',label:'Deep cleaned'};
    // A return marked as Needs Deep Cleaning remains red until an actual
    // Deep Cleaning maintenance entry is recorded. Other cleaning does not
    // clear that requirement.
    if(needsDeep) return {level:'red',label:'Needs deep cleaning before next rental'};
    // Any non-deep cleaning performed after a normal return changes the
    // yellow state from Needs Cleaning to Cleaned.
    if(anyCleaningAfter) return {level:'yellow',label:'Cleaned'};
    return {level:'yellow',label:'Needs cleaning before next rental'};
  }
  return {level:'green',label:'Deep cleaned'};
}
function statusInfo(s) {
  const state=readinessState(s);
  if (s.rental) return {text:"Currently rented", cls:"status-rented", level:"rented"};
  return {text:state.label, cls:state.level==='red'?'status-attention':state.level==='yellow'?'status-warning':'status-clean', level:state.level};
}
function rentalDurationText(r) {
  if (!r) return "";
  const parts = [Number(r.months || 1)];
  (r.extensions || []).forEach(e => {
    const n = Number(e.months || 0);
    if (n > 0) parts.push(n);
  });
  return `${parts.join(" + ")} ${parts.length === 1 ? "month" : "months"}`;
}
function statusBanner(s) {
  if (s.rental) return {text:`Currently in a rental (${rentalDurationText(s.rental)})`, cls:"status-blue"};
  const state=readinessState(s); s.status=state;
  return {text:state.label, cls:state.level==='red'?'status-red':state.level==='yellow'?'status-yellow':'status-green'};
}
function isReadyToRent(s) { const state=readinessState(s); return !s.rental && state.level==='green' || (!s.rental && state.level==='yellow' && state.label==='Cleaned'); }
function latestReturn(s) { return s.returns.length ? s.returns[s.returns.length-1] : null; }
function rentalTotalMonths(r){return Number(r?.months||1)+(r?.extensions||[]).reduce((n,e)=>n+Number(e.months||0),0);}
function normalizeRecords(){
  Object.values(snoos).forEach(s=>{
    s.returns=s.returns||[]; s.maintenance=s.maintenance||[];
    s.returns.forEach(r=>{r.extensions=r.extensions||[]; if(!r.id)r.id=crypto.randomUUID?.()||String(Date.now()+Math.random());});
    if(s.rental){s.rental.extensions=s.rental.extensions||[]; if(!s.rental.id)s.rental.id=crypto.randomUUID?.()||String(Date.now()+Math.random());}
    // Older versions could create duplicate return records for the same rental cycle.
    const byCycle=new Map();
    for(const r of s.returns){
      const key=r.rentalId || [r.customer,r.checkoutDate].join('|');
      if(!byCycle.has(key)){r.rentalId=key;byCycle.set(key,r);continue;}
      const keep=byCycle.get(key);
      if((r.photos||[]).length && !(keep.photos||[]).length) keep.photos=r.photos;
      if(r.checkinDate && !keep.checkinDate) keep.checkinDate=r.checkinDate;
    }
    s.returns=[...byCycle.values()];
  });
}
normalizeRecords();
Object.values(snoos).forEach(recalculateStatusFromHistory);
function latestMaintenance(s) { return s.maintenance.length ? s.maintenance[s.maintenance.length-1] : null; }
function countRentalsSince(s, predicate) {
  let count = 0;
  for (let i=s.returns.length-1;i>=0;i--) {
    const r=s.returns[i];
    if (predicate(r)) break;
    count++;
  }
  return count;
}
function lastMaintenanceIndex(s, fn) {
  for (let i=s.maintenance.length-1;i>=0;i--) if (fn(s.maintenance[i])) return i;
  return -1;
}
function rentalCycleCountAfter(s, date) {
  // Count only COMPLETED rental cycles (checkout + check-in), never
  // extensions and never the currently active rental. The check-in date
  // is what makes a cycle count toward this statistic.
  const cutoff = date || "";
  return (s.returns || []).filter(r => {
    const checkin = r.checkinDate || "";
    if (!checkin) return false;
    const checkout = r.checkoutDate || r.date || "";
    return checkout >= cutoff && checkin >= cutoff;
  }).length;
}

function timesRentedSinceDeepClean(s) {
  const idx=lastMaintenanceIndex(s,m=>(m.cleaning||[]).some(x=>String(x).trim().toLowerCase()==='deep cleaning'));
  if(idx<0) return (s.returns||[]).filter(r=>r.checkinDate).length;
  return rentalCycleCountAfter(s,s.maintenance[idx].date);
}
function timesRentedSinceORing(s) {
  const idx=lastMaintenanceIndex(s,m=>(m.maintenance||[]).some(x=>String(x).toLowerCase().includes('motor o-rings')));
  if(idx<0) return (s.returns||[]).filter(r=>r.checkinDate).length;
  return rentalCycleCountAfter(s,s.maintenance[idx].date);
}

function renderList() {
  document.getElementById("inventoryCount").textContent = `${Object.keys(snoos).length} bassinets`;
  document.getElementById("snooList").innerHTML = Object.values(snoos).map(s => {
    const st=statusInfo(s);
    return `<button class="snoo ${s.id===selectedId?"active":""}" onclick="selectSnoo('${s.id}')"><div class="snoo-id">${s.id}</div><div class="snoo-status ${st.cls}">${esc(st.text)}</div></button>`;
  }).join("");
}
function selectSnoo(id) { selectedId=id; activeTab="overview"; saveData(); renderList(); renderDetail(); }

function renderDetail() {
  const s=snoos[selectedId]; ensureStatus(s);
  const st=statusInfo(s), banner=statusBanner(s);
  const days=s.rental ? daysUntil(s.rental.end) : 0;
  const rentalHtml=s.rental ? `<div class="card"><div class="card-label">Current rental</div><div class="card-value">${esc(s.rental.customer)}</div><div>${formatDate(s.rental.start)} – ${formatDate(s.rental.end)}</div><div class="availability rented">${days>=0?`${days} days remaining`:"Past expected return date"}</div></div>` : `<div class="card"><div class="card-label">Current rental</div><div class="card-value">Available</div><div>No active rental</div></div>`;
  const ready = isReadyToRent(s);
  const statusButton = `<button class="status-banner ${banner.cls}" onclick="openMaintenanceFromStatus()" title="Open Maintenance / Cleaning"> <span class="status-dot"></span>${esc(banner.text)}</button>`;

  document.getElementById("detail").innerHTML=`
    <div class="title-row"><div><h2>${s.id}</h2></div><div class="action-row">
      ${s.rental ? `<button class="primary" onclick="openReturn()">Return assessment</button><button class="secondary" onclick="openExtension()">Extend</button>` : `<button class="primary" ${ready?"":"disabled"} onclick="openCheckout()">Check out for rental</button>`}
      <button class="secondary" onclick="openMaintenance()">Maintenance</button>
    </div></div>
    ${statusButton}
    <div class="summary">${rentalHtml}</div>
    <div class="tabs"><button class="tab ${activeTab==='overview'?"active":""}" onclick="setTab('overview')">Overview</button><button class="tab ${activeTab==='rentals'?"active":""}" onclick="setTab('rentals')">Rental history</button><button class="tab ${activeTab==='maintenance'?"active":""}" onclick="setTab('maintenance')">Maintenance history</button></div>
    <div id="tabContent"></div>`;
  renderTabContent();
}
function setTab(tab){activeTab=tab;renderDetail();}

function renderTabContent(){
  const s=snoos[selectedId],el=document.getElementById("tabContent");
  if(activeTab==='overview'){
    el.innerHTML=`<div class="section"><div class="section-header">Overview</div><div class="section-body"><div class="overview-stat"><div class="card-label">Times rented since last deep cleaning</div><div class="card-value">${timesRentedSinceDeepClean(s)}</div></div><div class="overview-stat"><div class="card-label">Times rented since last motor O-ring change</div><div class="card-value">${timesRentedSinceORing(s)}</div></div></div></div>`;
  } else if(activeTab==='rentals'){
    const extensionHtml = (s.rental?.extensions||[]).map((e,i)=>`<div class="extension-row"><strong>Extension ${i+1}:</strong> +${e.months} month${e.months==1?'':'s'} &nbsp; ${formatDate(e.from)} → ${formatDate(e.to)}${e.price!=null?` &nbsp; $${esc(e.price)}`:''}<br><button class="secondary edit-extension-btn" onclick="event.stopPropagation();editExtension(${i})">Edit extension</button></div>`).join('');
    const current=s.rental?`<div class="history-item current-rental" onclick="editActiveRental()"><div class="history-badge">CURRENTLY RENTED — NO RETURN YET</div><div class="history-title">${esc(s.rental.customer)}</div><div><strong>Checked out:</strong> ${formatDate(s.rental.start)}</div><div><strong>Current expected return:</strong> ${formatDate(s.rental.end)}</div><div><strong>Total rental period:</strong> ${rentalTotalMonths(s.rental)} month${rentalTotalMonths(s.rental)==1?'':'s'}</div><div><strong>Current price:</strong> $${esc(s.rental.price??'')}</div>${extensionHtml?`<div class="extension-list"><strong>Extensions</strong>${extensionHtml}</div>`:''}<div class="muted">Tap to edit rental</div></div>`:`<div class="empty">This SNOO is not currently rented.</div>`;
    const completed=s.returns.length?s.returns.slice().reverse().map((r,ri)=>{const i=s.returns.length-1-ri;const ex=(r.extensions||[]).map((e,j)=>`<div class="extension-row"><strong>Extension ${j+1}:</strong> +${e.months} month${e.months==1?'':'s'} &nbsp; ${formatDate(e.from)} → ${formatDate(e.to)}${e.price!=null?` &nbsp; $${esc(e.price)}`:''}<br><button class="secondary edit-extension-btn" onclick="event.stopPropagation();editCompletedExtension(${i},${j})">Edit extension</button></div>`).join('');return `<div class="history-item completed-rental" onclick="editRentalEntry(${i})"><button class="delete-entry" onclick="event.stopPropagation();deleteReturnEntry(${i})">Delete</button><button class="secondary small-history-button" onclick="event.stopPropagation();openReturn(snoos[selectedId].returns[${i}],${i})">Edit return assessment</button><div class="history-badge completed">COMPLETED RENTAL — CHECKED OUT & RETURNED</div><div class="history-title">${esc(r.customer||"Customer not recorded")}</div><div><strong>Checked out:</strong> ${formatDate(r.checkoutDate)}</div><div><strong>Expected return:</strong> ${formatDate(r.expectedReturnDate)}</div><div><strong>Checked in:</strong> ${formatDate(r.checkinDate||r.date)}</div><div><strong>Total rental period:</strong> ${rentalTotalMonths(r)} month${rentalTotalMonths(r)==1?'':'s'}</div><div><strong>Price:</strong> $${esc(r.price??'')}</div>${ex?`<div class="extension-list"><strong>Extensions</strong>${ex}</div>`:''}<div><strong>Return condition:</strong> ${esc(r.cleanliness)}</div><div><strong>Damage:</strong> ${esc((r.damage||[]).join(", ")||"None")}</div>${r.otherDamage?`<div><strong>Other damage:</strong> ${esc(r.otherDamage)}</div>`:""}<div><strong>Missing:</strong> ${esc((r.missing||[]).join(", ")||"None")}</div>${photoHtmlClickable(r.photos)}${r.notes?`<div>${esc(r.notes)}</div>`:""}<div class="muted">Tap entry to edit</div></div>`}).join(''):`<div class="empty">No completed rental cycles yet.</div>`;
    el.innerHTML=`<div class="section"><div class="section-header">Current / Open Rental</div><div class="section-body">${current}</div></div><div class="section"><div class="section-header">Completed Rental Cycles</div><div class="section-body">${completed}</div></div>`;
  } else {
    el.innerHTML=`<div class="section"><div class="section-header">Maintenance and cleaning history</div><div class="section-body">${s.maintenance.length?s.maintenance.slice().reverse().map((m,ri)=>{const i=s.maintenance.length-1-ri;return `<div class="history-item" onclick="editMaintenanceEntry(${i})"><button class="delete-entry" onclick="event.stopPropagation();deleteMaintenanceEntry(${i})">Delete</button><div class="maintenance-date">${formatDate(m.date)}</div>${m.cleaning?.length?`<div><strong>Cleaning:</strong> ${esc(m.cleaning.join(", "))}</div>`:""}${m.maintenance?.length?`<div><strong>Maintenance:</strong> ${esc(m.maintenance.join(", "))}</div>`:""}${m.other?`<div><strong>Other:</strong> ${esc(m.other)}</div>`:""}${m.notes?`<div>${esc(m.notes)}</div>`:""}<div class="muted">Tap entry to edit</div></div>`}).join(''):`<div class="empty">No maintenance history yet.</div>`}</div></div>`;
  }
}

function optionButtons(name,values,multiple=false,selected=[]){
  return `<div class="options">${values.map(v=>`<label class="option ${selected.includes(v)?"selected":""}"><input type="${multiple?'checkbox':'radio'}" name="${name}" value="${esc(v)}" ${selected.includes(v)?"checked":""}>${esc(v)}</label>`).join('')}</div>`;
}
function wireOptions(){document.querySelectorAll(".option input").forEach(input=>input.addEventListener("change",()=>{if(input.type==='radio')document.querySelectorAll(`input[name="${input.name}"]`).forEach(x=>x.parentElement.classList.remove('selected'));input.parentElement.classList.toggle('selected',input.checked);}));}
function checked(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value);}
function openModal(title,body){const save=document.getElementById('modalSave');save.style.display='';save.disabled=false;save.textContent='Save changes';save.onclick=null;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('open');}
function setModalSaveHandler(handler){const b=document.getElementById('modalSave');b.style.display='';b.disabled=false;b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await handler();}catch(err){console.error(err);b.disabled=false;if(err&&err.message==='validation')return;alert('Unable to save this entry. Please try again.');}};}
function hideModalSave(){const b=document.getElementById('modalSave');b.style.display='none';b.onclick=null;}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');window.returnPhotoState=null;window.dscPhotoState=null;}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>resolve({name:file.name,type:file.type,data:reader.result,thumb:reader.result,path:null});
      img.onload=()=>{
        // Keep the full-resolution image for the lightbox, but create a separate
        // square thumbnail for the Return Assessment grid.
        const max=1400, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const fullData=canvas.toDataURL('image/jpeg',0.82);

        const thumbSize=500;
        const thumb=document.createElement('canvas');
        thumb.width=thumbSize; thumb.height=thumbSize;
        const tctx=thumb.getContext('2d');
        const side=Math.min(canvas.width,canvas.height);
        const sx=(canvas.width-side)/2;
        const sy=(canvas.height-side)/2;

  // Calendar / resource timeline. The three visible time periods (previous,
  // current, next) sit side-by-side on a horizontal track — the same
  // slide-track mechanism the photo lightbox uses. Tapping the arrow
  // buttons or swiping left/right both animate the track over by one full
  // pane, then the anchor date is committed and the three panes are
  // silently rebuilt centered on the new period (no visible jump).
  window.openCalendar=function(){calendarZoom='6month';calendarAnchor=new Date();openCalendarView()};
  function openCalendarView(){
    openModal('Rental Calendar',`<div class="calendar-wrap">
      <div class="calendar-toolbar">
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(-1)" aria-label="Previous">‹</button>
        <div class="calendar-toolbar-center">
          <div class="calendar-range-label" id="calendarRangeLabel"></div>
          <div class="calendar-zoom-group" role="group" aria-label="Zoom level">
            <button type="button" class="calendar-zoom-btn" data-zoom="6month" onclick="calendarSetZoom('6month')">6 mo</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="month" onclick="calendarSetZoom('month')">Month</button>
            <button type="button" class="calendar-zoom-btn" data-zoom="week" onclick="calendarSetZoom('week')">Week</button>
          </div>
        </div>
        <button type="button" class="secondary calendar-nav-btn" onclick="calendarShift(1)" aria-label="Next">›</button>
      </div>
      <button type="button" class="secondary calendar-today-btn" onclick="calendarGoToday()">Today</button>
      <div class="cal-track-viewport" id="calTrackViewport">
        <div class="cal-track" id="calTrack">
          <div class="cal-track-pane" data-role="prev"></div>
          <div class="cal-track-pane" data-role="current"></div>
          <div class="cal-track-pane" data-role="next"></div>
        </div>
      </div>
    </div>`);hideModalSave();calendarPaintPanes();calendarWireSwipe();
  }
  window.calendarSetZoom=function(zoom){
    if(zoom===calendarZoom) return;
    calendarZoom=zoom;
    calendarPaintPanes();
  };
  window.calendarGoToday=function(){ calendarAnchor=new Date(); calendarPaintPanes(); };

  const CAL_SLIDE_VELOCITY=2200; // px/sec — same feel as the photo lightbox slide
  let calDragging=false, calStartX=0, calDragDX=0, calAnimating=false;

  function calShiftedAnchor(anchor,dir){
    const d=new Date(anchor);
    if(calendarZoom==='6month') d.setMonth(d.getMonth()+dir*6);
    else if(calendarZoom==='month') d.setMonth(d.getMonth()+dir*1);
    else d.setDate(d.getDate()+dir*7);
    return d;
  }
  function calSlideDuration(px){ return Math.min(.45,Math.max(.16,px/CAL_SLIDE_VELOCITY)); }

  // Animate the track fully over to the prev/next pane (already rendered),
  // then commit the anchor change and instantly re-center with fresh panes.
  function calendarAnimateTo(dir){
    if(calAnimating) return;
    const track=document.getElementById('calTrack'), viewport=document.getElementById('calTrackViewport');
    if(!track||!viewport) return;
    calAnimating=true;
    const vw=viewport.offsetWidth;
    const target=dir<0?0:-2*vw;
    track.style.transition=`transform ${calSlideDuration(vw)}s ease-out`;
    track.style.transform=`translateX(${target}px)`;
    track.addEventListener('transitionend',function done(){
      track.removeEventListener('transitionend',done);
      calendarAnchor=calShiftedAnchor(calendarAnchor,dir);
      calendarPaintPanes();
      calAnimating=false;
    },{once:true});
  }
  window.calendarShift=function(dir){ calendarAnimateTo(dir); };

  function calendarWireSwipe(){
    const viewport=document.getElementById('calTrackViewport');
    const track=document.getElementById('calTrack');
    if(!viewport||!track||viewport.dataset.swipeBound) return;
    viewport.dataset.swipeBound='1';
    viewport.addEventListener('touchstart',e=>{
      if(calAnimating) return;
      calDragging=true; calStartX=e.touches[0].clientX; calDragDX=0;
      track.style.transition='none';
    },{passive:true});
    viewport.addEventListener('touchmove',e=>{
      if(!calDragging) return;
      calDragDX=e.touches[0].clientX-calStartX;
      track.style.transform=`translateX(${-viewport.offsetWidth+calDragDX}px)`;
    },{passive:true});
    viewport.addEventListener('touchend',()=>{
      if(!calDragging) return;
      calDragging=false;
      const vw=viewport.offsetWidth, dur=calSlideDuration(vw);
      if(calDragDX<-50){
        calAnimating=true;
        track.style.transition=`transform ${dur}s ease-out`;
        track.style.transform=`translateX(${-2*vw}px)`;
        track.addEventListener('transitionend',function done(){
          track.removeEventListener('transitionend',done);
          calendarAnchor=calShiftedAnchor(calendarAnchor,1);
          calendarPaintPanes();
          calAnimating=false;
        },{once:true});
      } else if(calDragDX>50){
        calAnimating=true;
        track.style.transition=`transform ${dur}s ease-out`;
        track.style.transform='translateX(0px)';
        track.addEventListener('transitionend',function done(){
          track.removeEventListener('transitionend',done);
          calendarAnchor=calShiftedAnchor(calendarAnchor,-1);
          calendarPaintPanes();
          calAnimating=false;
        },{once:true});
      } else {
        track.style.transition=`transform ${dur}s ease-out`;
        track.style.transform=`translateX(${-vw}px)`;
      }
    });
  }
  window.addEventListener('resize',()=>{ if(document.getElementById('calTrackViewport') && !calAnimating && !calDragging) calendarPaintPanes(); });

  // ---- Date helpers ----
  function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
  function startOfMonth(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonthsDate(d,n){ return new Date(d.getFullYear(),d.getMonth()+n,1); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function fmtShort(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  // Returns {rangeStart, rangeEnd (exclusive), columns:[{start,end(exclusive),label}]} for an arbitrary anchor date.
  function calendarComputeRange(anchor){
    anchor=anchor||calendarAnchor;
    if(calendarZoom==='6month'){
      // 6 columns, one per month, centered so the anchor's month is the 3rd column (i.e. 2 months of context before).
      const anchorMonth=startOfMonth(anchor);
      const rangeStart=addMonthsDate(anchorMonth,-2);
      const columns=[];
      for(let i=0;i<6;i++){
        const cs=addMonthsDate(rangeStart,i), ce=addMonthsDate(rangeStart,i+1);
        columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{month:'short',year:'2-digit'})});
      }
      return {rangeStart, rangeEnd:addMonthsDate(rangeStart,6), columns};
    }
    if(calendarZoom==='month'){
      // Columns = weeks (Sun-Sat) covering the anchor's month.
      const monthStart=startOfMonth(anchor);
      const monthEnd=addMonthsDate(monthStart,1);
      const rangeStart=startOfWeek(monthStart);
      const columns=[];
      let cursor=rangeStart;
      while(cursor<monthEnd){
        const ce=addDays(cursor,7);
        columns.push({start:cursor,end:ce,label:`${fmtShort(cursor)}`});
        cursor=ce;
      }
      return {rangeStart, rangeEnd:cursor, columns, title:monthStart.toLocaleDateString(undefined,{month:'long',year:'numeric'})};
    }
    // week: columns = days, covering the anchor's week (Sun-Sat).
    const rangeStart=startOfWeek(anchor);
    const columns=[];
    for(let i=0;i<7;i++){
      const cs=addDays(rangeStart,i), ce=addDays(rangeStart,i+1);
      columns.push({start:cs,end:ce,label:cs.toLocaleDateString(undefined,{weekday:'short'}),sublabel:String(cs.getDate())});
    }
    return {rangeStart, rangeEnd:addDays(rangeStart,7), columns};
  }
  function calendarRangeLabel(range){
    if(range.title) return range.title;
    const lastCol=range.columns[range.columns.length-1];
    const endDisplay=addDays(lastCol.end,-1);
    if(calendarZoom==='6month') return `${range.columns[0].start.toLocaleDateString(undefined,{month:'short',year:'numeric'})} – ${endDisplay.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`;
    return `${fmtShort(range.rangeStart)} – ${fmtShort(endDisplay)}`;
  }

  const CAL_ROW_H=60, CAL_LABEL_W=92;
  // Pure function: builds the grid markup for an arbitrary anchor date. No DOM writes.
  function calendarBuildGridHTML(anchor){
    const range=calendarComputeRange(anchor);
    const cols=range.columns;
    const labels=Object.values(snoos).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
    const totalSpanMs=range.rangeEnd-range.rangeStart;
    const colHeadHtml=cols.map(c=>`<div class="cal-col-head">${c.sublabel?`<span class="cal-col-head-main">${esc(c.label)}</span><span class="cal-col-head-sub">${esc(c.sublabel)}</span>`:esc(c.label)}</div>`).join('');

    // Today marker position (percentage across the full range), if visible.
    const now=new Date(); now.setHours(12,0,0,0);
    const todayPct=(now>=range.rangeStart && now<range.rangeEnd) ? (daysBetween(range.rangeStart,now)/((totalSpanMs)/86400000))*100 : null;
    const todayLine=todayPct!=null?`<div class="cal-today-line" style="left:${todayPct}%"></div>`:'';

    const palette=['bar-a','bar-b','bar-c','bar-d','bar-e','bar-f'];
    let colorCursor=0;
    const rows=labels.map(s=>{
      const rentals=[];
      if(s.rental) rentals.push(s.rental);
      (s.returns||[]).forEach(r=>rentals.push(r));
      let bars='';
      for(const r of rentals){
        const startRaw=r.start||r.checkoutDate, endRaw=r.end||r.expectedReturnDate||r.checkinDate||r.date;
        if(!startRaw) continue;
        const start=new Date(startRaw+'T00:00:00');
        const end=endRaw?new Date(endRaw+'T00:00:00'):addDays(start,1);
        if(end<=range.rangeStart || start>=range.rangeEnd) continue;
        const clampedStart=start<range.rangeStart?range.rangeStart:start;
        const clampedEnd=end>range.rangeEnd?range.rangeEnd:end;
        const leftPct=(daysBetween(range.rangeStart,clampedStart)/(totalSpanMs/86400000))*100;
        const widthPct=(daysBetween(clampedStart,clampedEnd)/(totalSpanMs/86400000))*100;
        const colorClass=palette[colorCursor%palette.length]; colorCursor++;
        const invoice=r.invoiceNumber?` <span class="cal-bar-invoice">${esc(r.invoiceNumber)}</span>`:'';
        // The bar is only rounded on an edge that is the rental's real start/end.
        // An edge that's simply clipped by the visible date range (the rental
        // continues before/after what's on screen) stays square, so it reads
        // as "cut off" rather than a rounded, finished edge.
        const clipLeft=start<range.rangeStart, clipRight=end>range.rangeEnd;
        const clipClass=`${clipLeft?' cal-bar-clip-left':''}${clipRight?' cal-bar-clip-right':''}`;
        bars+=`<div class="cal-bar ${colorClass}${clipClass}" style="left:${leftPct}%;width:${widthPct}%" title="${esc(r.customer||'')}${r.invoiceNumber?' — '+esc(r.invoiceNumber):''}"><span class="cal-bar-customer">${esc(r.customer||'Customer')}</span>${invoice}</div>`;
      }
      return `<div class="cal-row"><div class="cal-row-label">${esc(s.id)}</div><div class="cal-row-track">${bars}</div></div>`;
    }).join('');

    return {
      html: `<div class="cal-grid" style="--cal-cols:${cols.length};--cal-label-w:${CAL_LABEL_W}px">
        <div class="cal-head-row"><div class="cal-corner"></div><div class="cal-col-heads">${colHeadHtml}${todayLine}</div></div>
        <div class="cal-body">${rows}</div>
      </div>`,
      label: calendarRangeLabel(range)
    };
  }

  // Repaint all three panes centered on the current anchor and snap the
  // track back to center with no animation. Used on open, zoom change,
  // "Today", and right after a swipe/arrow navigation has settled.
  function calendarPaintPanes(){
    const track=document.getElementById('calTrack'); if(!track) return;
    const paneEl=role=>track.querySelector(`[data-role="${role}"]`);
    const prevPane=paneEl('prev'), curPane=paneEl('current'), nextPane=paneEl('next');
    const curBuild=calendarBuildGridHTML(calendarAnchor);
    if(prevPane) prevPane.innerHTML=calendarBuildGridHTML(calShiftedAnchor(calendarAnchor,-1)).html;
    if(curPane) curPane.innerHTML=curBuild.html;
    if(nextPane) nextPane.innerHTML=calendarBuildGridHTML(calShiftedAnchor(calendarAnchor,1)).html;
    const labelEl=document.getElementById('calendarRangeLabel');
    if(labelEl) labelEl.textContent=curBuild.label;
    document.querySelectorAll('.calendar-zoom-btn').forEach(b=>b.classList.toggle('selected',b.dataset.zoom===calendarZoom));
    const viewport=document.getElementById('calTrackViewport');
    const vw=viewport?viewport.offsetWidth:0;
    track.style.transition='none';
    track.style.transform=`translateX(${-vw}px)`;
  }

  // DSC mode.
  // Switching modes only re-renders a pane the first time it's shown (or when
  // explicitly refreshed/edited); otherwise we just reveal the pane that's
  // already sitting there, fully rendered images and all, so nothing has to
  // be reloaded or redecoded.
  function switchAppMode(mode){
    if(mode!=='inventory' && mode!=='dsc') return;
    const invPane=document.querySelector('[data-pane="inventory"]');
    const dscPane=document.querySelector('[data-pane="dsc"]');
    if(!invPane || !dscPane) return;
    appMode=mode;
    invPane.removeAttribute('id');dscPane.removeAttribute('id');
    (mode==='dsc'?dscPane:invPane).id='detail';
    invPane.hidden=(mode!=='inventory');

  function renderDSC(){document.querySelector('.app').classList.add('dsc-mode');document.querySelector('header h1').textContent='DSC';document.querySelector('header h1').title='Click to switch to Inventory';const pane=document.querySelector('[data-pane="dsc"]');pane.innerHTML=`<div class="title-row"><div><h2>DSC</h2><div class="snoo-serial">Deep Cleaning & Servicing</div></div><div class="action-row"><button class="primary" onclick="openDscInvoice()">New invoice</button><button class="secondary" onclick="renderDSC()">Refresh</button></div></div><div class="section dsc-history"><div class="section-header">Service invoice history</div><div class="section-body">${dscInvoices.length?dscInvoices.slice().reverse().map((x,ri)=>{const i=dscInvoices.length-1-ri;const invoiceDisplay=(x.invoiceNumber||'')+(x.invoiceType==='DSC'?'_DSC':x.invoiceType==='SERV'?'_SERV':'');return `<div class="history-item"><div class="history-title">${esc(x.customer||'Customer')} <span class="invoice-inline">${esc(invoiceDisplay)}</span></div><div><strong>Drop-off:</strong> ${formatDate(x.dropoffDate)} &nbsp; <strong>Expected by:</strong> ${formatDate(x.expectedBy)}</div><div><strong>Items:</strong> ${esc((x.items||[]).join(', ')||'None')}</div><div><strong>Services:</strong> ${esc((x.services||[]).join(', ')||'Not recorded')}</div>${x.notes?`<div><strong>Notes:</strong> ${esc(x.notes)}</div>`:''}${(x.beforePhotos||[]).length?`<div><strong>Before photos:</strong></div>${photoHtmlClickable(x.beforePhotos)}`:''}${(x.afterPhotos||[]).length?`<div><strong>After photos:</strong></div>${photoHtmlClickable(x.afterPhotos)}`:''}<div class="history-actions"><button class="secondary" onclick="editDscInvoice(${i})">Edit invoice</button><button class="secondary" onclick="editDscServicing(${i})">Edit service</button><button class="danger" onclick="deleteDscInvoice(${i})">Delete invoice</button></div></div>`}).join(''):`<div class="empty">No service invoices yet.</div>`}</div></div>`;pane.dataset.rendered='1';}

  window.openDscInvoice=function(existing=null,index=-1){const x=existing||{};openModal(existing?'Edit invoice':'New invoice',`<div class="form-grid"><div><label class="block">Customer name</label><input id="dscCustomer" value="${esc(x.customer||'')}"></div><div><label class="block">Invoice number</label><input id="dscInvoice" value="${esc(x.invoiceNumber||'')}"></div><div><label class="block">Drop-off date</label><input id="dscDropoff" type="date" value="${esc(x.dropoffDate||todayISO())}"></div><div><label class="block">Expected by date</label><input id="dscExpected" type="date" value="${esc(x.expectedBy||x.dropoffDate||todayISO())}"></div><div class="full"><label class="block">Items</label><div class="options">${['SNOO','Mattress','Adapter','Leg lifters','Dust bag'].map(v=>`<label class="option ${(x.items||['SNOO','Mattress','Adapter']).includes(v)?'selected':''}"><input type="checkbox" name="dscItems" value="${v}" ${(x.items||['SNOO','Mattress','Adapter']).includes(v)?'checked':''}>${v}</label>`).join('')}</div></div><div class="full"><label class="block">Notes / other</label><textarea id="dscNotes">${esc(x.notes||'')}</textarea></div><div class="full"><label class="block">Invoice type</label><div class="dsc-choice"><button type="button" class="secondary ${x.invoiceType==='DSC'?'selected':''}" id="dscType" onclick="document.getElementById('servType').classList.remove('selected');this.classList.add('selected')">DSC</button><button type="button" class="secondary ${x.invoiceType==='SERV'?'selected':''}" id="servType" onclick="document.getElementById('dscType').classList.remove('selected');this.classList.add('selected')">SERV</button></div></div></div>`);wireOptions();
    (function(){

<script id="v26-overrides">
(function(){
  // Put Select SNOO and Calendar on one row. Calendar is hidden while in DSC.
  const content=document.querySelector('.content');
  const picker=content?.querySelector('.snoo-picker');
  if(content && picker && !picker.parentElement.classList.contains('snoo-picker-row')){
    const row=document.createElement('div'); row.className='snoo-picker-row';
    picker.parentNode.insertBefore(row,picker); row.appendChild(picker);
    const cal=document.createElement('button'); cal.type='button'; cal.className='secondary snoo-calendar-button'; cal.textContent='Calendar'; cal.setAttribute('aria-label','Calendar'); cal.onclick=()=>openCalendar(); row.appendChild(cal);
  }

  function installResize(mode){
    const panel=document.querySelector('.detail-top-panel');
    const handle=document.querySelector('.panel-resizer[data-v26-mode="'+mode+'"]');
    if(!panel||!handle)return;
    const key='msbPanelHeight_'+mode;
    const saved=localStorage.getItem(key);
    if(saved && !panel.dataset.v26Sized) panel.style.height=saved+'px';
    panel.dataset.v26Sized='1';
    if(handle.dataset.v26Bound)return;
    handle.dataset.v26Bound='1';
    let startY=0,startH=0,drag=false;
    const move=e=>{if(!drag)return;const h=Math.max(90,Math.min(window.innerHeight*.65,startH+e.clientY-startY));panel.style.height=h+'px'};
    const up=()=>{if(!drag)return;drag=false;localStorage.setItem(key,String(Math.round(panel.getBoundingClientRect().height)));document.body.style.userSelect='';window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
    handle.addEventListener('pointerdown',e=>{drag=true;startY=e.clientY;startH=panel.getBoundingClientRect().height;document.body.style.userSelect='none';window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);e.preventDefault()});
  }

  function decorateDetail(){
    const detail=document.getElementById('detail'); if(!detail)return;
    // Move any Calendar action button back to the picker row.
    const row=document.querySelector('.snoo-picker-row');
    const actionCal=[...detail.querySelectorAll('.action-row button')].find(b=>b.textContent.trim()==='Calendar');
    if(actionCal) actionCal.remove();
    if(row && !row.querySelector('.snoo-calendar-button')){
      const cal=document.createElement('button');cal.type='button';cal.className='secondary snoo-calendar-button';cal.textContent='Calendar';cal.setAttribute('aria-label','Calendar');cal.onclick=()=>openCalendar();row.appendChild(cal);
    }
    // Inventory upper panel: title/status area becomes resizable.
    if(!detail.querySelector('.detail-top-panel') && detail.querySelector('.title-row')){
      const title=detail.querySelector('.title-row');
      const status=detail.querySelector('.status-banner');
      const panel=document.createElement('div');panel.className='detail-top-panel';
      title.parentNode.insertBefore(panel,title);panel.appendChild(title);if(status)panel.appendChild(status);
      const h=document.createElement('div');h.className='panel-resizer';h.dataset.v26Mode='inventory';h.setAttribute('aria-label','Drag to resize upper section');panel.after(h);
    }
    // DSC has no tabs, but gets the same saved divider behavior.
    if(document.querySelector('.dsc-history') && !detail.querySelector('.detail-top-panel')){
      const title=detail.querySelector('.title-row');
      if(title){const panel=document.createElement('div');panel.className='detail-top-panel';title.parentNode.insertBefore(panel,title);panel.appendChild(title);const h=document.createElement('div');h.className='panel-resizer';h.dataset.v26Mode='dsc';h.setAttribute('aria-label','Drag to resize upper section');panel.after(h)}
    }
    if(detail.querySelector('.dsc-history')) installResize('dsc'); else installResize('inventory');
    decorateMaintenance();
  }

  function decorateMaintenance(){
    const tab=document.getElementById('tabContent'); if(!tab)return;
    const items=tab.querySelectorAll('.history-item');
    if(!items.length)return;
    const overview=tab.querySelector('.overview-card');
    // If the maintenance list is present, remove tap-to-edit and add Edit below Delete.
    if(overview){
      items.forEach((item,ri)=>{
        item.removeAttribute('onclick');
        const old=item.querySelector('.v26-maint-actions'); if(old)old.remove();
        const deleteBtn=item.querySelector('.delete-entry'); if(!deleteBtn)return;
        const index=items.length-1-ri;
        const box=document.createElement('div');box.className='v26-maint-actions';
        const cloneDelete=deleteBtn.cloneNode(true);cloneDelete.onclick=()=>deleteMaintenanceEntry(index);
        deleteBtn.remove();
        box.appendChild(cloneDelete);box.appendChild(document.createElement('br'));
        const edit=document.createElement('button');edit.type='button';edit.className='secondary small-history-button';edit.textContent='Edit';edit.onclick=()=>editMaintenanceEntry(index);box.appendChild(edit);
        item.insertBefore(box,item.firstChild);
      });
    }
  }

  // Edit SNOO: only SNOO number + serial number. Existing SNOOs also get Delete SNOO.
  const originalOpenAddSnoo=window.openAddSnoo;
  window.openAddSnoo=function(existing=null){
    originalOpenAddSnoo(existing);
    const body=document.getElementById('modalBody'); if(!body)return;
    body.querySelector('#acquiredDate')?.closest('div')?.remove();
    body.querySelector('#acquiredPrice')?.closest('div')?.remove();
    if(existing){
      const foot=document.querySelector('#modalBackdrop .modal-foot');
      let del=document.getElementById('v26DeleteSnoo'); if(del)del.remove();
      del=document.createElement('button');del.id='v26DeleteSnoo';del.className='danger';del.textContent='Delete SNOO';
      del.style.marginRight='auto';
      del.onclick=()=>{if(!confirm(`Delete ${existing.id}? This will remove its rental, maintenance, assessment, and other records. This cannot be undone.`))return;const oldId=existing.id;delete snoos[oldId];if(selectedId===oldId){const ids=Object.keys(snoos).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));selectedId=ids[0]||null}saveData();closeModal();renderList();if(selectedId)renderDetail()};
      foot.insertBefore(del,foot.querySelector('[onclick*="closeModal"]')||foot.firstChild);
      // Replace the original save handler because its original version referenced acquired fields.
      setModalSaveHandler(()=>{
        let id=document.getElementById('newSnooId').value.trim().toUpperCase();
        if(!/^MSB-\d+$/.test(id)){alert('Enter a SNOO number such as MSB-025.');throw new Error('validation')}
        if(id!==existing.id && snoos[id]){alert('That SNOO number already exists.');throw new Error('validation')}
        if(id!==existing.id){const oldId=existing.id;snoos[id]=existing;delete snoos[oldId];existing.id=id;if(selectedId===oldId)selectedId=id}
        snoos[id].serialNumber=document.getElementById('serialNumber').value.trim();
        saveData();closeModal();renderList();renderDetail();
      });
    } else {
      // New SNOO uses the same reduced form; retain original save logic except acquired fields.
      setModalSaveHandler(()=>{
        let id=document.getElementById('newSnooId').value.trim().toUpperCase();
        if(!/^MSB-\d+$/.test(id)){alert('Enter a SNOO number such as MSB-025.');throw new Error('validation')}
        if(snoos[id]){alert('That SNOO number already exists.');throw new Error('validation')}
        const target=snoos[id]={id,rental:null,returns:[],maintenance:[],status:{level:'red',label:'Needs deep cleaning before next rental, needs motor O-rings'},createdAt:new Date().toISOString()};
        target.serialNumber=document.getElementById('serialNumber').value.trim();
        saveData();closeModal();renderList();renderDetail();
      });
    }
  };

  // Maintenance modal: double-tap/click blank space to invoke Save.
  document.addEventListener('dblclick',e=>{
    const modal=document.getElementById('modalBackdrop');if(!modal?.classList.contains('open'))return;
    if(!document.getElementById('modalTitle')?.textContent?.toLowerCase().includes('maintenance'))return;
    if(e.target.closest('button,input,textarea,label,.option,.modal-foot,.photo-button'))return;
    e.preventDefault();document.getElementById('modalSave')?.click();
  });

  const observer=new MutationObserver(()=>{requestAnimationFrame(decorateDetail)});
  const observedRoot=document.querySelector('.content');if(observedRoot)observer.observe(observedRoot,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
  decorateDetail();
})();
</script>

<script id="v28-final-fixes">
(function(){
  function decorateSplit(){
    const detail=document.getElementById('detail');
    if(!detail || document.body.classList.contains('v28-busy')) return;

    // Inventory: the upper fixed area includes title, serial/status and summary.
    // The resizer is the boundary; everything below it scrolls independently.
    const panel=detail.querySelector('.detail-top-panel');
    const handle=detail.querySelector('.panel-resizer');
    if(panel && handle){
      const summary=detail.querySelector(':scope > .summary');
      if(summary && summary.parentElement===detail && !panel.contains(summary)){
        panel.appendChild(summary);
      }

      let lower=detail.querySelector(':scope > .detail-lower-panel');
      if(!lower){
        lower=document.createElement('div');
        lower.className='detail-lower-panel';
        const nodes=[...detail.children];
        let after=false;
        nodes.forEach(node=>{
          if(node===handle){after=true;return}
          if(after && node!==lower) lower.appendChild(node);
        });
        detail.appendChild(lower);
      }
    } else {
      // DSC has no inventory tabs, but keep its page from being horizontally/vertically
      // distorted by the mobile browser chrome.
      detail.style.overflowY='auto';
    }

    // Header should read "Inventory" or "DSC" depending on the active mode.
    const h=document.querySelector('header h1');
    const inDsc=!!document.querySelector('.app.dsc-mode');
    if(h && !inDsc) h.textContent='Inventory';

    // DSC has no SNOO picker.
    const pickerRow=document.querySelector('.snoo-picker-row');
    if(pickerRow) pickerRow.style.display=inDsc?'none':'flex';

    decorateMaintenanceHistory();
    decorateCurrentRental();
  }

  function decorateMaintenanceHistory(){
    if(typeof activeTab==='undefined' || activeTab!=='maintenance') return;
    const tab=document.getElementById('tabContent');
    if(!tab) return;
    const items=[...tab.querySelectorAll('.history-item')];
    if(!items.length) return;
    items.forEach(item=>{
      item.removeAttribute('onclick');
      item.querySelectorAll('.muted').forEach(el=>{
        if(/tap entry to edit/i.test(el.textContent)) el.remove();
      });
    });
    items.forEach((item,ri)=>{
      if(item.querySelector('.v28-maint-actions')) return;
      const index=snoos[selectedId].maintenance.length-1-ri;
      if(index<0) return;
      const oldDelete=item.querySelector('.delete-entry');
      if(oldDelete) oldDelete.remove();
      const oldV26=item.querySelector('.v26-maint-actions');
      if(oldV26) oldV26.remove();

      const box=document.createElement('div');
      box.className='v28-maint-actions';

      const del=document.createElement('button');
      del.type='button'; del.className='danger'; del.textContent='Delete';
      del.onclick=e=>{e.stopPropagation();deleteMaintenanceEntry(index)};

      const edit=document.createElement('button');
      edit.type='button'; edit.className='secondary'; edit.textContent='Edit';
      edit.onclick=e=>{e.stopPropagation();editMaintenanceEntry(index)};

      box.append(del,edit);
      item.insertBefore(box,item.firstChild);
    });
  }

  function deleteActiveRental(){
    const s=snoos[selectedId];
    if(!s?.rental) return;
    if(!confirm('Delete this current rental? This cannot be undone.')) return;
    s.rental=null;
    saveData();
    renderList();
    renderDetail();
  }
  window.deleteActiveRental=deleteActiveRental;

  function deleteExtension(index){
    const s=snoos[selectedId],r=s?.rental;
    if(!r||!r.extensions?.[index]) return;
    if(!confirm('Delete this extension? This cannot be undone.')) return;
    r.extensions.splice(index,1);
    let cursor=addMonths(r.start,Number(r.months||1));
    for(const x of r.extensions){ x.from=cursor; x.to=addMonths(cursor,Number(x.months||1)); cursor=x.to; }
    r.end=cursor;
    saveData();
    renderList();
    renderDetail();
  }
  window.deleteExtension=deleteExtension;

  function decorateCurrentRental(){
    // Edit rental / Delete rental now live inside the Rental subcard itself
    // (see renderTabContent), so the parent card gets no buttons of its own.
    // This function just does light cleanup of any stale click handlers.
    if(typeof activeTab==='undefined' || activeTab!=='rentals') return;
    const card=document.querySelector('#tabContent .current-rental');
    if(!card) return;
    card.removeAttribute('onclick');
    card.querySelectorAll('.muted').forEach(el=>{
      if(/tap to edit rental/i.test(el.textContent)) el.remove();
    });
  }

  // The existing v26 maintenance dblclick handler saves any blank-space double tap.
  // Intercept it during capture when there is no actual maintenance selection.
  document.addEventListener('dblclick',function(e){
    const modal=document.getElementById('modalBackdrop');
    const title=document.getElementById('modalTitle')?.textContent?.toLowerCase()||'';
    if(!modal?.classList.contains('open') || !title.includes('maintenance')) return;
    if(e.target.closest('button,input,textarea,label,.option,.modal-foot,.photo-button')) return;
    const selected=[...document.querySelectorAll('#modalBody input[name="cleaning"]:checked,#modalBody input[name="maintenance"]:checked')];
    const other=(document.getElementById('otherMaint')?.value||'').trim();
    const notes=(document.getElementById('maintNotes')?.value||'').trim();
    if(selected.length || other || notes) return; // let the existing handler save
    e.preventDefault();
    e.stopImmediatePropagation();
  },true);

  // Re-run after every render without replacing the application's own render logic.
  const originalRenderDetail=window.renderDetail;
  if(originalRenderDetail && !window.__v28Wrapped){
    window.__v28Wrapped=true;
    window.renderDetail=function(){
      const result=originalRenderDetail.apply(this,arguments);
      requestAnimationFrame(decorateSplit);
      return result;
    };
  }

  // The current page may already have been rendered before this override loaded.
  requestAnimationFrame(decorateSplit);
})();
</script>

<script id="v30-final-ui-fixes-script">
(function(){
  const STATUS_PADDING = 12;

  function statusSafeMinimum(panel){
    const status = panel && panel.querySelector(':scope > .status-banner');
    if(!panel || !status) return 92;
    const panelRect = panel.getBoundingClientRect();
    const statusRect = status.getBoundingClientRect();
    return Math.max(92, Math.ceil(statusRect.bottom - panelRect.top + STATUS_PADDING));
  }

  /*
   * v29's divider listener already exists. We add a capture-phase pointermove
   * guard so that its calculated height can never place the divider above the
   * bottom of the status banner.
   */
  document.addEventListener('pointermove', function(e){
    const handle = e.target.closest?.('#detail .panel-resizer');
    if(!handle || !handle.dataset.v26Bound) return;
    const panel = handle.previousElementSibling;
    if(!panel || !panel.classList.contains('detail-top-panel')) return;
    const minH = statusSafeMinimum(panel);
    const currentH = panel.getBoundingClientRect().height;
    if(currentH < minH) panel.style.height = minH + 'px';
    panel.style.minHeight = minH + 'px';
  }, true);

  function finalizeLayout(){
    const detail=document.getElementById('detail');
    const panel=detail?.querySelector('.detail-top-panel');
    if(panel){
      panel.style.minHeight=statusSafeMinimum(panel)+'px';
    }
    const h=document.querySelector('header h1');
    const inDsc=!!document.querySelector('.app.dsc-mode');
    if(h && !inDsc){
      h.textContent='Inventory';
      h.title='Click to switch to DSC';
    }
  }

  const observer = new MutationObserver(()=>requestAnimationFrame(finalizeLayout));
  const observedRoot=document.querySelector('.content');
  if(observedRoot) observer.observe(observedRoot,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
  window.addEventListener('resize',finalizeLayout);
  window.addEventListener('orientationchange',finalizeLayout);
  requestAnimationFrame(finalizeLayout);
})();
</script>
